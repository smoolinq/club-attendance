<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新履歴</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.7;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 14px;
      font-size: 15px;
    }
    h2 {
      margin: 22px 0 8px;
      font-size: 20px;
      line-height: 1.4;
    }
    ul {
      margin: 8px 0 12px 20px;
      padding: 0;
      font-size: 15px;
    }
    li { margin: 6px 0; }
    .note {
      font-size: 14px;
      color: #444;
      margin-top: 10px;
    }
    .back {
      display: inline-block;
      margin: 0 0 14px;
      font-size: 14px;
      color: #333;
      text-decoration: underline;
    }
    .back.bottom {
      margin-top: 24px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!--
    追記テンプレ：
    <section class="entry">
      <h2>YYYY-MM-DD タイトル</h2>

    <a class="back" href="/">← アプリに戻る</a>
    <h1>更新履歴</h1>

      <ul>
        <li>保存APIの直接アクセスを無効化</li>
        <li>フロント経由の代理保存方式へ変更</li>
        <li>書き込みAPIに認証トークンを導入</li>
        <li>機密情報（adminPw / recoveryCode / pin）をGETレスポンスから除外</li>
        <li>外部サイトからの不正アクセスを防止（CORS制限）</li>
      </ul>
      <p class="note">※ユーザー操作への影響はありません。</p>

    <a class="back bottom" href="/">← アプリに戻る</a>
