<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="出欠ちゃん">
<meta property="og:description" content="部活などの練習、試合の出欠をかんたん共有。招待リンクですぐ使えます。">
<meta property="og:type" content="website">
<title>出欠ちゃん</title>
<style>
  :root {
    --primary: #5b21b6;
    --primary-light: #7c3aed;
    --bg: #f5f3ff;
    --card: #ffffff;
    --text: #1e1b4b;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --present: #16a34a;
    --absent: #dc2626;
    --late: #f59e0b;
    --early: #3b82f6;
    --unset: #d1d5db;
    --practice: #2563eb;
    --match: #db2777;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* === Header === */
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px 12px;
    flex-shrink: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(91,33,182,0.2);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  header h1 { font-size: 17px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-edit-row { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .title-edit-row input {
    flex: 1; min-width: 0; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 16px; font-weight: 700; padding: 4px 8px; border-radius: 8px; outline: none;
  }
  .title-edit-row input:focus { border-color: rgba(255,255,255,0.7); }
  .title-edit-row button {
    background: rgba(255,255,255,0.2); border: none; color: #fff; width: 28px; height: 28px;
    border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .title-edit-row button:active { background: rgba(255,255,255,0.35); }

  .settings-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settings-btn:active { background: rgba(255,255,255,0.3); }

  .date-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-row button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .date-row button:active { background: rgba(255,255,255,0.3); }

  #dateInput {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 15px;
    flex: 1;
    text-align: center;
  }
  #dateInput::-webkit-calendar-picker-indicator { filter: invert(1); }

  .today-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--primary);
    background: #ede9fe;
    border-radius: 8px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .header-none-count {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    text-align: center;
  }
  .header-none-count .count {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 3px 12px;
  }

  /* === Schedule Section === */
  .schedule-section {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .schedule-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }

  .schedule-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .schedule-row:last-child { margin-bottom: 0; }

  .schedule-label {
    font-size: 11px;
    font-weight: 700;
    width: 34px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .schedule-label-practice { color: var(--practice); }
  .schedule-label-match { color: var(--match); }

  .schedule-chip {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 2px solid transparent;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    line-height: 1.1;
  }
  .schedule-chip:active { transform: scale(0.92); }
  .schedule-chip .chip-dow { font-size: 9px; font-weight: 400; opacity: 0.7; }

  .chip-practice {
    background: #eff6ff;
    color: var(--practice);
    border-color: #bfdbfe;
  }
  .chip-practice.chip-today {
    background: var(--practice);
    color: #fff;
    border-color: var(--practice);
    box-shadow: 0 2px 8px rgba(37,99,235,0.3);
  }

  .chip-match {
    background: #fdf2f8;
    color: var(--match);
    border-color: #fbcfe8;
  }
  .chip-match.chip-today {
    background: var(--match);
    color: #fff;
    border-color: var(--match);
    box-shadow: 0 2px 8px rgba(219,39,119,0.3);
  }

  .chip-past-deadline {
    background: #f3f4f6 !important;
    color: #9ca3af !important;
    border-color: #d1d5db !important;
    box-shadow: none !important;
  }

  .chip-selected {
    outline: 3px solid var(--primary);
    outline-offset: 1px;
  }

  .schedule-empty {
    font-size: 12px;
    color: var(--text-light);
    padding: 4px 0;
  }

  /* === Context Bar (selected date info) === */
  .context-bar {
    padding: 12px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .context-date {
    font-size: 18px;
    font-weight: 700;
  }

  .context-mode {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .context-mode-practice { background: #dbeafe; color: var(--practice); }
  .context-mode-match { background: #fce7f3; color: var(--match); }

  .context-deadline {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-light);
  }
  .context-deadline.urgent {
    color: var(--absent);
    font-weight: 600;
  }

  /* === Summary === */
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    transition: background 0.4s ease;
    flex-shrink: 0;
  }
  .summary.flash { background: #ede9fe; }
  .summary span { display: flex; align-items: center; gap: 4px; }
  .summary .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-present { background: var(--present); }
  .dot-absent { background: var(--absent); }
  .dot-late { background: var(--late); }
  .dot-early { background: var(--early); }
  .dot-total { background: var(--primary); }
  .dot-none { background: var(--unset); }

  /* === Info lists (none / present) === */
  .info-list {
    padding: 8px 20px;
    background: #fafafa;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 8px;
    flex-shrink: 0;
  }
  .info-list strong { color: var(--text); font-weight: 600; font-size: 12px; }

  .copy-btn {
    margin-left: auto;
    padding: 2px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 11px;
    color: var(--text-light);
    cursor: pointer;
    white-space: nowrap;
  }
  .copy-btn:active { background: var(--bg); }

  /* === Member Cards === */
  main {
    padding: 10px 16px 100px;
    max-width: 600px;
    margin: 0 auto;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    width: 100%;
  }

  .member-card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    transition: background 0.6s ease;
  }
  .member-card.highlight { background: #ede9fe; }
  .member-card.locked { opacity: 0.45; pointer-events: none; }

  .reorder-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-right: 8px;
  }
  .reorder-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-light);
    font-size: 9px;
    width: 20px; height: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .reorder-btn:active { background: var(--bg); }

  .member-name {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }

  .badge-none {
    font-size: 10px;
    color: var(--text-light);
    background: #f3f4f6;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1px 7px;
    margin-left: 4px;
    white-space: nowrap;
  }

  .badge-time {
    font-size: 10px;
    font-weight: 600;
    border-radius: 8px;
    padding: 1px 7px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .badge-time-late { color: #92400e; background: #fef3c7; }
  .badge-time-early { color: #1e40af; background: #dbeafe; }

  .status-buttons { display: flex; gap: 5px; }

  .status-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #fff;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status-btn:active { transform: scale(0.92); }

  .status-btn[data-status="present"] { font-size: 20px; }
  .status-btn.active-present {
    border-color: var(--present);
    background: linear-gradient(135deg, #fef9c3, #dcfce7);
    box-shadow: 0 2px 8px rgba(22,163,74,0.15);
  }
  .status-btn.active-absent { border-color: var(--absent); background: #fee2e2; }
  .status-btn.active-late { border-color: var(--late); background: #fef3c7; }
  .status-btn.active-early { border-color: var(--early); background: #dbeafe; }

  .status-btn .btn-label {
    font-size: 13px;
    font-weight: 700;
    border: none;
    padding: 0;
    line-height: 1;
  }
  .status-btn.active-late .btn-label,
  .status-btn.active-early .btn-label { font-weight: 900; }


  .time-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-light);
  }
  .time-row input[type="time"] {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
  }

  .member-meta {
    width: 100%;
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--text-light);
    margin-top: 4px;
    padding-left: 2px;
  }


  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state p { font-size: 15px; margin-top: 8px; }

  /* === Modal === */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    width: min(90vw, 360px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }

  .modal input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 16px;
    outline: none;
  }
  .modal input[type="text"]:focus { border-color: var(--primary-light); }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    font-weight: 500;
  }

  .btn-cancel { background: var(--border); color: var(--text); }
  .btn-confirm { background: var(--primary); color: #fff; }
  .btn-confirm:active { background: var(--primary-light); }

  .modal-close-x {
    position: absolute;
    top: 12px; right: 12px;
    background: none; border: none;
    font-size: 22px; line-height: 1;
    color: var(--text-light);
    cursor: pointer;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .modal-close-x:hover { background: var(--bg); }
  .modal-close-x:active { background: var(--border); }

  .deadline-field {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text);
  }
  .deadline-field label { width: 40px; font-weight: 500; flex-shrink: 0; }
  .deadline-field input[type="number"] {
    width: 52px;
    padding: 6px 4px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
    outline: none;
  }
  .deadline-field input[type="number"]:focus { border-color: var(--primary-light); }
  .deadline-field select {
    padding: 6px 4px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: #fff;
  }
  .deadline-field select:focus { border-color: var(--primary-light); }

  /* === Calendar Edit Modal === */
  .cal-edit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--bg);
    flex-direction: column;
  }
  .cal-edit-overlay.show { display: flex; }

  .cal-edit-header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cal-edit-header h2 { font-size: 17px; font-weight: 700; }

  .cal-edit-body { overflow-y: auto; padding: 16px; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    max-width: 420px;
    margin: 0 auto;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    padding: 4px 0;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    color: var(--text);
    background: var(--card);
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.cal-empty { background: transparent; cursor: default; }
  .cal-cell.cal-practice {
    background: #dbeafe;
    color: var(--practice);
    border-color: var(--practice);
  }
  .cal-cell.cal-match {
    background: #fce7f3;
    color: var(--match);
    border-color: var(--match);
  }

  .cal-cell.cal-selected-day {
    outline: 3px solid var(--primary);
    outline-offset: 1px;
  }
  .cal-cell.cal-today-mark {
    font-weight: 900;
    text-decoration: underline;
  }

  .picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .picker-overlay.show { display: flex; }
  .picker-modal {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    width: min(90vw, 360px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .picker-header h3 { font-size: 16px; font-weight: 700; flex: 1; text-align: center; }
  .picker-nav {
    background: none;
    border: 1px solid var(--border);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .picker-nav:active { background: var(--bg); }

  .cal-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 16px 0 8px;
    font-size: 12px;
    color: var(--text-light);
  }
  .cal-legend span::before {
    content: '';
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .cal-legend .leg-practice::before { background: var(--practice); }
  .cal-legend .leg-match::before { background: var(--match); }

  .cal-edit-actions {
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
    background: var(--card);
  }
  .cal-edit-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .cal-edit-actions .btn-cancel { background: var(--bg); color: var(--text); }
  .cal-edit-actions .btn-confirm { background: var(--primary); color: #fff; }

  .schedule-edit-btn {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    font-weight: 600;
  }
  .schedule-edit-btn:active { opacity: 0.6; }
  .schedule-title { display: flex; align-items: center; }

  /* === Member Settings Modal === */
  .ms-close-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .ms-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .ms-name {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }
  .ms-role {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
  }
  .ms-delete {
    background: transparent;
    border: none;
    color: var(--absent);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .ms-add-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .ms-add-input {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
  }
  .ms-add-input:focus { border-color: var(--primary); }
  .ms-add-btn { padding: 10px 20px; border-radius: 12px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 id="appTitle" style="cursor:pointer"></h1>
    <span id="loginStatus" style="font-size:12px;padding:4px 8px;background:rgba(255,255,255,0.15);border-radius:8px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;cursor:pointer"></span>

<script>
  const INVITE_KEY = 'volley-invite';
  const _teamParam = new URL(location.href).searchParams.get("team");

  // Intercept invite URL: if team not in recent and no pending invite, save invite and redirect to lobby
  if (_teamParam) {
    const RECENT_KEY = 'volley-recent-teams';
    let recent = []; try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch {}
    const isKnown = recent.some(t => t.id === _teamParam);
    let pendingInvite = null; try { pendingInvite = JSON.parse(localStorage.getItem(INVITE_KEY)); } catch {}
    const isFromInviteCard = pendingInvite && pendingInvite.id === _teamParam;
    if (!isKnown && !isFromInviteCard) {
      const savedTitle = localStorage.getItem(_teamParam + ':volley-app-title');
      localStorage.setItem(INVITE_KEY, JSON.stringify({ id: _teamParam, name: savedTitle || null }));
      location.href = location.pathname;
      throw new Error('redirect to lobby');
    }
  }

  if (!_teamParam) {
    // --- Lobby Screen ---
    document.body.innerHTML = '';
    const RECENT_KEY = 'volley-recent-teams';
    function getRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } }

    // Lobby custom confirm
    function lobbyConfirm(msg) {
      return new Promise(resolve => {
        const ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px';
        ov.innerHTML = '<div style="max-width:300px;width:100%;text-align:center;background:#fff;border-radius:16px;padding:24px 20px 18px">' +
          '<div style="font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:20px;line-height:1.5;white-space:pre-line"></div>' +
          '<div style="display:flex;gap:8px">' +
            '<button style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-size:14px;font-weight:600;cursor:pointer">いいえ</button>' +
            '<button style="flex:1;padding:10px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:14px;font-weight:600;cursor:pointer">はい</button>' +
          '</div></div>';
        ov.querySelector('[style*="white-space"]').textContent = msg;
        const [noBtn, yesBtn] = ov.querySelectorAll('button');
        yesBtn.addEventListener('click', () => { ov.remove(); resolve(true); });
        noBtn.addEventListener('click', () => { ov.remove(); resolve(false); });
        document.body.appendChild(ov);
      });
    }

    const lobby = document.createElement('div');
    lobby.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;background:var(--bg)';

    const joinSection = document.createElement('div');
    joinSection.id = 'joinSection';
    joinSection.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:100%';

    const hero = document.createElement('div');
    hero.style.cssText = 'text-align:center;margin-bottom:28px';

  function generateDefaultSchedule() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const items = [];
    function fmt(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    for (let d = 1; d <= 31; d++) {
      const dt = new Date(y, m, d);
      if (dt.getMonth() !== m) break;
      const dow = dt.getDay();
      if (dow === 3 || dow === 6) items.push({ date: fmt(dt), mode: 'practice' });
    }
    let sunCount = 0;
    for (let d = 1; d <= 31; d++) {
      const dt = new Date(y, m, d);
      if (dt.getMonth() !== m) break;
      if (dt.getDay() === 0) {
        sunCount++;
        if (sunCount === 2 || sunCount === 4) items.push({ date: fmt(dt), mode: 'match' });
      }

  const dateInput = document.getElementById('dateInput');

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function shiftDate(days) {
    const d = new Date(dateInput.value);
    d.setDate(d.getDate() + days);
    dateInput.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    render();
  }

  dateInput.value = todayStr();
  dateInput.addEventListener('change', render);
  document.getElementById('prevDay').addEventListener('click', () => shiftDate(-1));
  document.getElementById('nextDay').addEventListener('click', () => shiftDate(1));

  // --- Custom Date Picker ---
  let pickerYear, pickerMonth;
  const pickerOverlay = document.getElementById('datePickerOverlay');

  dateInput.addEventListener('click', e => {
    e.preventDefault();
    const sel = new Date(dateInput.value + 'T00:00:00');
    pickerYear = sel.getFullYear();
    pickerMonth = sel.getMonth();
    renderPicker();
    pickerOverlay.classList.add('show');
  });
  // Prevent native picker on mobile
  dateInput.addEventListener('mousedown', e => e.preventDefault());
  dateInput.addEventListener('touchstart', e => { e.preventDefault(); dateInput.click(); }, {passive: false});

  pickerOverlay.addEventListener('click', e => { if (e.target === pickerOverlay) pickerOverlay.classList.remove('show'); });
  document.getElementById('pickerPrev').addEventListener('click', () => { pickerMonth--; if (pickerMonth < 0) { pickerMonth = 11; pickerYear--; } renderPicker(); });
  document.getElementById('pickerNext').addEventListener('click', () => { pickerMonth++; if (pickerMonth > 11) { pickerMonth = 0; pickerYear++; } renderPicker(); });

  function renderPicker() {
    document.getElementById('pickerTitle').textContent = pickerYear + '年' + (pickerMonth + 1) + '月';
    const grid = document.getElementById('pickerGrid');
    const schedule = loadSchedule();
    const prefix = pickerYear + '-' + String(pickerMonth + 1).padStart(2, '0');
    const monthSchedule = {};
    schedule.filter(s => s.date.startsWith(prefix)).forEach(s => { monthSchedule[s.date] = s.mode; });
    const today = todayStr();
    const selected = dateInput.value;
    const dows = ['日','月','火','水','木','金','土'];
    let html = dows.map(d => '<div class="cal-dow">' + d + '</div>').join('');
    const firstDay = new Date(pickerYear, pickerMonth, 1).getDay();
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell cal-empty"></div>';
    const daysInMonth = new Date(pickerYear, pickerMonth + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = prefix + '-' + String(d).padStart(2, '0');
      const mode = monthSchedule[ds];
      const cls = (mode ? ' cal-' + mode : '') + (ds === selected ? ' cal-selected-day' : '') + (ds === today ? ' cal-today-mark' : '');
      html += '<div class="cal-cell' + cls + '" data-pickdate="' + ds + '">' + d + '</div>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.cal-cell:not(.cal-empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        dateInput.value = cell.dataset.pickdate;
        pickerOverlay.classList.remove('show');
        render();
      });
    });
  }

  // --- Render Schedule ---
  function renderSchedule() {
    const section = document.getElementById('scheduleSection');
    const schedule = loadSchedule();
    const monthPrefix = dateInput.value.substring(0, 7);
    const thisMonth = schedule.filter(s => s.date.startsWith(monthPrefix));

    const practiceItems = thisMonth.filter(s => s.mode === 'practice').sort((a,b) => a.date.localeCompare(b.date));
    const matchItems = thisMonth.filter(s => s.mode === 'match').sort((a,b) => a.date.localeCompare(b.date));

    const today = todayStr();
    const selectedDate = dateInput.value;

    const now = new Date();
    const dlRules = getDeadlineRules();

    function chipHTML(item) {
      const d = new Date(item.date + 'T00:00:00');
      const day = d.getDate();
      const dow = DAYS[d.getDay()];
      const isToday = item.date === today;
      const isSelected = item.date === selectedDate && currentMode === item.mode;
      const rule = dlRules[item.mode];
      const dl = new Date(d);
      dl.setDate(dl.getDate() - rule.daysBefore);
      dl.setHours(rule.hour, 0, 0, 0);
      const isPast = now > dl;
      return `<button class="schedule-chip chip-${item.mode}${isToday ? ' chip-today' : ''}${isSelected ? ' chip-selected' : ''}${isPast ? ' chip-past-deadline' : ''}"
                      data-sdate="${item.date}" data-smode="${item.mode}">
                ${day}<span class="chip-dow">${dow}</span>
              </button>`;
    }

    const monthNum = parseInt(monthPrefix.split('-')[1]);
    let html = `<div class="schedule-title">${monthNum}月の予定<button class="schedule-edit-btn" id="scheduleEditBtn">📅 編集</button></div>`;

    if (practiceItems.length > 0) {
      html += `<div class="schedule-row"><span class="schedule-label schedule-label-practice">練習</span>${practiceItems.map(chipHTML).join('')}</div>`;
    }
    if (matchItems.length > 0) {
      html += `<div class="schedule-row"><span class="schedule-label schedule-label-match">試合</span>${matchItems.map(chipHTML).join('')}</div>`;
    }
    if (practiceItems.length === 0 && matchItems.length === 0) {
      html += '<div class="schedule-empty">今月の予定はありません</div>';
    }

    section.innerHTML = html;

    section.querySelectorAll('.schedule-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        dateInput.value = chip.dataset.sdate;
        const newMode = chip.dataset.smode;
        if (newMode !== currentMode) {
          currentMode = newMode;
          localStorage.setItem(STORAGE_MODE, currentMode);
        }
        render._prevCounts = undefined;
        render();
      });
    });

    document.getElementById('scheduleEditBtn').addEventListener('click', () => openCalendarEdit());
  }

  // --- Render ---
  function render() {
    document.getElementById('todayBadge').style.display =
      dateInput.value === todayStr() ? '' : 'none';

    renderSchedule();

    // --- Check if selected date has a schedule entry ---
    const scheduleEntry = loadSchedule().find(s => s.date === dateInput.value);
    const hasSchedule = !!scheduleEntry;
    const contextBar = document.getElementById('contextBar');
    const summary = document.getElementById('summary');
    const list = document.getElementById('memberList');
    if (!hasSchedule) {
      const selDate = new Date(dateInput.value + 'T00:00:00');
      contextBar.innerHTML = `<span class="context-date">${selDate.getMonth()+1}/${selDate.getDate()}(${DAYS[selDate.getDay()]})</span>`;
      summary.innerHTML = '';
      document.getElementById('noneList').style.display = 'none';
      document.getElementById('presentList').style.display = 'none';
      document.getElementById('headerNoneCount').style.display = 'none';
      list.innerHTML = '<div class="empty-state"><p>予定がありません</p></div>';
      return;
    }

    // --- Context Bar ---
    const dlRulesAll = getDeadlineRules();
    const rule = dlRulesAll[currentMode];
    const dlEnabled = rule.enabled;
    const selected = new Date(dateInput.value + 'T00:00:00');
    const now = new Date();
    let dlUrgent = false;
    if (dlEnabled) {
      const deadlineDate = new Date(selected);
      deadlineDate.setDate(deadlineDate.getDate() - rule.daysBefore);
      var dlMonth = deadlineDate.getMonth() + 1;
      var dlDay = deadlineDate.getDate();
      const deadlineTime = new Date(deadlineDate);
      deadlineTime.setHours(rule.hour, 0, 0, 0);
      render._isPastDeadline = now > deadlineTime;
      const isDeadlineToday = deadlineDate.toDateString() === now.toDateString();
      dlUrgent = isDeadlineToday || render._isPastDeadline;
    } else {
      render._isPastDeadline = false;
    }

    {
      const selDate = new Date(dateInput.value + 'T00:00:00');
      const dlText = dlEnabled
        ? `<span class="context-deadline${dlUrgent ? ' urgent' : ''}">締切 ${dlMonth}/${dlDay} ${rule.hour}:00</span>`
        : '<span class="context-deadline" style="opacity:0.4">締切 OFF</span>';
      contextBar.innerHTML =
        `<span class="context-date">${selDate.getMonth()+1}/${selDate.getDate()}(${DAYS[selDate.getDay()]})</span>` +
        `<span class="context-mode context-mode-${currentMode}">${MODE_NAMES[currentMode]}</span>` +
        (scheduleEntry && scheduleEntry.startTime ? `<span style="font-size:13px;font-weight:600">${scheduleEntry.startTime}〜</span>` : '') +
        dlText;
    }

    const isPastEvent = dateInput.value < todayStr();
    render._isPastEvent = isPastEvent;
    const readOnly = isPastEvent || (render._isPastDeadline && !isAdmin());

    // --- Members ---
    const members = loadMembers();
    const dayData = getDayAttendance();

    if (members.length === 0) {
      list.innerHTML = '<div class="empty-state"><p>メンバーがいません<br>＋ボタンから追加してください</p></div>';
      summary.innerHTML = '';
      document.getElementById('headerNoneCount').style.display = 'none';
      return;
    }

    let counts = { present: 0, absent: 0, late: 0, early: 0, none: 0 };
    members.forEach(m => { const s = dayData[m.name] || 'none'; if (s === 'late_early') { counts.late++; counts.early++; } else { counts[s]++; } });

    const headerNone = document.getElementById('headerNoneCount');
    if (counts.none > 0) {
      headerNone.style.display = '';
      headerNone.innerHTML = `<span class="count">未入力: ${counts.none}人</span>`;
    } else {
      headerNone.style.display = 'none';
    }

    summary.innerHTML =
      `<span><span class="dot dot-total"></span>合計 ${members.length}</span>` +
      `<span><span class="dot dot-present"></span>出席 ${counts.present}</span>` +
      `<span><span class="dot dot-absent"></span>欠席 ${counts.absent}</span>` +
      `<span><span class="dot dot-late"></span>遅刻 ${counts.late}</span>` +
      `<span><span class="dot dot-early"></span>早退 ${counts.early}</span>` +
      `<span><span class="dot dot-none"></span>未入力 ${counts.none}</span>`;

    const countKey = `${counts.present},${counts.absent},${counts.late},${counts.early}`;
    if (render._prevCounts !== undefined && render._prevCounts !== countKey) {
      summary.classList.add('flash');
      setTimeout(() => summary.classList.remove('flash'), 500);
    }
    render._prevCounts = countKey;

    // --- None list ---
    const noneList = document.getElementById('noneList');
    const noneNames = members.map(m => m.name).filter(name => { const s = dayData[name]; return !s || s === 'none'; });
    if (noneNames.length > 0) {
      noneList.style.display = '';
      noneList.innerHTML = `<strong>未入力:</strong><span>${noneNames.map(escapeHTML).join(', ')}</span><button class="copy-btn" id="copyNoneBtn">コピー</button>`;
      document.getElementById('copyNoneBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(noneNames.join('\n')).then(() => {
          const btn = document.getElementById('copyNoneBtn');
          btn.textContent = 'コピーしました';
          setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
        });
      });
    } else { noneList.style.display = 'none'; }

    // --- Present list ---
    const presentList = document.getElementById('presentList');
    const presentNames = members.map(m => m.name).filter(name => dayData[name] === 'present');
    if (presentNames.length > 0) {
      presentList.style.display = '';
      presentList.innerHTML = `<strong>出席:</strong><span>${presentNames.map(escapeHTML).join(', ')}</span><button class="copy-btn" id="copyPresentBtn">コピー</button>`;
      document.getElementById('copyPresentBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(presentNames.join('\n')).then(() => {
          const btn = document.getElementById('copyPresentBtn');
          btn.textContent = 'コピーしました';
          setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
        });
      });
    } else { presentList.style.display = 'none'; }

    // --- Monthly count ---
    const monthPrefix = dateInput.value.substring(0, 7);
    const allData = loadAttendance();
    const monthlyPresent = {};
    members.forEach(m => { monthlyPresent[m.name] = 0; });
    Object.keys(allData).forEach(dateKey => {
      if (dateKey.startsWith(monthPrefix)) {
        const day = allData[dateKey];
        members.forEach(m => { if (day[m.name] === 'present') monthlyPresent[m.name]++; });
      }
    });

    // --- Cards ---
    const editorName = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
    const readOnlyMsg = isPastEvent ? 'このイベントは終了しています' : 'このイベントの締切は過ぎています';
    let cardsHTML = readOnly ? `<div style="padding:10px 20px"><div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 16px;font-size:13px;color:#991b1b;text-align:center;font-weight:600">${readOnlyMsg}</div></div>` : '';
    cardsHTML += members.map((m, idx) => {
      const name = m.name;
      const isLocked = readOnly || (editorName && !isAdmin() && name !== editorName);
      const current = dayData[name] || 'none';
      const hasTime = TIME_STATUSES.includes(current);
      let nameBadge = '';
      if (current === 'none') {
        nameBadge = '<span class="badge-none">未入力</span>';
      } else if (current === 'late_early') {
        const lt = dayData[name + '_lateTime'] || '';
        const et = dayData[name + '_earlyTime'] || '';
        if (lt) nameBadge += `<span class="badge-time badge-time-late">遅刻 ${escapeHTML(lt)}</span>`;
        if (et) nameBadge += `<span class="badge-time badge-time-early">早退 ${escapeHTML(et)}</span>`;
      } else if (hasTime) {
        const savedTime = dayData[name + '_time'] || '';
        if (savedTime) nameBadge = `<span class="badge-time badge-time-${current}">${STATUS_NAMES[current]} ${escapeHTML(savedTime)}</span>`;
      }
      return `
        <div class="member-card${isLocked ? ' locked' : ''}" data-locked="${isLocked ? '1' : ''}">
          <div class="reorder-btns">
            <button class="reorder-btn" data-move="${idx}" data-dir="-1" ${idx === 0 ? 'disabled' : ''}>&#9650;</button>
            <button class="reorder-btn" data-move="${idx}" data-dir="1" ${idx === members.length - 1 ? 'disabled' : ''}>&#9660;</button>
          </div>
          <span class="member-name">${escapeHTML(name)}${nameBadge}</span>
          <div class="status-buttons">
            ${['present', 'absent', 'late', 'early'].map(s =>
              `<button class="status-btn ${(current === s || (current === 'late_early' && (s === 'late' || s === 'early')) || (['late','early','late_early'].includes(current) && s === 'present')) ? 'active-' + s : ''}"
                       data-name="${escapeHTML(name)}" data-status="${s}">
                ${['遅','早'].includes(STATUS_LABELS[s]) ? `<span class="btn-label">${STATUS_LABELS[s]}</span>` : STATUS_LABELS[s]}
              </button>`
            ).join('')}
          </div>

          ${current === 'late_early' ? `
          <div class="time-row">
            <label>遅刻時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="late" value="${escapeHTML(dayData[name + '_lateTime'] || '')}">
          </div>
          <div class="time-row">
            <label>早退時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="early" value="${escapeHTML(dayData[name + '_earlyTime'] || '')}">
          </div>` : hasTime ? `
          <div class="time-row">
            <label>${STATUS_NAMES[current]}時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="${current}" value="${escapeHTML(dayData[name + '_time'] || '')}">
          </div>` : ''}
          ${dayData[name + '_editedBy'] ? `<div class="member-meta">
            <span>更新: ${escapeHTML(dayData[name + '_editedBy'])} ${formatEditTime(dayData[name + '_editedAt'])}</span>
          </div>` : ''}
        </div>`;
    }).join('');
    list.innerHTML = cardsHTML;

    // --- Event handlers ---
    list.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (render._isPastEvent) { return; }
        if (!requireEditor()) { alert('ログインしてください'); return; }
        const name = btn.dataset.name;
        const loggedIn = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        if (!isAdmin() && name !== loggedIn) { return; }
        if (btn.closest('.member-card').dataset.locked === '1') { return; }
        if (render._isPastDeadline) {
          if (!isAdmin()) { alert('締切を過ぎています'); return; }
          if (!(await customConfirm('締切を過ぎていますが更新しますか？'))) return;
        }
        const status = btn.dataset.status;
        const dayData = getDayAttendance();
        const current = dayData[name] || 'none';
        let next;
        if (status === 'late' || status === 'early') {
          const other = status === 'late' ? 'early' : 'late';
          if (current === status) next = 'present';
          else if (current === other) next = 'late_early';
          else if (current === 'late_early') next = other;
          else next = status;
        } else if (status === 'present') {
          next = ['present','late','early','late_early'].includes(current) ? 'none' : 'present';
        } else {
          next = current === status ? 'none' : status;
        }
        const CONFIRM_LABELS = { present: '出席しますか？', absent: '欠席しますか？', late: '遅刻しますか？', early: '早退しますか？', late_early: '遅刻・早退しますか？' };
        if (next !== 'none' && CONFIRM_LABELS[next]) {
          if (!(await customConfirm(CONFIRM_LABELS[next]))) return;
        }
        setMemberStatus(name, next);
        render._highlightName = name;
        render();
      });
    });

    list.querySelectorAll('.time-row input[type="time"]').forEach(input => {
      input.addEventListener('change', () => {
        if (render._isPastEvent) { return; }
        if (!requireEditor()) { alert('ログインしてください'); return; }
        const timeName = input.dataset.timeFor;
        const loggedIn = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        if (!isAdmin() && timeName !== loggedIn) { return; }
        if (input.closest('.member-card').dataset.locked === '1') return;
        if (render._isPastDeadline) {
          if (!isAdmin()) { alert('締切を過ぎています'); return; }
        }
        setMemberTime(timeName, input.value, input.dataset.timeType);
      });
    });

    list.querySelectorAll('.reorder-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.move);
        const dir = parseInt(btn.dataset.dir);
        const m = loadMembers();
        [m[i], m[i+dir]] = [m[i+dir], m[i]];
        saveMembers(m);
        render();
      });
    });


    if (render._highlightName) {
      const target = list.querySelector(`[data-name="${CSS.escape(render._highlightName)}"]`);
      if (target) {
        const card = target.closest('.member-card');
        card.classList.add('highlight');
        setTimeout(() => card.classList.remove('highlight'), 800);
      }
      render._highlightName = null;
    }
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatEditTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // --- Login & Admin ---
  const STORAGE_ADMIN_PW = _T + 'volley-admin-pw';

  const loginModal = document.getElementById('loginModal');
  const adminModal = document.getElementById('adminModal');

  function updateLoginStatus() {
    const type = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
    const el = document.getElementById('loginStatus');
    if (type === 'admin') {
      const name = localStorage.getItem(STORAGE_EDITOR) || '';
      el.textContent = (name || '管理者') + '(管理者)';
      el.style.opacity = '1';
    } else if (type === 'member') {
      const name = localStorage.getItem(STORAGE_EDITOR) || '';
      el.textContent = name ? name + 'でログイン中' : '未ログイン';
      el.style.opacity = name ? '1' : '0.5';
    } else {
      el.textContent = '未ログイン';
      el.style.opacity = '0.5';
    }
    const titleEl = document.getElementById('appTitle');
    if (titleEl) titleEl.style.cursor = isAdmin() ? 'pointer' : 'default';
  }
  updateLoginStatus();

  document.getElementById('loginStatus').addEventListener('click', () => {
    const type = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
    if (!type) {
      // Not logged in → open login modal
      document.getElementById('adminPwInput').value = '';
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('loginStep1').style.display = '';
      document.getElementById('loginStep2').style.display = 'none';
      const members = loadMembers();
      const adminN = getAdminName();
      const hasMembers = members.filter(m => m.name !== adminN).length > 0;
      const sel = document.getElementById('memberNameSelect');
      sel.innerHTML = '<option value="" disabled selected>選択してください</option>' + members.filter(m => m.name !== adminN).map(m => '<option value="' + escapeHTML(m.name) + '">' + escapeHTML(m.name) + '</option>').join('');
 const isInviteFlow = new URL(location.href).searchParams.get('invite') === '1';
const hasTeamParam = !!new URL(location.href).searchParams.get('team');

document.getElementById('newMemberSection').style.display =
  hasTeamParam ? '' : (hasMembers ? 'none' : '');

document.getElementById('newMemberSeparator').style.display =
  hasTeamParam ? '' : (hasMembers ? 'none' : '');

const det = document.getElementById('loginExistingDetails');

// ?team= で入った(=招待/ID入力/URL直)なら「既存ログイン」を見せない
det.style.display = hasTeamParam ? 'none' : '';
if (!hasTeamParam) det.style.display = ''; // ロビー起点は通常表示


if (fromInviteCard) {
  det.style.display = 'none';
  document.getElementById('newMemberSection').style.display = '';
  document.getElementById('newMemberSeparator').style.display = '';
} else {
  det.style.display = '';
  if (hasMembers) det.setAttribute('open', '');
  else det.removeAttribute('open');
}

loginModal.classList.add('show');

    } else if (type === 'member') {
      if (!confirm('ログアウトしますか？')) return;
      localStorage.removeItem(STORAGE_LOGIN_TYPE);
      localStorage.removeItem(STORAGE_EDITOR);
      updateLoginStatus();
      render();
    } else if (type === 'admin') {
      showUserMenu();
    }
  });

  function showUserMenu() {
    const menu = document.getElementById('userMenu');
    document.getElementById('userMenuItems').innerHTML =
      '<button class="btn-confirm" id="umLogout" style="width:100%;padding:12px">ログアウト</button>' +
      '<button class="btn-confirm" id="umChangePw" style="width:100%;padding:12px;background:var(--primary-light)">パスワード変更</button>' +
      '<button class="btn-cancel" id="umClose" style="width:100%;padding:10px">閉じる</button>';
    menu.classList.add('show');
    document.getElementById('umLogout').addEventListener('click', () => {
      menu.classList.remove('show');
      localStorage.removeItem(STORAGE_LOGIN_TYPE);
      localStorage.removeItem(STORAGE_EDITOR);
      updateLoginStatus();
      render();
    });
    document.getElementById('umChangePw').addEventListener('click', () => {
      menu.classList.remove('show');
      openAdminModal();
    });
    document.getElementById('umClose').addEventListener('click', () => menu.classList.remove('show'));
  }

  const userMenu = document.getElementById('userMenu');
  userMenu.addEventListener('click', e => { if (e.target === userMenu) userMenu.classList.remove('show'); });

  function showLoginError(msg) {
    const err = document.getElementById('loginError');
    err.textContent = msg;
    err.style.display = '';
  }

  function closeLoginModal() {
    loginModal.classList.remove('show');
    document.getElementById('newMemberSection').style.display = '';
    document.getElementById('newMemberSeparator').style.display = '';
    document.getElementById('newMemberNameInput').value = '';
    document.getElementById('adminPwInput').value = '';
    document.getElementById('loginError').style.display = 'none';
    const details1 = document.getElementById('loginExistingDetails');
    const details2 = document.getElementById('loginAdminDetails');
    if (details1) details1.removeAttribute('open');

  function loadCalMonth() {

  function renderCalGrid(year, month) {
    const grid = document.getElementById('calGrid');
    const dows = ['日','月','火','水','木','金','土'];
    let html = dows.map(d => '<div class="cal-dow">' + d + '</div>').join('');
    const firstDay = new Date(year, month, 1).getDay();
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell cal-empty"></div>';
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const item = calEditData.find(s => s.date === dateStr);
      const cls = item ? 'cal-' + item.mode : '';
      const timeLabel = item && item.startTime ? '<span style="font-size:8px;line-height:1;opacity:0.8;display:block;text-align:center">' + item.startTime + '</span>' : '';
      html += '<div class="cal-cell ' + cls + '" data-caldate="' + dateStr + '">' + d + timeLabel + '</div>';
    }
    grid.innerHTML = html;
    const timeRow = document.getElementById('calTimeRow');
    timeRow.style.display = 'none';
    grid.querySelectorAll('.cal-cell:not(.cal-empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        if (!isAdmin()) return;
        const dateStr = cell.dataset.caldate;
        const idx = calEditData.findIndex(s => s.date === dateStr);
        if (idx === -1) {
          calEditData.push({date: dateStr, mode: 'practice'});
          renderCalGrid(year, month);
          showCalTime(dateStr);
        } else {
          showCalCellMenu(dateStr, cell);
        }
      });
    });
  }

  function showCalCellMenu(dateStr, cell) {
    const item = calEditData.find(s => s.date === dateStr);

    _calMenuDate = dateStr;
    const menu = document.getElementById('calCellMenu');
    const otherMode = item.mode === 'practice' ? 'match' : 'practice';
    document.getElementById('calMenuMode').textContent = '🔄 ' + MODE_NAMES[otherMode] + 'に変更';
    const modalRect = document.getElementById('calEditModal').getBoundingClientRect();
    const cellRect = cell.getBoundingClientRect();
    let top = cellRect.bottom - modalRect.top + 4;
    let left = cellRect.left - modalRect.left;
    menu.style.display = '';
    const menuW = menu.offsetWidth;
    if (left + menuW > modalRect.width - 8) left = modalRect.width - menuW - 8;
    if (left < 8) left = 8;
    menu.style.top = top + 'px';
    menu.style.left = left + 'px';
  }

    if (!selected) { alert('メンバーを選択してください'); return; }
    const newAdminName = selected.value;
    if (!confirm('「' + newAdminName + '」を新しい管理者にします。\n\n変更後はあなたの管理者権限は全て失われます。\n管理者パスワードは初期値(0000)にリセットされます。\n\nよろしいですか？')) return;
    // Reset admin password to 0000
    localStorage.removeItem(STORAGE_ADMIN_PW);
    // Update member roles
    const ms = loadMembers();
    const oldAdmin = getAdminName();
    ms.forEach(m => {
      if (m.name === oldAdmin) m.role = 'メンバー';
      if (m.name === newAdminName) m.role = '管理者';
    });
    saveMembers(ms);
    // Update persistent admin name
    localStorage.setItem(STORAGE_ADMIN_NAME, newAdminName);
    // Logout current admin → become member
    localStorage.setItem(STORAGE_LOGIN_TYPE, 'member');
    document.getElementById('changeAdminPanel').style.display = 'none';
    document.getElementById('memberSettingsModal').classList.remove('show');
    updateLoginStatus();
    render();
    syncToServer();
    alert('管理者権限を解除しました。\n「' + newAdminName + '」さんに管理者パスワード(0000)でログインするよう伝えてください。');
  });

  // --- Invite Code (popup) ---
  const invitePopup = document.getElementById('invitePopup');
  document.getElementById('showInviteBtn').addEventListener('click', () => {
    const teamId = _teamParam;
    const url = 'https://club-attendance.smoolinq.workers.dev/?team=' + encodeURIComponent(teamId);
    document.getElementById('inviteTeamId').textContent = teamId;
    document.getElementById('inviteUrl').textContent = url;
    invitePopup.classList.add('show');
  });
  document.getElementById('inviteIdCopyBtn').addEventListener('click', () => {
    const id = document.getElementById('inviteTeamId').textContent;
    navigator.clipboard.writeText(id).then(() => {
      const btn = document.getElementById('inviteIdCopyBtn');
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = 'IDをコピー'; }, 1500);
    });
  });
  document.getElementById('inviteCopyBtn').addEventListener('click', () => {
    const url = document.getElementById('inviteUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('inviteCopyBtn');
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = 'URLをコピー'; }, 1500);
    });
  });
  document.getElementById('inviteCloseBtn').addEventListener('click', () => invitePopup.classList.remove('show'));
  invitePopup.addEventListener('click', e => { if (e.target === invitePopup) invitePopup.classList.remove('show'); });

  document.getElementById('msAddBtn').addEventListener('click', async () => {
    const input = document.getElementById('msAddName');
    const name = input.value.trim();
    if (!name) return;
    const members = loadMembers();
    if (members.some(m => m.name === name)) { alert('既に追加済み'); return; }
    if (!(await customConfirm(name + 'さんを追加しますか？'))) return;
    members.push({name, role: '一般'});
    saveMembers(members);
    input.value = '';
    renderMemberSettings();
    syncToServer();
  });

  document.getElementById('msAddName').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('msAddBtn').click();
  });

  // --- Editable Title ---
  const STORAGE_TITLE = _T + 'volley-app-title';
  const DEFAULT_TITLE = 'ママさんバレー 出席管理';
  const appTitleEl = document.getElementById('appTitle');
  appTitleEl.textContent = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
  appTitleEl.style.cursor = isAdmin() ? 'pointer' : 'default';

  appTitleEl.addEventListener('click', () => {
    if (!isAdmin()) { alert('管理者のみ編集できます'); return; }
    if (document.querySelector('.title-edit-row')) return;
    const current = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
    const row = document.createElement('div');
    row.className = 'title-edit-row';
    row.innerHTML = '<input type="text" maxlength="30"><button title="保存">✓</button><button title="キャンセル">✕</button>';
    const input = row.querySelector('input');
    const [saveBtn, cancelBtn] = row.querySelectorAll('button');
    input.value = current;
    appTitleEl.style.display = 'none';
    appTitleEl.parentNode.insertBefore(row, appTitleEl);
    input.focus();
    input.select();
    function save() {
      const v = input.value.trim() || DEFAULT_TITLE;
      localStorage.setItem(STORAGE_TITLE, v);
      appTitleEl.textContent = v;
      // Update recent teams with this name
      try {
        const rt = JSON.parse(localStorage.getItem('volley-recent-teams')) || [];
        const entry = rt.find(t => t.id === _teamParam);
        if (entry) { entry.name = v; localStorage.setItem('volley-recent-teams', JSON.stringify(rt)); }
      } catch {}
      syncToServer();
      close();
    }
    function close() { row.remove(); appTitleEl.style.display = ''; }
    saveBtn.addEventListener('click', save);
    cancelBtn.addEventListener('click', close);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') close(); });
  });

  // --- Server Sync ---
  const SYNC_API = 'https://club-attendance-api.smoolinq.workers.dev/';

  function buildSyncData() {
    return {
      title: localStorage.getItem(STORAGE_TITLE) || '',
      members: loadMembers(),
      schedule: loadSchedule(),
      deadline: getDeadlineRules(),
      adminName: getAdminName(),
      adminPw: localStorage.getItem(STORAGE_ADMIN_PW) || '0000',
      attendancePractice: JSON.parse(localStorage.getItem(ATTENDANCE_KEYS.practice) || '{}'),
      attendanceMatch: JSON.parse(localStorage.getItem(ATTENDANCE_KEYS.match) || '{}')
    };
  }

  async function syncToServer() {
    try {
      const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(_teamParam), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(buildSyncData())
      });
      return res.ok;
    } catch(e) { return false; }
  }

  async function syncFromServer() {
    try {
      const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(_teamParam));
      if (!res.ok) return null;
      return await res.json();
    } catch(e) { return null; }
  }

  function applyServerData(data) {
    console.log('[applyServerData] members=', Array.isArray(data?.members) ? data.members.length : 'no-members', 'loginType=', localStorage.getItem(STORAGE_LOGIN_TYPE), 'editor=', localStorage.getItem(STORAGE_EDITOR));
    if (!data) return false;
    let changed = false;
    // Title: always sync from server
    if (data.title) {
      const local = localStorage.getItem(STORAGE_TITLE) || '';
      if (data.title !== local) { localStorage.setItem(STORAGE_TITLE, data.title); changed = true; }
    }
        // Members: server is source of truth (reflect deletions too)
    if (Array.isArray(data.members)) {
      const local = loadMembers();
      const localMap = new Map(local.map(m => [m.name, m]));

      // Build next members list in server order
      const next = data.members.map(sm => {
        const lm = localMap.get(sm.name) || {};
        const out = { ...lm, ...sm };
        if (sm.role) out.role = sm.role; // server role wins
        // Keep local pin if server omitted
        if (sm.pin == null && lm.pin != null) out.pin = lm.pin;
        return out;
      });

      // Save only if changed
      if (JSON.stringify(next) !== JSON.stringify(local)) {
        saveMembers(next);
        changed = true;
      }

      // If this device was logged in as a member and got deleted -> lobby
      const loginType = localStorage.getItem(STORAGE_LOGIN_TYPE);
      const editorName = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
      if (loginType === 'member' && editorName) {
        const stillExists = next.some(m => m && m.name === editorName);
        if (!stillExists) {
          localStorage.removeItem(STORAGE_LOGIN_TYPE);
          localStorage.removeItem(STORAGE_EDITOR);
          alert('削除されました');
          location.href = location.pathname; // lobby (no ?team=)
          return true;
        }
      }
    }
    // Schedule: merge, server wins for same date
    if (Array.isArray(data.schedule) && data.schedule.length > 0) {
      const local = JSON.parse(localStorage.getItem(STORAGE_SCHEDULE) || '[]');
      const localMap = new Map(local.map(s => [s.date, s]));
      let updated = false;
      for (const ss of data.schedule) {
        const ls = localMap.get(ss.date);
        if (!ls) { local.push(ss); updated = true; }
        else if (JSON.stringify(ss) !== JSON.stringify(ls)) {
          Object.assign(ls, ss); updated = true;
        }
      }
      if (updated) {
        local.sort((a, b) => a.date.localeCompare(b.date));
        localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(local));
        changed = true;
      }
    }
    // Deadline: always sync from server
    if (data.deadline) {
      const local = localStorage.getItem(STORAGE_DEADLINE);
      const sv = JSON.stringify(data.deadline);
      if (sv !== local) { localStorage.setItem(STORAGE_DEADLINE, sv); changed = true; }
    }
    // Admin name: always sync from server
    if (data.adminName) {
      const local = localStorage.getItem(STORAGE_ADMIN_NAME) || '';
      if (data.adminName !== local) { localStorage.setItem(STORAGE_ADMIN_NAME, data.adminName); changed = true; }
    }
    // Admin password: always sync from server
    if (data.adminPw) {
      const local = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
      if (data.adminPw !== local) { localStorage.setItem(STORAGE_ADMIN_PW, data.adminPw); changed = true; }
    }
    // Attendance: per-member, newer _editedAt wins
    function mergeAttendance(serverAtt, key) {
      if (!serverAtt || Object.keys(serverAtt).length === 0) return;
      const localAtt = JSON.parse(localStorage.getItem(key) || '{}');
      let merged = false;
      for (const date in serverAtt) {
        if (!localAtt[date]) { localAtt[date] = serverAtt[date]; merged = true; continue; }
        const memberNames = new Set();
        for (const f in serverAtt[date]) {
          memberNames.add(f.replace(/_(time|lateTime|earlyTime|editedBy|editedAt)$/, ''));
        }
        for (const name of memberNames) {
          const serverTime = serverAtt[date][name + '_editedAt'] || '';
          const localTime = localAtt[date][name + '_editedAt'] || '';
          if (serverTime > localTime || (!localTime && !(name in localAtt[date]))) {
            for (const f in serverAtt[date]) {
              if (f === name || f.startsWith(name + '_')) {
                localAtt[date][f] = serverAtt[date][f]; merged = true;
              }
            }
          }
        }
      }
      if (merged) { localStorage.setItem(key, JSON.stringify(localAtt)); changed = true; }
    }
    mergeAttendance(data.attendancePractice, ATTENDANCE_KEYS.practice);
    mergeAttendance(data.attendanceMatch, ATTENDANCE_KEYS.match);
    return changed;
  }

  // --- Init ---
  applyMode();

  (async () => {
    const data = await syncFromServer();
    if (applyServerData(data)) {
      // Reload UI with server data
      const titleEl = document.getElementById('appTitle');
      if (titleEl) titleEl.textContent = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
      render();
    }
    // Always push local state to server
    syncToServer();
    // Force login if not logged in
    if (!localStorage.getItem(STORAGE_LOGIN_TYPE)) {
      document.getElementById('adminPwInput').value = '';
      document.getElementById('newMemberNameInput').value = '';
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('loginStep1').style.display = '';
      document.getElementById('loginStep2').style.display = 'none';
      const members = loadMembers();
      const adminN = getAdminName();
      const hasMembers = members.filter(m => m.name !== adminN).length > 0;
      const sel = document.getElementById('memberNameSelect');
      sel.innerHTML = '<option value="" disabled selected>選択してください</option>' + members.filter(m => m.name !== adminN).map(m => '<option value="' + escapeHTML(m.name) + '">' + escapeHTML(m.name) + '</option>').join('');
      const isInviteFlow = new URL(location.href).searchParams.get('invite') === '1';
const det = document.getElementById('loginExistingDetails');

if (isInviteFlow) {
  det.style.display = 'none'; // 既存ログイン自体を出さない
  document.getElementById('newMemberSection').style.display = '';
  document.getElementById('newMemberSeparator').style.display = 'none'; // 区切り線も不要
} else {
  det.style.display = '';
  document.getElementById('newMemberSection').style.display = hasMembers ? 'none' : '';
  document.getElementById('newMemberSeparator').style.display = hasMembers ? 'none' : '';
  if (hasMembers) det.setAttribute('open', ''); else det.removeAttribute('open');
}
      loginModal.classList.add('show');
    }
  })();

  // Global Esc key handler for modals
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (loginModal.classList.contains('show')) { backToLobbyFromLogin(); return; }
    if (adminModal.classList.contains('show')) { closeAdminModal(); return; }
    if (document.getElementById('settingsModal').classList.contains('show')) { closeSettingsModal(); return; }
    if (document.getElementById('modal').classList.contains('show')) { closeModal(); return; }
    if (document.getElementById('userMenu').classList.contains('show')) { document.getElementById('userMenu').classList.remove('show'); return; }
  });
}
</script>
</body>
</html>
