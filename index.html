      document.getElementById('lobbyCreateBtn').addEventListener('click', async () => {
        const errEl = document.getElementById('lobbyCreateError');
        const groupName = document.getElementById('lobbyGroupName').value.trim();
        const adminName = document.getElementById('lobbyAdminName').value.trim();
        const adminPw = document.getElementById('lobbyAdminPw').value;
        if (!groupName) { errEl.textContent = 'グループ名を入力してください'; errEl.style.display = ''; document.getElementById('lobbyGroupName').focus(); return; }
        if (!adminName) { errEl.textContent = '管理者名を入力してください'; errEl.style.display = ''; document.getElementById('lobbyAdminName').focus(); return; }
        if (!/^\d{4}$/.test(adminPw)) { errEl.textContent = '4桁の数字を入力してください'; errEl.style.display = ''; document.getElementById('lobbyAdminPw').focus(); return; }
        const createdTeams = pruneCreatedTeams();
        if (createdTeams.length >= MAX_CREATED_TEAMS_PER_DEVICE) {
          errEl.textContent = 'この端末で作成できるグループは' + MAX_CREATED_TEAMS_PER_DEVICE + '件までです';
          errEl.style.display = '';
          return;
        }
        if (!(await lobbyConfirm('以下の内容で作成します。\n\nグループ名: ' + groupName + '\n管理者名: ' + adminName + '\nパスワード: ' + adminPw + '\n\nよろしいですか？'))) return;
        errEl.style.display = 'none';
        const teamId = generateTeamId();
        const t = teamId + ':';
        const recoveryCode = generateRecoveryCode();
        const team_data = {
          teamId,
          title: groupName,
          adminName,
          adminPw,
          recoveryCode,
          members: [{ name: adminName, pin: adminPw, state: 'active' }],
          schedule: []
        };
        try {
          const createRes = await fetch(`${API_BASE}/api/team/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              team_id: teamId,
              team_data: JSON.stringify(team_data)
            })
          });
          if (createRes.status === 409) {
            errEl.textContent = 'この端末で作成できるグループは' + MAX_CREATED_TEAMS_PER_DEVICE + '件までです';
            errEl.style.display = '';
            return;
          }
          if (!createRes.ok) {
            console.warn('[createTeam] worker API returned non-OK:', createRes.status);
          }
        } catch (e) {
          console.warn('[createTeam] worker API unavailable, fallback to local create', e);
        }
        // Set up localStorage for the new team
        localStorage.setItem(t + 'volley-app-title', groupName);
        localStorage.setItem(t + 'volley-admin-pw', adminPw);
        localStorage.setItem(t + 'volley-admin-name', adminName);
        localStorage.setItem(t + ADMIN_RECOVERY_SUFFIX, recoveryCode);
        localStorage.setItem(t + 'volley-login-type', 'admin');
        localStorage.setItem(t + 'volley-editor', adminName);
        localStorage.setItem(t + 'volley-login-session', JSON.stringify({
          id: createSessionId(),
          type: 'admin',
          editor: adminName,
          updatedAt: new Date().toISOString()
        }));
        localStorage.setItem(t + 'volley-members', JSON.stringify([{ name: adminName, pin: adminPw, state: 'active' }]));
        localStorage.setItem(t + 'volley-schedule', '[]');
        // Record to recent teams with group name
        const RECENT_KEY = 'volley-recent-teams';
        let recent = []; try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { }
        recent.unshift({ id: teamId, name: groupName, user: adminName, lastVisited: new Date().toISOString() });
        localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
        setCreatedTeams([teamId, ...createdTeams]);
        await showRecoveryCodeModal(recoveryCode);
        location.href = '?team=' + encodeURIComponent(teamId);
      });

      function setReloginMode(mode) {
        const panel = document.getElementById('reloginPanel');
        const reloginBtn = document.getElementById('modeReloginBtn');
        const joinBtn = document.getElementById('modeJoinBtn');
        const title = document.getElementById('reloginPanelTitle');
        const cancelSelectBtn = document.getElementById('cancelReloginSelectBtn');
        const form = document.getElementById('reloginFormArea');
        if (!panel || !reloginBtn || !joinBtn || !form) return;
        const current = mode === 'relogin' ? 'relogin' : 'join';
        panel.dataset.mode = current;
        const reloginActive = current === 'relogin';
        form.style.display = '';
        if (title) title.style.display = 'none';
        if (cancelSelectBtn) cancelSelectBtn.style.display = 'none';
        reloginBtn.style.display = reloginActive ? '' : 'none';

      const STORAGE_ADMINS = _T + 'volley-admins';

        try {

            by: (localStorage.getItem(STORAGE_EDITOR) || '').trim() || 'unknown',
            action: String(action || ''),
            target: String(target || ''),

      // Migration: if admin is logged in but STORAGE_ADMIN_NAME not set, populate it
      if (!localStorage.getItem(STORAGE_ADMIN_NAME) && localStorage.getItem(STORAGE_LOGIN_TYPE) === 'admin') {
        const ed = (localStorage.getItem(STORAGE_EDITOR) || '').trim();

      function reconcileLoginTypeWithAdminName() {
        const loginType = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        const editorName = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        const adminName = getAdminName();
        if (!loginType || !editorName || !adminName) return false;
        let nextType = loginType;
        if (editorName === adminName && loginType !== 'admin') nextType = 'admin';
        if (editorName !== adminName && loginType === 'admin') nextType = 'member';
        if (nextType === loginType) return false;
        localStorage.setItem(STORAGE_LOGIN_TYPE, nextType);
        const sess = getLoginSession();
        if (sess && sess.id) {
          sess.type = nextType;
          sess.updatedAt = new Date().toISOString();
          localStorage.setItem(STORAGE_LOGIN_SESSION, JSON.stringify(sess));
        }
        return true;
      }

      function ensureAdminMemberRecord() {
        const adminName = getAdminName();
        const adminPw = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
        if (!adminName) return false;
        const members = loadMembers();
        const idx = members.findIndex(m => m && m.name === adminName);
        if (idx === -1) {
          members.unshift({ name: adminName, pin: adminPw, state: 'active' });
          saveMembers(members);
          return true;
        }
        let changed = false;
        if (members[idx].state === 'inactive') {
          members[idx].state = 'active';
          members[idx].inactivatedAt = '';
          changed = true;
        }
        if (!/^\d{4}$/.test(String(members[idx].pin || ''))) {
          members[idx].pin = adminPw;
          changed = true;
        }
        if (members[idx] && members[idx].role != null) {
          delete members[idx].role;
          changed = true;
        }
        if (changed) {
          saveMembers(members);
          return true;
        }
        return false;
      }

      const ATTENDANCE_KEYS = { practice: _T + 'volley-attendance-practice', match: _T + 'volley-attendance-match' };
      let currentMode = localStorage.getItem(STORAGE_MODE) || 'practice';

      (function migrate() {
        const legacy = localStorage.getItem(_T + 'volley-attendance');
        if (legacy && !localStorage.getItem(ATTENDANCE_KEYS.practice)) {
          localStorage.setItem(ATTENDANCE_KEYS.practice, legacy);
        }
      })();

      function getAttendanceKey() { return ATTENDANCE_KEYS[currentMode]; }

      const STATUSES = ['none', 'present', 'absent', 'late', 'early'];
      const STATUS_LABELS = { none: '−', present: '◯', absent: '✕', late: '遅', early: '早' };
      const TIME_STATUSES = ['late', 'early', 'late_early'];
      const STATUS_NAMES = { late: '遅刻', early: '早退' };
      const MODE_NAMES = { practice: '練習', match: '試合' };

      const DEADLINE_DEFAULTS = { practice: { daysBefore: 1, hour: 21, enabled: false }, match: { daysBefore: 3, hour: 21, enabled: false } };
      const STORAGE_DEADLINE = _T + 'volley-deadline';

      function getDeadlineRules() {
        const saved = localStorage.getItem(STORAGE_DEADLINE);
        const rules = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEADLINE_DEFAULTS));
        // migrate from global enabled to per-mode enabled
        if (rules.enabled !== undefined) {
          if (rules.practice.enabled === undefined) rules.practice.enabled = rules.enabled;
          if (rules.match.enabled === undefined) rules.match.enabled = rules.enabled;
          delete rules.enabled;
        }
        if (rules.practice.enabled === undefined) rules.practice.enabled = true;
        if (rules.match.enabled === undefined) rules.match.enabled = true;
        return rules;
      }

      const DEFAULT_MEMBERS = [];
      const MEMBER_PENDING_HOURS = 24;
      const MEMBER_RESTORE_DAYS = 30;

      // --- Schedule ---
      const STORAGE_SCHEDULE = _T + 'volley-schedule';
      const DAYS = ['日', '月', '火', '水', '木', '金', '土'];

      function generateDefaultSchedule() {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth();
        const items = [];
        function fmt(d) {
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        for (let d = 1; d <= 31; d++) {
          const dt = new Date(y, m, d);
          if (dt.getMonth() !== m) break;
          const dow = dt.getDay();
          if (dow === 3 || dow === 6) items.push({ date: fmt(dt), mode: 'practice' });
        }
        let sunCount = 0;
        for (let d = 1; d <= 31; d++) {
          const dt = new Date(y, m, d);
          if (dt.getMonth() !== m) break;
          if (dt.getDay() === 0) {
            sunCount++;
            if (sunCount === 2 || sunCount === 4) items.push({ date: fmt(dt), mode: 'match' });
          }
        }
        return items;
      }

      function loadSchedule() {
        const raw = localStorage.getItem(STORAGE_SCHEDULE);
        if (raw) return JSON.parse(raw);
        return [];
      }

      // --- Data ---
      function normalizeMemberRecord(member) {
        if (!member) return null;
        if (typeof member === 'string') return { name: member, state: 'active' };
        const out = { ...member };
        if (out.role != null) delete out.role;
        out.name = String(out.name || '').trim();
        out.pin = String(out.pin || '').trim();
        if (out.state !== 'inactive') out.state = 'active';
        if (out.pendingRemovalAt && typeof out.pendingRemovalAt !== 'string') out.pendingRemovalAt = '';
        if (out.pendingRemovalReason && typeof out.pendingRemovalReason !== 'string') out.pendingRemovalReason = '';
        if (out.pendingRemovalBy && typeof out.pendingRemovalBy !== 'string') out.pendingRemovalBy = '';
        if (out.inactivatedAt && typeof out.inactivatedAt !== 'string') out.inactivatedAt = '';
        return out;
      }

      function loadMembers() {
        const raw = localStorage.getItem(STORAGE_MEMBERS);
        let arr = raw ? JSON.parse(raw) : DEFAULT_MEMBERS.slice();
        arr = (Array.isArray(arr) ? arr : []).map(normalizeMemberRecord).filter(Boolean);
        return arr;
      }
      function saveMembers(members) { localStorage.setItem(STORAGE_MEMBERS, JSON.stringify(members)); }
      function activeMembers(members) { return (members || []).filter(m => m && m.state !== 'inactive'); }
      function inactiveMembers(members) { return (members || []).filter(m => m && m.state === 'inactive'); }
      function findMemberByName(members, name) {
        const key = String(name || '').trim();
        return (members || []).find(m => m && String(m.name || '').trim() === key) || null;
      }

      function applyPendingRemovalRules() {
        const members = loadMembers();
        const now = Date.now();
        const currentEditor = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        const changed = members.some(m => {
          if (!m || !m.pendingRemovalAt || m.state === 'inactive') return false;
          const pendingAt = Date.parse(m.pendingRemovalAt);
          if (!Number.isFinite(pendingAt)) {
            m.pendingRemovalAt = '';
            m.pendingRemovalReason = '';
            m.pendingRemovalBy = '';
            return true;
          }
          if (currentEditor && m.name === currentEditor) {
            m.pendingRemovalAt = '';
            m.pendingRemovalReason = '';
            m.pendingRemovalBy = '';
            return true;
          }
          const dueAt = pendingAt + MEMBER_PENDING_HOURS * 60 * 60 * 1000;
          if (now >= dueAt) {
            m.state = 'inactive';
            m.inactivatedAt = new Date().toISOString();
            m.pendingRemovalAt = '';
            m.pendingRemovalReason = '';
            m.pendingRemovalBy = '';
            return true;
          }
          return false;
        });
        if (changed) {
          saveMembers(members);
          return true;
        }
        return false;
      }
      function loadAttendance() {
        const raw = localStorage.getItem(getAttendanceKey());
        return raw ? JSON.parse(raw) : {};
      }
      function saveAttendance(data) { localStorage.setItem(getAttendanceKey(), JSON.stringify(data)); }
      function getDateKey() { return dateInput.value; }
      function getDayAttendance() { return loadAttendance()[getDateKey()] || {}; }

      function requireEditor() { return !!localStorage.getItem(STORAGE_EDITOR) || localStorage.getItem(STORAGE_LOGIN_TYPE) === 'admin'; }

      function customConfirm(msg) {
        return new Promise(resolve => {
          const ov = document.getElementById('customConfirmOverlay');
          document.getElementById('customConfirmMsg').textContent = msg;
          ov.classList.add('show');
          const yes = document.getElementById('customConfirmYes');
          const no = document.getElementById('customConfirmNo');
          function cleanup() { ov.classList.remove('show'); yes.removeEventListener('click', onYes); no.removeEventListener('click', onNo); }
          function onYes() { cleanup(); resolve(true); }
          function onNo() { cleanup(); resolve(false); }
          yes.addEventListener('click', onYes);
          no.addEventListener('click', onNo);
        });
      }

      function stampEdit(dayObj, name) {
        const editor = localStorage.getItem(STORAGE_EDITOR);
        dayObj[name + '_editedBy'] = editor;
        dayObj[name + '_editedAt'] = new Date().toISOString();
      }

      function setMemberStatus(name, status) {
        const all = loadAttendance();
        const key = getDateKey();
        if (!all[key]) all[key] = {};
        const prev = all[key][name] || 'none';
        all[key][name] = status;
        if (prev === 'late' && status === 'late_early') {
          all[key][name + '_lateTime'] = all[key][name + '_time'] || '';
          delete all[key][name + '_time'];
        } else if (prev === 'early' && status === 'late_early') {
          all[key][name + '_earlyTime'] = all[key][name + '_time'] || '';
          delete all[key][name + '_time'];
        } else if (prev === 'late_early' && status === 'late') {
          all[key][name + '_time'] = all[key][name + '_lateTime'] || '';
          delete all[key][name + '_lateTime'];
          delete all[key][name + '_earlyTime'];
        } else if (prev === 'late_early' && status === 'early') {
          all[key][name + '_time'] = all[key][name + '_earlyTime'] || '';
          delete all[key][name + '_lateTime'];
          delete all[key][name + '_earlyTime'];
        } else if (!TIME_STATUSES.includes(status)) {
          delete all[key][name + '_time'];
          delete all[key][name + '_lateTime'];
          delete all[key][name + '_earlyTime'];
        }
        stampEdit(all[key], name);
        saveAttendance(all);
        syncToServer();
      }

      function setMemberTime(name, time, timeType) {
        const all = loadAttendance();
        const key = getDateKey();
        if (!all[key]) all[key] = {};
        const status = all[key][name];
        if (status === 'late_early') {
          const suffix = timeType === 'late' ? '_lateTime' : '_earlyTime';
          if (time) { all[key][name + suffix] = time; }
          else { delete all[key][name + suffix]; }
        } else {
          if (time) { all[key][name + '_time'] = time; }
          else { delete all[key][name + '_time']; }
        }
        stampEdit(all[key], name);
        saveAttendance(all);
        syncToServer();
      }

      // --- Date ---
      const dateInput = document.getElementById('dateInput');

      function todayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function shiftDate(days) {
        const d = new Date(dateInput.value);
        d.setDate(d.getDate() + days);
        dateInput.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        render();
      }

      dateInput.value = todayStr();
      dateInput.addEventListener('change', render);
      document.getElementById('prevDay').addEventListener('click', () => shiftDate(-1));
      document.getElementById('nextDay').addEventListener('click', () => shiftDate(1));

      // --- Custom Date Picker ---
      let pickerYear, pickerMonth;
      const pickerOverlay = document.getElementById('datePickerOverlay');

      dateInput.addEventListener('click', e => {
        e.preventDefault();
        const sel = new Date(dateInput.value + 'T00:00:00');
        pickerYear = sel.getFullYear();
        pickerMonth = sel.getMonth();
        renderPicker();
        pickerOverlay.classList.add('show');
      });
      // Prevent native picker on mobile
      dateInput.addEventListener('mousedown', e => e.preventDefault());
      dateInput.addEventListener('touchstart', e => { e.preventDefault(); dateInput.click(); }, { passive: false });

      pickerOverlay.addEventListener('click', e => { if (e.target === pickerOverlay) pickerOverlay.classList.remove('show'); });
      document.getElementById('pickerPrev').addEventListener('click', () => { pickerMonth--; if (pickerMonth < 0) { pickerMonth = 11; pickerYear--; } renderPicker(); });
      document.getElementById('pickerNext').addEventListener('click', () => { pickerMonth++; if (pickerMonth > 11) { pickerMonth = 0; pickerYear++; } renderPicker(); });

      function renderPicker() {
        document.getElementById('pickerTitle').textContent = pickerYear + '年' + (pickerMonth + 1) + '月';
        const grid = document.getElementById('pickerGrid');
        const schedule = loadSchedule();
        const prefix = pickerYear + '-' + String(pickerMonth + 1).padStart(2, '0');
        const monthSchedule = {};
        schedule.filter(s => s.date.startsWith(prefix)).forEach(s => { monthSchedule[s.date] = s.mode; });
        const today = todayStr();
        const selected = dateInput.value;
        const dows = ['日', '月', '火', '水', '木', '金', '土'];
        let html = dows.map(d => '<div class="cal-dow">' + d + '</div>').join('');
        const firstDay = new Date(pickerYear, pickerMonth, 1).getDay();
        for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell cal-empty"></div>';
        const daysInMonth = new Date(pickerYear, pickerMonth + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = prefix + '-' + String(d).padStart(2, '0');
          const mode = monthSchedule[ds];
          const cls = (mode ? ' cal-' + mode : '') + (ds === selected ? ' cal-selected-day' : '') + (ds === today ? ' cal-today-mark' : '');
          html += '<div class="cal-cell' + cls + '" data-pickdate="' + ds + '">' + d + '</div>';
        }
        grid.innerHTML = html;
        grid.querySelectorAll('.cal-cell:not(.cal-empty)').forEach(cell => {
          cell.addEventListener('click', () => {
            dateInput.value = cell.dataset.pickdate;
            pickerOverlay.classList.remove('show');
            render();
          });
        });
      }

      // --- Render Schedule ---
      function renderSchedule() {
        const section = document.getElementById('scheduleSection');
        const schedule = loadSchedule();
        const monthPrefix = dateInput.value.substring(0, 7);
        const thisMonth = schedule.filter(s => s.date.startsWith(monthPrefix));

        const practiceItems = thisMonth.filter(s => s.mode === 'practice').sort((a, b) => a.date.localeCompare(b.date));
        const matchItems = thisMonth.filter(s => s.mode === 'match').sort((a, b) => a.date.localeCompare(b.date));

        const today = todayStr();
        const selectedDate = dateInput.value;

        const now = new Date();
        const dlRules = getDeadlineRules();

        function chipHTML(item) {
          const d = new Date(item.date + 'T00:00:00');
          const day = d.getDate();
          const dow = DAYS[d.getDay()];
          const isToday = item.date === today;
          const isSelected = item.date === selectedDate && currentMode === item.mode;
          const isPast = item.date < today;
          return `<button class="schedule-chip chip-${item.mode}${isToday ? ' chip-today' : ''}${isSelected ? ' chip-selected' : ''}${isPast ? ' chip-past-deadline' : ''}"
                      data-sdate="${item.date}" data-smode="${item.mode}">
                ${day}<span class="chip-dow">${dow}</span>
              </button>`;
        }

        const monthNum = parseInt(monthPrefix.split('-')[1]);
        let html = `<div class="schedule-title">${monthNum}月の予定<button class="schedule-edit-btn" id="scheduleEditBtn"><span class="schedule-edit-icon">📅</span></button></div>`;

        if (practiceItems.length > 0) {
          html += `<div class="schedule-row"><span class="schedule-label schedule-label-practice">練習</span>${practiceItems.map(chipHTML).join('')}</div>`;
        }
        if (matchItems.length > 0) {
          html += `<div class="schedule-row"><span class="schedule-label schedule-label-match">試合</span>${matchItems.map(chipHTML).join('')}</div>`;
        }
        if (practiceItems.length === 0 && matchItems.length === 0) {
          html += '<div class="schedule-empty">今月の予定はありません</div>';
        }
        if (!isAdmin()) {
          html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text-light);text-align:center">※予定の変更は管理者のみできます</div>';
        }

        section.innerHTML = html;

        section.querySelectorAll('.schedule-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            dateInput.value = chip.dataset.sdate;
            const newMode = chip.dataset.smode;
            if (newMode !== currentMode) {
              currentMode = newMode;
              localStorage.setItem(STORAGE_MODE, currentMode);
            }
            render._prevCounts = undefined;
            render();
          });
        });

        document.getElementById('scheduleEditBtn').addEventListener('click', () => openCalendarEdit());
      }

      // --- Render ---
      function render() {
        applyPendingRemovalRules();
        document.getElementById('todayBadge').style.display =
          dateInput.value === todayStr() ? '' : 'none';

        renderSchedule();

        // --- Check if selected date has a schedule entry ---
        const scheduleEntry = loadSchedule().find(s => s.date === dateInput.value);
        const hasSchedule = !!scheduleEntry;
        const contextBar = document.getElementById('contextBar');
        const summary = document.getElementById('summary');
        const list = document.getElementById('memberList');
        if (!hasSchedule) {
          const selDate = new Date(dateInput.value + 'T00:00:00');
          const isPastSelectedDate = dateInput.value < todayStr();
          contextBar.innerHTML = `<span class="context-date">${selDate.getMonth() + 1}/${selDate.getDate()}(${DAYS[selDate.getDay()]})</span>`;
          summary.innerHTML = '';
          summary.style.display = 'none';
          document.getElementById('noneList').style.display = 'none';
          document.getElementById('presentList').style.display = 'none';
          document.getElementById('headerNoneCount').style.display = 'none';
          if (isPastSelectedDate) {
            list.innerHTML = '<div style="padding:10px 20px"><div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 16px;font-size:13px;color:#991b1b;text-align:center;font-weight:600">このイベントは終了しています</div></div>';
          } else {
            list.innerHTML = '<div class="empty-state">' +
              '<div class="empty-state-card">' +
              '<div class="empty-state-icon">📅</div>' +
              '<div class="empty-state-title">予定はまだありません</div>' +
              '<button type="button" id="emptyStateAddBtn" class="empty-state-hint">予定を確認する</button>' +
              '</div>' +
              '</div>';
            const emptyStateAddBtn = document.getElementById('emptyStateAddBtn');
            if (emptyStateAddBtn) {
              emptyStateAddBtn.addEventListener('click', () => openCalendarEdit());
            }
          }
          return;
        }

        // --- Context Bar ---
        summary.style.display = '';
        const dlRulesAll = getDeadlineRules();
        const rule = dlRulesAll[currentMode];
        const dlEnabled = rule.enabled;
        const selected = new Date(dateInput.value + 'T00:00:00');
        const now = new Date();
        let dlUrgent = false;
        let deadlineAt = null;
        if (dlEnabled) {
          deadlineAt = new Date(selected);
          deadlineAt.setDate(deadlineAt.getDate() - rule.daysBefore);
          deadlineAt.setHours(rule.hour, 0, 0, 0);
          var dlMonth = deadlineAt.getMonth() + 1;
          var dlDay = deadlineAt.getDate();
          render._isPastDeadline = now.getTime() > deadlineAt.getTime();
          const remainMs = deadlineAt.getTime() - now.getTime();
          dlUrgent = remainMs <= 24 * 60 * 60 * 1000 || render._isPastDeadline;
        } else {
          render._isPastDeadline = false;
        }

        {
          const selDate = new Date(dateInput.value + 'T00:00:00');
          let dlMeta = '';
          if (dlEnabled && deadlineAt) {
            const remainMs = deadlineAt.getTime() - now.getTime();
            if (remainMs > 0) {
              const remainHours = Math.floor(remainMs / (60 * 60 * 1000));
              const remainMinutes = Math.floor((remainMs % (60 * 60 * 1000)) / (60 * 1000));
              dlMeta = remainHours >= 24
                ? `<span class="context-deadline-meta${dlUrgent ? ' warn' : ''}">あと${Math.ceil(remainHours / 24)}日</span>`
                : `<span class="context-deadline-meta${dlUrgent ? ' warn' : ''}">あと${remainHours}時間${remainMinutes}分</span>`;
            } else {
              dlMeta = '<span class="context-deadline-meta warn">締切超過</span>';
            }
          }
          const dlText = dlEnabled
            ? `<span class="context-deadline${dlUrgent ? ' urgent' : ''}">締切 ${dlMonth}/${dlDay} ${rule.hour}:00</span>${dlMeta}`
            : '<span class="context-deadline" style="opacity:0.4">締切 OFF</span>';
          contextBar.innerHTML =
            `<span class="context-date">${selDate.getMonth() + 1}/${selDate.getDate()}(${DAYS[selDate.getDay()]})</span>` +
            `<span class="context-mode context-mode-${currentMode}">${MODE_NAMES[currentMode]}</span>` +
            (scheduleEntry && scheduleEntry.startTime ? `<span style="font-size:13px;font-weight:600">${scheduleEntry.startTime}〜</span>` : '') +
            dlText;
        }

        const isPastEvent = dateInput.value < todayStr();
        render._isPastEvent = isPastEvent;
        const readOnly = isPastEvent || (render._isPastDeadline && !isAdmin());

        // --- Members ---
        const members = activeMembers(loadMembers());
        const editorName = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        const viewMembers = (() => {
          const sorted = members.slice().sort((a, b) => String(a?.name || '').localeCompare(String(b?.name || ''), 'ja'));
          if (!editorName) return sorted;
          const selfIndex = sorted.findIndex(m => m && m.name === editorName);
          if (selfIndex < 0) return sorted;
          const self = sorted[selfIndex];
          return [self, ...sorted.slice(0, selfIndex), ...sorted.slice(selfIndex + 1)];
        })();
        const dayData = getDayAttendance();

        if (members.length === 0) {
          list.innerHTML = '<div class="empty-state"><p>メンバーがいません<br>招待リンクまたはグループIDで参加してください</p></div>';
          summary.innerHTML = '';
          document.getElementById('headerNoneCount').style.display = 'none';
          return;
        }

        let counts = { present: 0, absent: 0, late: 0, early: 0, none: 0 };
        viewMembers.forEach(m => { const s = dayData[m.name] || 'none'; if (s === 'late_early') { counts.late++; counts.early++; } else { counts[s]++; } });

        const headerNone = document.getElementById('headerNoneCount');
        if (counts.none > 0) {
          headerNone.style.display = '';
          headerNone.innerHTML = `<span class="count">未入力: ${counts.none}人</span>`;
        } else {
          headerNone.style.display = 'none';
        }

        summary.innerHTML =
          `<span><span class="dot dot-total"></span>合計 ${members.length}</span>` +
          `<span><span class="dot dot-present"></span>出席 ${counts.present}</span>` +
          `<span><span class="dot dot-absent"></span>欠席 ${counts.absent}</span>` +
          `<span><span class="dot dot-late"></span>遅刻 ${counts.late}</span>` +
          `<span><span class="dot dot-early"></span>早退 ${counts.early}</span>` +
          `<span><span class="dot dot-none"></span>未入力 ${counts.none}</span>` +
          `<button type="button" class="summary-filter-btn${localStorage.getItem(STORAGE_MEMBER_FILTER) === 'none-only' ? ' active' : ''}" id="toggleNoneOnlyBtn">${localStorage.getItem(STORAGE_MEMBER_FILTER) === 'none-only' ? '全員表示' : '未入力のみ'}</button>`;

        const toggleNoneOnlyBtn = document.getElementById('toggleNoneOnlyBtn');
        if (toggleNoneOnlyBtn) {
          toggleNoneOnlyBtn.addEventListener('click', () => {
            const current = localStorage.getItem(STORAGE_MEMBER_FILTER) || '';
            if (current === 'none-only') localStorage.removeItem(STORAGE_MEMBER_FILTER);
            else localStorage.setItem(STORAGE_MEMBER_FILTER, 'none-only');
            render();
          });
        }

        const countKey = `${counts.present},${counts.absent},${counts.late},${counts.early}`;
        if (render._prevCounts !== undefined && render._prevCounts !== countKey) {
          summary.classList.add('flash');
          setTimeout(() => summary.classList.remove('flash'), 500);
        }
        render._prevCounts = countKey;

        // --- None list ---
        const noneList = document.getElementById('noneList');
        const noneNames = viewMembers.map(m => m.name).filter(name => { const s = dayData[name]; return !s || s === 'none'; });
        if (noneNames.length > 0) {
          noneList.style.display = '';
          noneList.innerHTML = `<strong>未入力:</strong><span>${noneNames.map(escapeHTML).join(', ')}</span><button class="copy-btn" id="copyNoneBtn">コピー</button>`;
          document.getElementById('copyNoneBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(noneNames.join('\n')).then(() => {
              const btn = document.getElementById('copyNoneBtn');
              btn.textContent = 'コピーしました';
              setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
            });
          });
        } else { noneList.style.display = 'none'; }

        // --- Present list ---
        const presentList = document.getElementById('presentList');
        const presentNames = viewMembers.map(m => m.name).filter(name => dayData[name] === 'present');
        if (presentNames.length > 0) {
          presentList.style.display = '';
          presentList.innerHTML = `<strong>出席:</strong><span>${presentNames.map(escapeHTML).join(', ')}</span><button class="copy-btn" id="copyPresentBtn">コピー</button>`;
          document.getElementById('copyPresentBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(presentNames.join('\n')).then(() => {
              const btn = document.getElementById('copyPresentBtn');
              btn.textContent = 'コピーしました';
              setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
            });
          });
        } else { presentList.style.display = 'none'; }

        // --- Monthly count ---
        const monthPrefix = dateInput.value.substring(0, 7);
        const allData = loadAttendance();
        const monthlyPresent = {};
        viewMembers.forEach(m => { monthlyPresent[m.name] = 0; });
        Object.keys(allData).forEach(dateKey => {
          if (dateKey.startsWith(monthPrefix)) {
            const day = allData[dateKey];
            viewMembers.forEach(m => { if (day[m.name] === 'present') monthlyPresent[m.name]++; });
          }
        });

        // --- Cards ---
        const readOnlyMsg = isPastEvent ? 'このイベントは終了しています' : 'このイベントの締切は過ぎています';
        let cardsHTML = readOnly ? `<div style="padding:10px 20px"><div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 16px;font-size:13px;color:#991b1b;text-align:center;font-weight:600">${readOnlyMsg}</div></div>` : '';
        const noneOnly = localStorage.getItem(STORAGE_MEMBER_FILTER) === 'none-only';
        const displayMembers = noneOnly
          ? viewMembers.filter(m => {
            const s = dayData[m.name] || 'none';
            return !s || s === 'none';
          })
          : viewMembers;
        if (displayMembers.length === 0) {
          cardsHTML += '<div style="padding:12px 20px"><div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 16px;font-size:12px;color:#1e3a8a;text-align:center;font-weight:700">未入力メンバーはいません</div></div>';
        }
        cardsHTML += displayMembers.map((m) => {
          const name = m.name;
          const isSelf = !!editorName && name === editorName;
          const isLocked = readOnly || (editorName && !isAdmin() && name !== editorName);
          const current = dayData[name] || 'none';
          const hasTime = TIME_STATUSES.includes(current);
          let nameBadge = '';
          if (current === 'none') {
            nameBadge = '<span class="badge-none">未入力</span>';
          } else if (current === 'late_early') {
            const lt = dayData[name + '_lateTime'] || '';
            const et = dayData[name + '_earlyTime'] || '';
            if (lt) nameBadge += `<span class="badge-time badge-time-late">遅刻 ${escapeHTML(lt)}</span>`;
            if (et) nameBadge += `<span class="badge-time badge-time-early">早退 ${escapeHTML(et)}</span>`;
          } else if (hasTime) {
            const savedTime = dayData[name + '_time'] || '';
            if (savedTime) nameBadge = `<span class="badge-time badge-time-${current}">${STATUS_NAMES[current]} ${escapeHTML(savedTime)}</span>`;
          }
          return `
        <div class="member-card${isLocked ? ' locked' : ''}" data-locked="${isLocked ? '1' : ''}">
          <span class="member-name${isSelf ? ' self-highlight' : ''}">${escapeHTML(name)}${isSelf ? '<span class="self-pill">あなた</span>' : ''}${nameBadge}</span>
          <div class="status-buttons">
            ${['present', 'absent', 'late', 'early'].map(s =>
            `<button class="status-btn ${(current === s || (current === 'late_early' && (s === 'late' || s === 'early')) || (['late', 'early', 'late_early'].includes(current) && s === 'present')) ? 'active-' + s : ''}"
                       data-name="${escapeHTML(name)}" data-status="${s}">
                ${['遅', '早'].includes(STATUS_LABELS[s]) ? `<span class="btn-label">${STATUS_LABELS[s]}</span>` : STATUS_LABELS[s]}
              </button>`
          ).join('')}
          </div>

          ${current === 'late_early' ? `
          <div class="time-row">
            <label>遅刻時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="late" value="${escapeHTML(dayData[name + '_lateTime'] || '')}">
          </div>
          <div class="time-row">
            <label>早退時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="early" value="${escapeHTML(dayData[name + '_earlyTime'] || '')}">
          </div>` : hasTime ? `
          <div class="time-row">
            <label>${STATUS_NAMES[current]}時刻:</label>
            <input type="time" data-time-for="${escapeHTML(name)}" data-time-type="${current}" value="${escapeHTML(dayData[name + '_time'] || '')}">
          </div>` : ''}
          ${dayData[name + '_editedBy'] ? `<div class="member-meta">
            <span>更新: ${escapeHTML(dayData[name + '_editedBy'])} ${formatEditTime(dayData[name + '_editedAt'])}</span>
          </div>` : ''}
        </div>`;
        }).join('');
        list.innerHTML = cardsHTML;

        // --- Event handlers ---
        list.querySelectorAll('.status-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (render._isPastEvent) { return; }
            if (!requireEditor()) { alert('ログインしてください'); return; }
            const name = btn.dataset.name;
            const loggedIn = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
            if (!isAdmin() && name !== loggedIn) { return; }
            if (btn.closest('.member-card').dataset.locked === '1') { return; }
            if (render._isPastDeadline) {
              if (!isAdmin()) { alert('締切を過ぎています'); return; }
              if (!(await customConfirm('締切を過ぎていますが更新しますか？'))) return;
            }
            const status = btn.dataset.status;
            const dayData = getDayAttendance();
            const current = dayData[name] || 'none';
            let next;
            if (status === 'late' || status === 'early') {
              const other = status === 'late' ? 'early' : 'late';
              if (current === status) next = 'present';
              else if (current === other) next = 'late_early';
              else if (current === 'late_early') next = other;
              else next = status;
            } else if (status === 'present') {
              next = ['present', 'late', 'early', 'late_early'].includes(current) ? 'none' : 'present';
            } else {
              next = current === status ? 'none' : status;
            }
            const CONFIRM_LABELS = { present: '出席しますか？', absent: '欠席しますか？', late: '遅刻しますか？', early: '早退しますか？', late_early: '遅刻・早退しますか？' };
            if (next !== 'none' && CONFIRM_LABELS[next]) {
              if (!(await customConfirm(CONFIRM_LABELS[next]))) return;
            }
            setMemberStatus(name, next);
            render._highlightName = name;
            render();
          });
        });

        list.querySelectorAll('.time-row input[type="time"]').forEach(input => {
          input.addEventListener('change', () => {
            if (render._isPastEvent) { return; }
            if (!requireEditor()) { alert('ログインしてください'); return; }
            const timeName = input.dataset.timeFor;
            const loggedIn = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
            if (!isAdmin() && timeName !== loggedIn) { return; }
            if (input.closest('.member-card').dataset.locked === '1') return;
            if (render._isPastDeadline) {
              if (!isAdmin()) { alert('締切を過ぎています'); return; }
            }
            setMemberTime(timeName, input.value, input.dataset.timeType);
          });
        });


        if (render._highlightName) {
          const target = list.querySelector(`[data-name="${CSS.escape(render._highlightName)}"]`);
          if (target) {
            const card = target.closest('.member-card');
            card.classList.add('highlight');
            setTimeout(() => card.classList.remove('highlight'), 800);
          }
          render._highlightName = null;
        }
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatEditTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      // --- Login & Admin ---
      const STORAGE_ADMIN_PW = _T + 'volley-admin-pw';

      const loginModal = document.getElementById('loginModal');
      const adminModal = document.getElementById('adminModal');
      const gearBtn = document.getElementById('gearBtn');

      function showAdminOnlyFeatureNotice() {
        alert('この機能は管理者のみ変更できます');
      }

      function updateLoginStatus() {
        reconcileLoginTypeWithAdminName();
        const type = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        const el = document.getElementById('loginStatus');
        const editTitleBtn = document.getElementById('editGroupNameBtn');
        const admin = isAdmin();
        el.style.cursor = 'default';
        el.classList.remove('status-admin', 'status-member', 'status-none');
        if (type === 'admin') {
          const name = localStorage.getItem(STORAGE_EDITOR) || '';
          el.textContent = (name || '管理者') + '(管理者)';
          el.style.opacity = '1';
          el.classList.add('status-admin');
        } else if (type === 'member') {
          const name = localStorage.getItem(STORAGE_EDITOR) || '';
          el.textContent = name ? name + 'でログイン中' : '未ログイン';
          el.style.opacity = name ? '1' : '0.5';
          el.classList.add(name ? 'status-member' : 'status-none');
        } else {
          el.textContent = '未ログイン';
          el.style.opacity = '0.5';
          el.classList.add('status-none');
        }
        if (editTitleBtn) {
          editTitleBtn.classList.toggle('admin-only-locked', !admin);
          editTitleBtn.setAttribute('aria-disabled', admin ? 'false' : 'true');
          editTitleBtn.title = admin ? 'グループ名を変更' : 'この機能は管理者のみ変更できます';
        }
        if (gearBtn) {
          gearBtn.classList.toggle('admin-only-locked', !admin);
          gearBtn.setAttribute('aria-disabled', admin ? 'false' : 'true');
          gearBtn.title = admin ? '締切設定' : 'この機能は管理者のみ変更できます';
        }
      }
      updateLoginStatus();

      document.getElementById('loginStatus').addEventListener('click', () => {
        const type = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        if (!type) {
          // Not logged in → open login modal
          document.getElementById('loginError').style.display = 'none';
          document.getElementById('loginStep1').style.display = '';
          document.getElementById('newMemberSection').style.display = '';
          loginModal.classList.add('show');
          return;
        }
      });

      function showLoginError(msg) {
        const err = document.getElementById('loginError');
        err.textContent = msg;
        err.style.display = '';
      }

      function closeLoginModal() {
        loginModal.classList.remove('show');
        document.getElementById('newMemberSection').style.display = '';
        document.getElementById('newMemberNameInput').value = '';
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginStep1').style.display = '';
      }
      function backToLobbyFromLogin() { closeLoginModal(); location.href = location.pathname; }
      document.getElementById('loginCancel').addEventListener('click', backToLobbyFromLogin);
      document.getElementById('loginCloseX').addEventListener('click', backToLobbyFromLogin);
      // Ignore backdrop taps to avoid accidental navigation during input.
      loginModal.addEventListener('click', e => { if (e.target === loginModal) return; });

      document.getElementById('newMemberJoinBtn').addEventListener('click', async () => {
        const name = document.getElementById('newMemberNameInput').value.trim();
        const pin = document.getElementById('newMemberPinInput').value.trim();

        if (!name) { showLoginError('名前を入力してください'); return; }
        if (!/^\d{4}$/.test(pin)) { showLoginError('PINは4桁の数字で入力してください'); return; }

        const members = loadMembers();
        const sameName = findMemberByName(members, name);
        if (sameName) {
          if (sameName.state === 'inactive') {
            showLoginError('この名前は退会中メンバーが使用中です。管理者に復帰を依頼してください');
          } else {
            showLoginError('この名前は既に登録されています');
          }
          return;
        }
        const samePin = members.find(m => m && String(m.pin || '') === pin);
        if (samePin) {
          if (samePin.state === 'inactive') {
            showLoginError('このPINは退会中メンバーが使用中です。管理者に復帰を依頼してください');
          } else {
            showLoginError('このPINはすでに使われています');
          }
          return;
        }
        const adminPw = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
        if (pin === adminPw) { showLoginError('このPINは管理者PIN（4桁）と重複するため使えません'); return; }

        if (!(await customConfirm(name + 'さんとして参加しますか？'))) return;

        members.push({ name: name, pin, state: 'active' });
        saveMembers(members);

        setLoginState('member', name);

        closeLoginModal();
        updateLoginStatus();
        render();
        syncToServer();
      });

      // Admin settings modal
      function openAdminModal() {
        document.getElementById('adminNewPwInput').value = '';
        adminModal.classList.add('show');
      }

      function closeAdminModal() { adminModal.classList.remove('show'); document.getElementById('adminNewPwInput').value = ''; }
      document.getElementById('adminModalCancel').addEventListener('click', closeAdminModal);
      document.getElementById('adminModalCloseX').addEventListener('click', closeAdminModal);
      adminModal.addEventListener('click', e => { if (e.target === adminModal) closeAdminModal(); });

      document.getElementById('adminModalSave').addEventListener('click', () => {
        const newPw = document.getElementById('adminNewPwInput').value;
        if (newPw) localStorage.setItem(STORAGE_ADMIN_PW, newPw);
        closeAdminModal();
        alert('保存しました');
        render();
      });

      document.getElementById('adminResetBtn').addEventListener('click', () => {
        if (!confirm('管理者PIN（4桁）を初期値(0000)にリセットします。よろしいですか？')) return;
        localStorage.removeItem(STORAGE_ADMIN_PW);
        adminModal.classList.remove('show');
        alert('リセットしました。パスワードは 0000 です。');
      });

      function showTransferRecoveryCodeModal(recoveryCode, newAdminName) {
        return new Promise(resolve => {
          const ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px';
          ov.innerHTML =
            '<div style="width:min(520px,100%);background:#fff;border:1px solid rgba(124,58,237,0.2);border-radius:16px;box-shadow:0 24px 56px rgba(76,29,149,0.22);padding:18px">' +
            '<div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:10px">管理者を変更しました</div>' +
            '<div style="font-size:13px;line-height:1.7;color:var(--text);margin-bottom:10px">' +
            '新しい管理者は「' + escapeHTML(newAdminName) + '」です。<br>' +
            '下の復旧コードは必ずスクリーンショットまたはメモで保存し、新管理者へ安全に共有してください。' +
            '</div>' +
            '<div style="padding:12px;border:1px dashed rgba(124,58,237,0.45);border-radius:12px;background:#faf5ff;font-size:18px;font-weight:800;letter-spacing:1.2px;color:var(--primary);text-align:center;user-select:all;margin-bottom:10px" id="transferRecoveryCodeText"></div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px">' +
            '<button type="button" id="copyTransferRecoveryCodeBtn" style="padding:8px 12px;border:1px solid rgba(124,58,237,0.25);border-radius:10px;background:#fff;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer">復旧コードをコピー</button>' +
            '</div>' +
            '<label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);line-height:1.5;margin-bottom:12px;cursor:pointer">' +
            '<input id="confirmTransferRecoverySaved" type="checkbox" style="margin-top:2px">' +
            '<span>復旧コードをスクリーンショットまたはメモで保存し、新しい管理者に共有することを確認しました</span>' +
            '</label>' +
            '<div style="display:flex;justify-content:flex-end">' +
            '<button type="button" id="closeTransferRecoveryModalBtn" disabled style="padding:10px 14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;opacity:0.45;cursor:not-allowed">OK</button>' +
            '</div>' +
            '</div>';
          document.body.appendChild(ov);
          const codeEl = ov.querySelector('#transferRecoveryCodeText');
          const copyBtn = ov.querySelector('#copyTransferRecoveryCodeBtn');
          const check = ov.querySelector('#confirmTransferRecoverySaved');
          const okBtn = ov.querySelector('#closeTransferRecoveryModalBtn');
          codeEl.textContent = recoveryCode;
          copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(recoveryCode).then(() => {
              copyBtn.textContent = 'コピーしました';
              setTimeout(() => { copyBtn.textContent = '復旧コードをコピー'; }, 1600);
            });
          });
          check.addEventListener('change', () => {
            const ready = !!check.checked;
            okBtn.disabled = !ready;
            okBtn.style.opacity = ready ? '1' : '0.45';
            okBtn.style.cursor = ready ? 'pointer' : 'not-allowed';

          okBtn.addEventListener('click', () => {
            ov.remove();
            resolve();
          });
        });

      // --- App Settings ---
      const APP_VERSION = 'β版';
      const appSettingsModal = document.getElementById('appSettingsModal');
      const deleteGroupModal = document.getElementById('deleteGroupModal');

      document.getElementById('appVersionDisplay').textContent = APP_VERSION;
      const appCopyrightDisplay = document.getElementById('appCopyrightDisplay');
      if (appCopyrightDisplay) appCopyrightDisplay.textContent = '© 2026 smoolinq';

      function getCurrentUserPinForSettings() {
        const type = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        const name = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        if (!type || !name) return '';
        if (type === 'admin') {
          return String(localStorage.getItem(STORAGE_ADMIN_PW) || '').trim();
        }
        if (type === 'member') {
          const m = loadMembers().find(x => x && x.name === name);
          return String((m && m.pin) || '').trim();
        }
        return '';
      }

      document.getElementById('appSettingsBtn').addEventListener('click', () => {
        const leaveBtn = document.getElementById('leaveGroupBtn');
        const deleteBtn = document.getElementById('deleteGroupBtn');
        const pinDisplay = document.getElementById('appMyPinDisplay');
        const revealBtn = document.getElementById('appMyPinRevealBtn');
        const myPin = getCurrentUserPinForSettings();
        if (pinDisplay) pinDisplay.textContent = '••••';
        if (revealBtn) {
          revealBtn.dataset.pinValue = /^\d{4}$/.test(myPin) ? myPin : '';
          revealBtn.disabled = !revealBtn.dataset.pinValue;
          revealBtn.textContent = revealBtn.disabled ? 'PIN未設定' : '3秒だけ表示する';
        }
        if (isAdmin()) {
          if (leaveBtn) leaveBtn.style.display = '';
          if (deleteBtn) deleteBtn.style.display = '';
        } else {
          if (leaveBtn) leaveBtn.style.display = '';
          if (deleteBtn) deleteBtn.style.display = 'none';
        }
        appSettingsModal.classList.add('show');
      });
      let appPinRevealTimer = null;
      document.getElementById('appMyPinRevealBtn').addEventListener('click', () => {
        const pinDisplay = document.getElementById('appMyPinDisplay');
        const revealBtn = document.getElementById('appMyPinRevealBtn');
        const pinValue = String(revealBtn?.dataset.pinValue || '');
        if (!/^\d{4}$/.test(pinValue)) return;
        appendSecurityLog('pin_reveal_self', (localStorage.getItem(STORAGE_EDITOR) || '').trim(), 'app_settings');
        if (pinDisplay) pinDisplay.textContent = pinValue;
        if (revealBtn) revealBtn.textContent = '表示中...';
        if (appPinRevealTimer) clearTimeout(appPinRevealTimer);
        appPinRevealTimer = setTimeout(() => {
          if (pinDisplay) pinDisplay.textContent = '••••';
          if (revealBtn) revealBtn.textContent = '3秒だけ表示する';
        }, 3000);
      });
      document.getElementById('appSettingsClose').addEventListener('click', () => appSettingsModal.classList.remove('show'));
      appSettingsModal.addEventListener('click', e => { if (e.target === appSettingsModal) appSettingsModal.classList.remove('show'); });

      // Back to lobby
      document.getElementById('backToLobbyBtn').addEventListener('click', async () => {
        if (!(await customConfirm('ロビーに戻ります。\nよろしいですか？'))) return;
        location.href = location.pathname;
      });

      document.getElementById('leaveGroupBtn').addEventListener('click', async () => {
        const loginType = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        const name = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        if (loginType === 'admin') {
          alert('管理者はそのまま退会できません。\n\n先に「管理者を変更する」か「グループを削除する」を実行してください。');
          return;
        }
        if (loginType !== 'member' || !name) {
          alert('メンバーとしてログイン中のみ退会できます');
          return;
        }
        const ok = await customConfirm(
          '退会するとこの端末のログイン情報が削除されます。\n' +
          'メンバー情報は退会中として保持され、管理者が復帰できます。\n\n退会しますか？'
        );
        if (!ok) return;

        const members = loadMembers();
        const idx = members.findIndex(m => m && m.name === name);
        if (idx === -1) {
          clearLoginState();
          location.href = location.pathname;
          return;
        }

        const prevMembers = members.slice();
        const prevSessionRaw = localStorage.getItem(STORAGE_LOGIN_SESSION);
        members[idx].state = 'inactive';
        members[idx].pendingRemovalAt = '';
        members[idx].pendingRemovalBy = '';
        members[idx].pendingRemovalReason = '';
        members[idx].inactivatedAt = new Date().toISOString();
        saveMembers(members);
        appendSecurityLog('self_inactivate', name, 'leave_group');
        localStorage.removeItem(STORAGE_LOGIN_SESSION);
        const synced = await syncToServer({ ignoreSessionConflict: true });
        if (!synced) {
          saveMembers(prevMembers);
          if (prevSessionRaw) localStorage.setItem(STORAGE_LOGIN_SESSION, prevSessionRaw);
          else localStorage.removeItem(STORAGE_LOGIN_SESSION);
          alert('退会の同期に失敗しました。通信状態を確認して再度お試しください。');
          return;
        }

        clearLoginState();
        alert('退会しました（復帰可能）。');
        location.href = location.pathname;
      });

      // Delete group
      document.getElementById('deleteGroupBtn').addEventListener('click', () => {
        if (!isAdmin()) { alert('管理者のみ実行できます'); return; }
        appSettingsModal.classList.remove('show');
        document.getElementById('deleteGroupPwInput').value = '';
        document.getElementById('deleteGroupError').style.display = 'none';
        deleteGroupModal.classList.add('show');
        document.getElementById('deleteGroupPwInput').focus();
      });
      document.getElementById('deleteGroupCancel').addEventListener('click', () => deleteGroupModal.classList.remove('show'));
      deleteGroupModal.addEventListener('click', e => { if (e.target === deleteGroupModal) deleteGroupModal.classList.remove('show'); });
      document.getElementById('deleteGroupPwInput').addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
      });
      document.getElementById('deleteGroupPwInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('deleteGroupConfirm').click();
      });
      document.getElementById('deleteGroupConfirm').addEventListener('click', async () => {
        const pw = document.getElementById('deleteGroupPwInput').value;
        const stored = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
        if (pw !== stored) {
          const err = document.getElementById('deleteGroupError');
          err.textContent = 'パスワードが一致しません';
          err.style.display = '';
          return;
        }
        if (!confirm('本当にグループを削除しますか？\nこの操作は元に戻せません。')) return;
        const err = document.getElementById('deleteGroupError');
        err.style.display = 'none';
        let deleteSyncFailed = false;
        try {
          const deleteRes = await fetch(`${API_BASE}/api/team/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ team_id: _teamParam })
          });
          if (!deleteRes.ok) {
            deleteSyncFailed = true;
          }
        } catch {
          deleteSyncFailed = true;
        }
        if (deleteSyncFailed) {
          console.warn('[deleteGroup] helper delete API failed. fallback to SYNC_API delete tombstone');
        }
        const serverDeletePayload = {
          deleted: true,
          deletedAt: new Date().toISOString(),
          title: '',
          members: [],
          schedule: [],
          deadline: getDeadlineRules(),
          adminName: '',
          adminPw: '0000',
          recoveryCode: '',
          loginSession: null,
          attendancePractice: {},
          attendanceMatch: {}
        };
        const serverDeleteRes = await fetch(SYNC_API + '?team=' + encodeURIComponent(_teamParam), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(serverDeletePayload)
        });
        if (!serverDeleteRes.ok) {
          err.textContent = 'サーバー削除に失敗しました。通信状態を確認して再度お試しください';
          err.style.display = '';
          return;
        }
        // Mark team as deleted
        markTeamDeletedLocally(_teamParam);
        // Remove from recent teams
        try {
          const rt = JSON.parse(localStorage.getItem('volley-recent-teams')) || [];
          localStorage.setItem('volley-recent-teams', JSON.stringify(rt.filter(t => t.id !== _teamParam)));
        } catch { }
        // Clear all team data
        [STORAGE_MEMBERS, STORAGE_MODE, STORAGE_EDITOR, STORAGE_ADMINS, STORAGE_ADMIN_PW, STORAGE_ADMIN_NAME, STORAGE_ADMIN_RECOVERY,
          STORAGE_LOGIN_TYPE, STORAGE_DEADLINE, STORAGE_SCHEDULE, _T + 'volley-app-title',
          ATTENDANCE_KEYS.practice, ATTENDANCE_KEYS.match, _T + 'volley-attendance'].forEach(k => localStorage.removeItem(k));
        setCreatedTeams(getCreatedTeams().filter(id => id !== _teamParam));
        deleteGroupModal.classList.remove('show');
        location.href = location.pathname;
      });

      function updateDlRowToggle(toggle) {

        const track = toggle.nextElementSibling;
        const thumb = track.nextElementSibling;
        const on = toggle.checked;
        track.style.background = on ? 'var(--primary)' : '#ccc';
        thumb.style.left = on ? '18px' : '2px';
        row.querySelectorAll('input[type="number"], select').forEach(el => {

          el.disabled = !on;
        });
      }
      document.querySelectorAll('.dl-mode-toggle').forEach(toggle => {
        toggle.addEventListener('change', () => updateDlRowToggle(toggle));

        document.querySelectorAll('.dl-mode-toggle').forEach(toggle => {

          toggle.checked = rules[mode].enabled;
          updateDlRowToggle(toggle);
