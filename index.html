      // --- Editor Name (set via login) ---

      function applyMode() {
        render._prevCounts = undefined;
        render();
      }

      // --- Calendar Edit ---
      let calEditData = [];
      let calEditOtherMonths = [];
      let calEditYear, calEditMonth;
      let _calSavedSnapshot = '';

      function _calSnapshot() {
        return JSON.stringify(calEditOtherMonths.concat(calEditData));
      }

      function _calHasChanges() {
        return _calSnapshot() !== _calSavedSnapshot;
      }

      function openCalendarEdit() {
        const sel = new Date(dateInput.value + 'T00:00:00');
        calEditYear = sel.getFullYear();
        calEditMonth = sel.getMonth();
        loadCalMonth();
        _calSavedSnapshot = _calSnapshot();
        const admin = isAdmin();
        document.getElementById('calEditSave').style.display = admin ? '' : 'none';
        document.getElementById('calClearMonth').style.display = admin ? '' : 'none';
        document.getElementById('calEditModal').classList.add('show');
      }

      function loadCalMonth() {
        const prefix = calEditYear + '-' + String(calEditMonth + 1).padStart(2, '0');
        const all = loadSchedule();
        calEditData = all.filter(s => s.date.startsWith(prefix)).map(s => ({ ...s }));
        calEditOtherMonths = all.filter(s => !s.date.startsWith(prefix));
        document.getElementById('calEditTitle').textContent = calEditYear + '年' + (calEditMonth + 1) + '月';
        renderCalGrid(calEditYear, calEditMonth);
      }

      function renderCalGrid(year, month) {
        const grid = document.getElementById('calGrid');
        const dows = ['日', '月', '火', '水', '木', '金', '土'];
        let html = dows.map(d => '<div class="cal-dow">' + d + '</div>').join('');
        const firstDay = new Date(year, month, 1).getDay();
        for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell cal-empty"></div>';
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          const item = calEditData.find(s => s.date === dateStr);
          const cls = item ? 'cal-' + item.mode : '';
          const timeLabel = item && item.startTime ? '<span style="font-size:8px;line-height:1;opacity:0.8;display:block;text-align:center">' + item.startTime + '</span>' : '';
          html += '<div class="cal-cell ' + cls + '" data-caldate="' + dateStr + '">' + d + timeLabel + '</div>';
        }
        grid.innerHTML = html;
        const timeRow = document.getElementById('calTimeRow');
        timeRow.style.display = 'none';
        grid.querySelectorAll('.cal-cell:not(.cal-empty)').forEach(cell => {
          cell.addEventListener('click', () => {
            if (!isAdmin()) return;
            const dateStr = cell.dataset.caldate;
            const idx = calEditData.findIndex(s => s.date === dateStr);
            if (idx === -1) {
              calEditData.push({ date: dateStr, mode: 'practice' });
              renderCalGrid(year, month);
              showCalTime(dateStr);
            } else {
              showCalCellMenu(dateStr, cell);
            }
          });
        });
      }

      let _calMenuDate = null;

      function hideCalCellMenu() {
        document.getElementById('calCellMenu').style.display = 'none';
        _calMenuDate = null;
      }

      function showCalCellMenu(dateStr, cell) {
        const item = calEditData.find(s => s.date === dateStr);
        if (!item) return;
        _calMenuDate = dateStr;
        const menu = document.getElementById('calCellMenu');
        const otherMode = item.mode === 'practice' ? 'match' : 'practice';
        document.getElementById('calMenuMode').textContent = '🔄 ' + MODE_NAMES[otherMode] + 'に変更';
        const modalRect = document.getElementById('calEditModal').getBoundingClientRect();
        const cellRect = cell.getBoundingClientRect();
        let top = cellRect.bottom - modalRect.top + 4;
        let left = cellRect.left - modalRect.left;
        menu.style.display = '';
        const menuW = menu.offsetWidth;
        if (left + menuW > modalRect.width - 8) left = modalRect.width - menuW - 8;
        if (left < 8) left = 8;
        menu.style.top = top + 'px';
        menu.style.left = left + 'px';
      }

      document.getElementById('calMenuTime').addEventListener('click', () => {
        const dateStr = _calMenuDate;
        hideCalCellMenu();
        if (dateStr) showCalTime(dateStr, true);
      });

      document.getElementById('calMenuMode').addEventListener('click', async () => {
        const dateStr = _calMenuDate;
        hideCalCellMenu();
        if (!dateStr) return;
        const idx = calEditData.findIndex(s => s.date === dateStr);
        if (idx === -1) return;
        const item = calEditData[idx];
        const otherMode = item.mode === 'practice' ? 'match' : 'practice';
        const hasTime = !!item.startTime;
        const msg = MODE_NAMES[otherMode] + 'に変更しますか？' + (hasTime ? '\nセットした開始時間はリセットされます。' : '');
        if (!(await customConfirm(msg))) return;
        item.mode = otherMode;
        delete item.startTime;
        renderCalGrid(calEditYear, calEditMonth);
      });

      document.getElementById('calMenuDelete').addEventListener('click', async () => {
        const dateStr = _calMenuDate;
        hideCalCellMenu();
        if (!dateStr) return;
        const idx = calEditData.findIndex(s => s.date === dateStr);
        if (idx === -1) return;
        if (!(await customConfirm('この予定を削除しますか？'))) return;
        calEditData.splice(idx, 1);
        renderCalGrid(calEditYear, calEditMonth);
      });

      document.getElementById('calEditModal').addEventListener('click', (e) => {
        if (_calMenuDate && !e.target.closest('#calCellMenu') && !e.target.closest('.cal-cell')) {
          hideCalCellMenu();
        }
      });

      function showCalTime(dateStr, forceOpen) {
        const item = calEditData.find(s => s.date === dateStr);
        if (!item) return;
        if (!forceOpen && item.startTime) return; // already set, don't auto-open
        const timeRow = document.getElementById('calTimeRow');
        const d = new Date(dateStr + 'T00:00:00');
        document.getElementById('calTimeLabel').textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + MODE_NAMES[item.mode] + ' 開始:';
        document.getElementById('calTimeInput').value = item.startTime || '';
        timeRow.style.display = 'flex';
        timeRow.dataset.calTimeDate = dateStr;
      }

      document.getElementById('calTimeInput').addEventListener('change', function () {
        const dateStr = document.getElementById('calTimeRow').dataset.calTimeDate;
        const item = calEditData.find(s => s.date === dateStr);
        if (item) {
          item.startTime = this.value;
          // Update grid cell text without closing timeRow
          const cell = document.querySelector('.cal-cell[data-caldate="' + dateStr + '"]');
          if (cell) {
            const d = new Date(dateStr + 'T00:00:00').getDate();
            const timeLabel = this.value ? '<span style="font-size:8px;line-height:1;opacity:0.8;display:block;text-align:center">' + this.value + '</span>' : '';
            cell.innerHTML = d + timeLabel;
          }
        }
      });

      document.getElementById('calTimeClear').addEventListener('click', () => {
        const dateStr = document.getElementById('calTimeRow').dataset.calTimeDate;
        const item = calEditData.find(s => s.date === dateStr);
        if (item) {
          delete item.startTime;
          renderCalGrid(calEditYear, calEditMonth);
        }
      });

      function closeCalendarEdit() {
        hideCalCellMenu();
        document.getElementById('calTimeRow').style.display = 'none';
        document.getElementById('calEditModal').classList.remove('show');
      }

      function saveCalendar() {
        const merged = calEditOtherMonths.concat(calEditData);
        localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(merged));
        _calSavedSnapshot = _calSnapshot();
        render();
        syncToServer();
      }

      document.getElementById('calEditSave').addEventListener('click', () => {
        saveCalendar();
        closeCalendarEdit();
      });

      document.getElementById('calEditClose').addEventListener('click', async () => {
        if (_calHasChanges()) {
          if (await customConfirm('保存されていない変更があります。\n保存しますか？')) {
            saveCalendar();
          }
        }
        closeCalendarEdit();
      });

      document.getElementById('calClearMonth').addEventListener('click', async () => {
        if (calEditData.length === 0) return;
        if (!(await customConfirm(calEditYear + '年' + (calEditMonth + 1) + '月の予定をすべてクリアしますか？'))) return;
        calEditData = [];
        renderCalGrid(calEditYear, calEditMonth);
      });

      document.getElementById('calPrevMonth').addEventListener('click', () => {
        const merged = calEditOtherMonths.concat(calEditData); localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(merged));
        calEditMonth--;
        if (calEditMonth < 0) { calEditMonth = 11; calEditYear--; }
        loadCalMonth();
      });

      document.getElementById('calNextMonth').addEventListener('click', () => {
        const merged = calEditOtherMonths.concat(calEditData); localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(merged));
        calEditMonth++;
        if (calEditMonth > 11) { calEditMonth = 0; calEditYear++; }
        loadCalMonth();
      });

      // --- Member Settings ---
      function renderMemberSettings() {
        const admin = isAdmin();
        const members = loadMembers();
        const active = activeMembers(members);
        const inactive = inactiveMembers(members);
        const list = document.getElementById('memberSettingsList');
        const notice = admin ? '' : '<div style="padding:8px 0;font-size:12px;color:var(--text-light);text-align:center">※メンバー変更は管理者のみできます</div>';
        const adminN = getAdminName();
        const currentUser = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        const now = Date.now();
        const activeHtml = active.map((m) => {
          const isAdminMember = m.name === adminN;
          const pendingAt = m.pendingRemovalAt ? Date.parse(m.pendingRemovalAt) : NaN;
          const pending = Number.isFinite(pendingAt) && pendingAt + MEMBER_PENDING_HOURS * 60 * 60 * 1000 > now;
          const dueText = pending ? new Date(pendingAt + MEMBER_PENDING_HOURS * 60 * 60 * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + 'まで猶予' : '';
          return '<div class="ms-item">' +
            '<div class="ms-item-row">' +
            '<span class="ms-name' + (m.name === currentUser ? ' current-user' : '') + '">' + escapeHTML(m.name) + (isAdminMember ? ' <span class="admin-role-badge">管理者</span>' : '') + '</span>' +
            '</div>' +
            '<div class="ms-meta">' +
            (pending ? '<span class="ms-chip ms-chip-pending">退会申請中 ' + escapeHTML(dueText) + '</span>' : '') +
            (admin && !isAdminMember ? (
              pending
                ? '<button type="button" class="ms-action-btn" data-ms-action="cancel-request" data-ms-name="' + escapeHTML(m.name) + '">申請取消</button>'
                : '<button type="button" class="ms-action-btn warn" data-ms-action="request-remove" data-ms-name="' + escapeHTML(m.name) + '">退会申請</button>'
            ) : '') +
            '</div>' +
            '</div>';
        }).join('');
        const inactiveHtml = inactive.map((m) => {
          const since = m.inactivatedAt ? new Date(m.inactivatedAt).toLocaleDateString('ja-JP') : '';
          return '<div class="ms-item">' +
            '<div class="ms-item-row">' +
            '<span class="ms-name">' + escapeHTML(m.name) + '</span>' +
            '</div>' +
            '<div class="ms-meta">' +
            '<span class="ms-chip ms-chip-inactive">退会中' + (since ? ' ' + escapeHTML(since) : '') + '</span>' +
            (admin ? '<button type="button" class="ms-action-btn" data-ms-action="restore" data-ms-name="' + escapeHTML(m.name) + '">復帰</button>' : '') +
            (admin ? '<button type="button" class="ms-action-btn danger" data-ms-action="purge" data-ms-name="' + escapeHTML(m.name) + '">完全削除</button>' : '') +
            '</div>' +
            '</div>';
        }).join('');

        list.innerHTML =
          notice +
          '<div style="font-size:12px;font-weight:700;color:var(--text-light);margin:6px 0 4px">参加中メンバー</div>' +
          (activeHtml || '<div style="padding:6px 0;font-size:12px;color:var(--text-light)">参加中メンバーはいません</div>') +
          '<div style="font-size:12px;font-weight:700;color:var(--text-light);margin:14px 0 4px">退会中（復帰可能）</div>' +
          (inactiveHtml || '<div style="padding:6px 0;font-size:12px;color:var(--text-light)">現在、復帰待ちメンバーはいません</div>');
        document.getElementById('changeAdminBtn').style.display = admin ? 'block' : 'none';
        document.getElementById('changeAdminPanel').style.display = 'none';
      }

      document.getElementById('memberSettingsBtn').addEventListener('click', () => {
        renderMemberSettings();
        document.getElementById('memberSettingsModal').classList.add('show');
      });

      document.getElementById('memberSettingsClose').addEventListener('click', () => {
        document.getElementById('memberSettingsModal').classList.remove('show');
        render();
      });

      document.getElementById('memberSettingsList').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-ms-action]');
        if (!btn) return;
        if (!isAdmin()) return;
        const action = btn.dataset.msAction;
        const name = (btn.dataset.msName || '').trim();
        if (!name) return;
        const members = loadMembers();
        const idx = members.findIndex(m => m && m.name === name);
        if (idx === -1) return;
        const currentUser = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
        const adminName = getAdminName();

        if (action === 'request-remove') {
          if (name === adminName) { alert('管理者は退会申請できません'); return; }
          const reason = prompt('退会申請の理由を入力してください（必須）', '未入力');
          if (reason == null) return;
          const reasonText = String(reason).trim();
          if (!reasonText) { alert('理由を入力してください'); return; }
          const ok = await customConfirm('「' + name + '」を退会申請にしますか？\n24時間後に退会中へ移行します。');
          if (!ok) return;
          members[idx].pendingRemovalAt = new Date().toISOString();
          members[idx].pendingRemovalBy = currentUser || adminName || 'admin';
          members[idx].pendingRemovalReason = reasonText;
          saveMembers(members);
          appendSecurityLog('request_remove', name, reasonText);
          await syncToServer();
          renderMemberSettings();
          render();
          return;
        }

        if (action === 'cancel-request') {
          members[idx].pendingRemovalAt = '';
          members[idx].pendingRemovalBy = '';
          members[idx].pendingRemovalReason = '';
          saveMembers(members);
          appendSecurityLog('cancel_remove_request', name, '');
          await syncToServer();
          renderMemberSettings();
          render();
          return;
        }

        if (action === 'restore') {
          const ok = await customConfirm('「' + name + '」を復帰しますか？');
          if (!ok) return;
          members[idx].state = 'active';
          members[idx].inactivatedAt = '';
          members[idx].pendingRemovalAt = '';
          members[idx].pendingRemovalBy = '';
          members[idx].pendingRemovalReason = '';
          saveMembers(members);
          appendSecurityLog('restore_member', name, '');
          await syncToServer();
          renderMemberSettings();
          render();
          return;
        }

        if (action === 'purge') {
          const ok = await customConfirm('「' + name + '」を完全削除しますか？\nこの操作は元に戻せません。');
          if (!ok) return;
          members.splice(idx, 1);
          saveMembers(members);
          try {
            const recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
            const nextRecent = recent.filter(t => !(t && t.id === _teamParam && String(t.user || '').trim() === name));
            localStorage.setItem(RECENT_KEY, JSON.stringify(nextRecent));
          } catch { }
          appendSecurityLog('purge_member', name, '');
          await syncToServer();
          renderMemberSettings();
          render();
        }
      });

      // --- Change Admin ---
      document.getElementById('changeAdminBtn').addEventListener('click', () => {
        const panel = document.getElementById('changeAdminPanel');
        if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
        const members = loadMembers();
        const currentAdmin = getAdminName();
        const listEl = document.getElementById('changeAdminList');
        listEl.innerHTML = members
        .map((m, idx) => ({ m, idx }))
        .filter(x => x.m && x.m.name !== currentAdmin && x.m.state !== 'inactive')
        .map(x =>
          '<label style="display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;font-size:14px">' +
          '<input type="radio" name="newAdmin" value="' + x.idx + '" style="width:18px;height:18px;accent-color:var(--late)">' +
          escapeHTML(x.m.name) +
          '</label>'
        ).join('');
        panel.style.display = '';
      });
      document.getElementById('changeAdminCancel').addEventListener('click', () => {
        document.getElementById('changeAdminPanel').style.display = 'none';
      });
      document.getElementById('changeAdminConfirm').addEventListener('click', async () => {
        const selected = document.querySelector('input[name="newAdmin"]:checked');
        if (!selected) { alert('メンバーを選択してください'); return; }
        const oldAdmin = getAdminName();
        if (!oldAdmin) { alert('現在の管理者情報を取得できません'); return; }
        const ms = loadMembers();
        const selectedIndex = parseInt(selected.value, 10);
        if (Number.isNaN(selectedIndex) || selectedIndex < 0 || selectedIndex >= ms.length) {
          alert('選択したメンバーが見つかりません');
          return;
        }
        const nextAdmin = ms[selectedIndex];
        if (!nextAdmin) { alert('選択したメンバーが見つかりません'); return; }
        const newAdminName = String(nextAdmin.name || '').trim();
        if (!newAdminName) { alert('選択したメンバーが見つかりません'); return; }
        const nextAdminPin = String(nextAdmin.pin || '').trim();
        if (!/^\d{4}$/.test(nextAdminPin)) {
          alert('新しい管理者のPIN（4桁）が未設定です。先にメンバーPINを設定してください。');
          return;
        }
        const oldAdminPw = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
        const ok = await customConfirm('「' + newAdminName + '」を新しい管理者にします。\n\n変更後はあなたの管理者権限は失われます。\n管理者PINは「' + newAdminName + '」さんのPIN（4桁）に切り替わります。\n復旧コードは再発行されます。\n\nよろしいですか？');
        if (!ok) return;

        const prevMembers = ms.map(m => ({ ...m }));
        const prevAdminName = localStorage.getItem(STORAGE_ADMIN_NAME) || '';
        const prevAdminPw = localStorage.getItem(STORAGE_ADMIN_PW) || '';
        const prevRecovery = localStorage.getItem(STORAGE_ADMIN_RECOVERY) || '';
        const prevLoginType = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
        const prevEditor = localStorage.getItem(STORAGE_EDITOR) || '';
        const prevSession = localStorage.getItem(STORAGE_LOGIN_SESSION) || '';
        const rotatedRecoveryCode = generateRecoveryCode();
        ms.forEach(m => {
          if (m && m.role != null) delete m.role;
        });
        let oldAdminMember = ms.find(m => m && m.name === oldAdmin);
        if (!oldAdminMember) {
          oldAdminMember = { name: oldAdmin, pin: oldAdminPw };
          ms.unshift(oldAdminMember);
        } else if (!/^\d{4}$/.test(String(oldAdminMember.pin || ''))) {
          oldAdminMember.pin = oldAdminPw;
        }
        saveMembers(ms);
        localStorage.setItem(STORAGE_ADMIN_NAME, newAdminName);
        localStorage.setItem(STORAGE_ADMIN_PW, nextAdminPin);
        localStorage.setItem(STORAGE_ADMIN_RECOVERY, rotatedRecoveryCode);
        setLoginState('member', oldAdmin);
        document.getElementById('changeAdminPanel').style.display = 'none';
        document.getElementById('memberSettingsModal').classList.remove('show');
        updateLoginStatus();
        render();
        const synced = await syncToServer();
        if (!synced) {
          saveMembers(prevMembers);
          localStorage.setItem(STORAGE_ADMIN_NAME, prevAdminName);
          localStorage.setItem(STORAGE_ADMIN_PW, prevAdminPw);
          localStorage.setItem(STORAGE_ADMIN_RECOVERY, prevRecovery);
          if (prevLoginType) localStorage.setItem(STORAGE_LOGIN_TYPE, prevLoginType); else localStorage.removeItem(STORAGE_LOGIN_TYPE);
          if (prevEditor) localStorage.setItem(STORAGE_EDITOR, prevEditor); else localStorage.removeItem(STORAGE_EDITOR);
          if (prevSession) localStorage.setItem(STORAGE_LOGIN_SESSION, prevSession); else localStorage.removeItem(STORAGE_LOGIN_SESSION);
          updateLoginStatus();
          render();
          alert('管理者変更の同期に失敗したため、変更を元に戻しました。通信状態を確認して再度お試しください。');
          return;
        }
        await showTransferRecoveryCodeModal(rotatedRecoveryCode, newAdminName);
        alert('管理者変更が完了しました。\n新しい管理者はメンバーPIN（4桁）でログインできます。');
      });

      // --- Invite Link (popup) ---
      const invitePopup = document.getElementById('invitePopup');
      document.getElementById('showInviteBtn').addEventListener('click', () => {
        const teamId = _teamParam;
        const groupName = (localStorage.getItem(_T + 'volley-app-title') || '').trim();
        const qs = '?team=' + encodeURIComponent(teamId) + (groupName ? '&name=' + encodeURIComponent(groupName) : '');
        const url = location.origin + location.pathname + qs;
        document.getElementById('inviteTeamId').textContent = teamId;
        document.getElementById('inviteUrl').textContent = url;
        invitePopup.classList.add('show');
      });
      document.getElementById('inviteIdCopyBtn').addEventListener('click', () => {
        const id = document.getElementById('inviteTeamId').textContent;
        navigator.clipboard.writeText(id).then(() => {
          const btn = document.getElementById('inviteIdCopyBtn');
          btn.textContent = 'コピーしました';
          setTimeout(() => { btn.textContent = 'IDをコピー'; }, 1500);
        });
      });
      document.getElementById('inviteCopyBtn').addEventListener('click', () => {
        const url = document.getElementById('inviteUrl').textContent;
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('inviteCopyBtn');
          btn.textContent = 'コピーしました';
          setTimeout(() => { btn.textContent = 'URLをコピー'; }, 1500);
        });
      });
      document.getElementById('inviteCloseBtn').addEventListener('click', () => invitePopup.classList.remove('show'));
      invitePopup.addEventListener('click', e => { if (e.target === invitePopup) invitePopup.classList.remove('show'); });

      // --- Editable Title ---
      const STORAGE_TITLE = _T + 'volley-app-title';
      const DEFAULT_TITLE = 'ママさんバレー 出席管理';
      const appTitleEl = document.getElementById('appTitle');
      const editGroupNameBtn = document.getElementById('editGroupNameBtn');
      const groupNameModal = document.getElementById('groupNameModal');
      const groupNameInput = document.getElementById('groupNameInput');
      const groupNameError = document.getElementById('groupNameError');
      appTitleEl.textContent = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;

      function openTitleEditorModal() {
        if (!isAdmin()) { showAdminOnlyFeatureNotice(); return; }
        const current = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
        groupNameInput.value = current;
        groupNameError.style.display = 'none';
        groupNameError.textContent = '';
        groupNameModal.classList.add('show');
        groupNameInput.focus();
        groupNameInput.setSelectionRange(groupNameInput.value.length, groupNameInput.value.length);
      }
      if (editGroupNameBtn) {
        editGroupNameBtn.addEventListener('click', openTitleEditorModal);
      }
      function closeGroupNameModal() {
        groupNameModal.classList.remove('show');
        groupNameError.style.display = 'none';
        groupNameError.textContent = '';
      }
      async function saveGroupNameFromModal() {
        const v = groupNameInput.value.trim();
        if (!v) {
          groupNameError.textContent = 'グループ名が未記入です';
          groupNameError.style.display = '';
          groupNameInput.focus();
          return;
        }
        if (!(await customConfirm('グループ名を「' + v + '」に変更しますか？'))) return;
        localStorage.setItem(STORAGE_TITLE, v);
        appTitleEl.textContent = v;
        try {
          const rt = JSON.parse(localStorage.getItem('volley-recent-teams')) || [];
          const entry = rt.find(t => t.id === _teamParam);
          if (entry) { entry.name = v; localStorage.setItem('volley-recent-teams', JSON.stringify(rt)); }
        } catch { }
        syncToServer();
        closeGroupNameModal();
      }
      document.getElementById('groupNameCancel').addEventListener('click', closeGroupNameModal);
      document.getElementById('groupNameCloseX').addEventListener('click', closeGroupNameModal);
      document.getElementById('groupNameSave').addEventListener('click', () => { saveGroupNameFromModal(); });
      groupNameModal.addEventListener('click', e => { if (e.target === groupNameModal) closeGroupNameModal(); });
      groupNameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          if (e.isComposing || e.keyCode === 229) return;
          saveGroupNameFromModal();
        }
        if (e.key === 'Escape') closeGroupNameModal();
      });

      // --- Server Sync ---
      const SYNC_API = 'https://club-attendance-api.smoolinq.workers.dev/';

      function buildSyncData() {
        return {
          title: localStorage.getItem(STORAGE_TITLE) || '',
          members: loadMembers(),
          schedule: loadSchedule(),
          deadline: getDeadlineRules(),
          adminName: getAdminName(),
          adminPw: localStorage.getItem(STORAGE_ADMIN_PW) || '0000',
          recoveryCode: localStorage.getItem(STORAGE_ADMIN_RECOVERY) || '',
          loginSession: getLoginSession(),
          attendancePractice: JSON.parse(localStorage.getItem(ATTENDANCE_KEYS.practice) || '{}'),
          attendanceMatch: JSON.parse(localStorage.getItem(ATTENDANCE_KEYS.match) || '{}')
        };
      }

      function sessionTimeMs(session) {
        const t = Date.parse(String(session && session.updatedAt ? session.updatedAt : ''));
        return Number.isFinite(t) ? t : 0;
      }

      function shouldLogoutBySession(localSession, serverSession) {
        if (!localSession || !serverSession) return false;
        const sameIdentity =
          String(serverSession.editor || '') === String(localSession.editor || '') &&
          String(serverSession.type || '') === String(localSession.type || '');
        if (!sameIdentity) return false;
        // Only log out when server session is newer than local one.
        return sessionTimeMs(serverSession) > sessionTimeMs(localSession);
      }

  async function syncToServer(options) {
    try {
      const opts = options || {};
      const localSession = getLoginSession();
      if (!opts.ignoreSessionConflict && localSession && localSession.id) {
        const latest = await syncFromServer();
        const serverSession = latest && latest.loginSession ? latest.loginSession : null;
        const serverSessionId = serverSession ? serverSession.id : '';
        if (serverSessionId && serverSessionId !== localSession.id) {
          if (shouldLogoutBySession(localSession, serverSession)) {
            clearLoginState();
            alert('別の端末でログインされたため、この端末はログアウトされました。');
            location.href = location.pathname;
            return false;
          }
        }
      }
      const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(_teamParam), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
            body: JSON.stringify(buildSyncData())
          });
          return res.ok;
        } catch (e) { return false; }
      }

      async function syncFromServer() {
        try {
          const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(_teamParam));
          if (!res.ok) return null;
          return await res.json();
        } catch (e) { return null; }
      }

      function applyServerData(data) {
        console.log('[applyServerData] members=', Array.isArray(data?.members) ? data.members.length : 'no-members', 'loginType=', localStorage.getItem(STORAGE_LOGIN_TYPE), 'editor=', localStorage.getItem(STORAGE_EDITOR));
        if (!data) return false;
        if (isDeletedPayload(data)) {
          markTeamDeletedLocally(_teamParam);
          clearLoginState();
          alert('このグループは削除されました');
          location.href = location.pathname;
          return true;
        }
        let changed = false;
        // Title: always sync from server
        if (data.title) {
          const local = localStorage.getItem(STORAGE_TITLE) || '';
          if (data.title !== local) { localStorage.setItem(STORAGE_TITLE, data.title); changed = true; }
        }
        // Members: server is source of truth (reflect deletions too)
        if (Array.isArray(data.members)) {
          const local = loadMembers();
          // Avoid wiping local members on first sync when server is still empty.
          if (data.members.length === 0 && local.length > 0) {
            // keep local members and push them on syncToServer()
          } else {
            const localMap = new Map(local.map(m => [m.name, m]));

            // Build next members list in server order
            const next = data.members.map(sm => {
              const lm = localMap.get(sm.name) || {};
              const out = { ...lm, ...sm };
              if (out.role != null) delete out.role;
              // Keep local pin if server omitted
              if (sm.pin == null && lm.pin != null) out.pin = lm.pin;
              return out;
            });

            // Save only if changed
            if (JSON.stringify(next) !== JSON.stringify(local)) {
              saveMembers(next);
              changed = true;
            }

            // If this device was logged in as a member and got deleted -> lobby
            const loginType = localStorage.getItem(STORAGE_LOGIN_TYPE);
            const editorName = (localStorage.getItem(STORAGE_EDITOR) || '').trim();
            if (loginType === 'member' && editorName) {
              const stillExists = next.some(m => m && m.name === editorName && m.state !== 'inactive');
              if (!stillExists) {
                clearLoginState();
                alert('削除されました');
                location.href = location.pathname; // lobby (no ?team=)
                return true;
              }
            }
          }
        }
        // Single-device login session control.
    if (data.loginSession && data.loginSession.id) {
      const localType = localStorage.getItem(STORAGE_LOGIN_TYPE) || '';
      const localSession = getLoginSession();
      if (localType && localSession && localSession.id && data.loginSession.id !== localSession.id) {
        if (shouldLogoutBySession(localSession, data.loginSession)) {
          clearLoginState();
          _skipNextSyncOnce = true;
          alert('別の端末でログインされたため、この端末はログアウトされました。');
          location.href = location.pathname;
          return true;
        }
      }
    }
        // Schedule: merge, server wins for same date
        if (Array.isArray(data.schedule) && data.schedule.length > 0) {
          const local = JSON.parse(localStorage.getItem(STORAGE_SCHEDULE) || '[]');
          const localMap = new Map(local.map(s => [s.date, s]));
          let updated = false;
          for (const ss of data.schedule) {
            const ls = localMap.get(ss.date);
            if (!ls) { local.push(ss); updated = true; }
            else if (JSON.stringify(ss) !== JSON.stringify(ls)) {
              Object.assign(ls, ss); updated = true;
            }
          }
          if (updated) {
            local.sort((a, b) => a.date.localeCompare(b.date));
            localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(local));
            changed = true;
          }
        }
        // Deadline: always sync from server
        if (data.deadline) {
          const local = localStorage.getItem(STORAGE_DEADLINE);
          const sv = JSON.stringify(data.deadline);
          if (sv !== local) { localStorage.setItem(STORAGE_DEADLINE, sv); changed = true; }
        }
        // Admin name: always sync from server
        if (data.adminName) {
          const local = localStorage.getItem(STORAGE_ADMIN_NAME) || '';
          if (data.adminName !== local) { localStorage.setItem(STORAGE_ADMIN_NAME, data.adminName); changed = true; }
        }
        if (reconcileLoginTypeWithAdminName()) changed = true;
        // Admin password: always sync from server
        if (data.adminPw) {
          const local = localStorage.getItem(STORAGE_ADMIN_PW) || '0000';
          if (data.adminPw !== local) { localStorage.setItem(STORAGE_ADMIN_PW, data.adminPw); changed = true; }
        }
        // Recovery code: always sync from server
        if (typeof data.recoveryCode === 'string' && data.recoveryCode) {
          const local = localStorage.getItem(STORAGE_ADMIN_RECOVERY) || '';
          if (data.recoveryCode !== local) { localStorage.setItem(STORAGE_ADMIN_RECOVERY, data.recoveryCode); changed = true; }
        }
        // Attendance: per-member, newer _editedAt wins
        function mergeAttendance(serverAtt, key) {
          if (!serverAtt || Object.keys(serverAtt).length === 0) return;
          const localAtt = JSON.parse(localStorage.getItem(key) || '{}');
          let merged = false;
          for (const date in serverAtt) {
            if (!localAtt[date]) { localAtt[date] = serverAtt[date]; merged = true; continue; }
            const memberNames = new Set();
            for (const f in serverAtt[date]) {
              memberNames.add(f.replace(/_(time|lateTime|earlyTime|editedBy|editedAt)$/, ''));
            }
            for (const name of memberNames) {
              const serverTime = serverAtt[date][name + '_editedAt'] || '';
              const localTime = localAtt[date][name + '_editedAt'] || '';
              if (serverTime > localTime || (!localTime && !(name in localAtt[date]))) {
                for (const f in serverAtt[date]) {
                  if (f === name || f.startsWith(name + '_')) {
                    localAtt[date][f] = serverAtt[date][f]; merged = true;
                  }
                }
              }
            }
          }
          if (merged) { localStorage.setItem(key, JSON.stringify(localAtt)); changed = true; }
        }
        mergeAttendance(data.attendancePractice, ATTENDANCE_KEYS.practice);
        mergeAttendance(data.attendanceMatch, ATTENDANCE_KEYS.match);
        if (ensureAdminMemberRecord()) changed = true;
        return changed;
      }

      // --- Init ---
      applyMode();

      (async () => {
        const data = await syncFromServer();
        if (applyServerData(data)) {
          // Reload UI with server data
          const titleEl = document.getElementById('appTitle');
          if (titleEl) titleEl.textContent = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
          render();
        }
        // Always push local state to server
        if (_skipNextSyncOnce) _skipNextSyncOnce = false;
        else syncToServer();
        // Force login if not logged in
        if (!localStorage.getItem(STORAGE_LOGIN_TYPE)) {
          document.getElementById('newMemberNameInput').value = '';
          document.getElementById('loginError').style.display = 'none';
          document.getElementById('loginStep1').style.display = '';
          document.getElementById('newMemberSection').style.display = '';
          loginModal.classList.add('show');
        }
      })();

      // Periodic server check for cross-device login conflicts.
      setInterval(async () => {
        const data = await syncFromServer();
        if (applyServerData(data)) {
          const titleEl = document.getElementById('appTitle');
          if (titleEl) titleEl.textContent = localStorage.getItem(STORAGE_TITLE) || DEFAULT_TITLE;
          render();
        }
      }, 15000);

      // Global Esc key handler for modals
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (loginModal.classList.contains('show')) { backToLobbyFromLogin(); return; }
        if (adminModal.classList.contains('show')) { closeAdminModal(); return; }
        if (document.getElementById('settingsModal').classList.contains('show')) { closeSettingsModal(); return; }
        if (document.getElementById('modal').classList.contains('show')) { closeModal(); return; }
        if (document.getElementById('userMenu').classList.contains('show')) { document.getElementById('userMenu').classList.remove('show'); return; }
      });
    }
  </script>
</body>
