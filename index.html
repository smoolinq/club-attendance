  <title>出欠ちゃん</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    :root {
      --primary: #5b21b6;
      --primary-light: #7c3aed;
      --bg: #eef0ff;
      --card: #ffffff;
      --text: #1e1b4b;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --surface-border: rgba(148, 163, 184, 0.22);
      --surface-glass: rgba(255, 255, 255, 0.9);
      --shadow-soft: 0 12px 36px rgba(30, 27, 75, 0.12);
      --shadow-card: 0 14px 32px rgba(76, 29, 149, 0.12);
      --present: #16a34a;
      --absent: #dc2626;
      --late: #f59e0b;
      --early: #3b82f6;
      --unset: #d1d5db;
      --practice: #2563eb;
      --match: #db2777;
    }

    @keyframes softPulse {

      0%,
      100% {
        opacity: 0.18;
        transform: translateY(0);
      }

      50% {
        opacity: 0.32;
        transform: translateY(-2px);
      }
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes badgePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(124, 58, 237, 0.08);
      }
    }

    @keyframes sheenSlide {
      0% {
        transform: translateX(-140%) skewX(-22deg);
        opacity: 0;
      }

      30% {
        opacity: 0.22;
      }

      100% {
        transform: translateX(180%) skewX(-22deg);
        opacity: 0;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background:
        radial-gradient(1200px 540px at 16% -10%, rgba(129, 140, 248, 0.34), transparent 62%),
        radial-gradient(880px 460px at 92% 8%, rgba(168, 85, 247, 0.26), transparent 66%),
        radial-gradient(760px 460px at 48% 112%, rgba(129, 140, 248, 0.2), transparent 68%),
        linear-gradient(160deg, #e9edff 0%, #f3efff 44%, #f9f7ff 100%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: -2;
      background:
        radial-gradient(380px 260px at 22% 16%, rgba(255, 255, 255, 0.62), transparent 72%),
        radial-gradient(420px 300px at 80% 24%, rgba(255, 255, 255, 0.34), transparent 76%);
    }

    body::after {
      z-index: -1;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.07));
    }

    /* === Header === */
    header {
      width: min(1080px, calc(100% - 28px));
      margin: 14px auto 10px;
      background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 56%, #6d28d9 100%);
      color: #fff;
      padding: 10px 20px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 16px 34px rgba(76, 29, 149, 0.28);
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: -35% -20% auto;
      height: 64%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0));
      pointer-events: none;
      animation: softPulse 6s ease-in-out infinite;
    }

    .beta-notice {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto 10px;
      padding: 5px 12px;
      border-radius: 10px;
      border: 1px solid rgba(124, 58, 237, 0.16);
      background: rgba(255, 255, 255, 0.78);
      color: rgba(49, 46, 129, 0.82);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
      flex-shrink: 0;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .header-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      margin-bottom: 2px;
      position: relative;
    }

    .title-block {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .title-block h1 {
      margin: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-top>.title-block {
      min-width: 0;
      justify-self: start;
    }

    .title-edit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
      width: min(30ch, calc(100vw - 280px));
      min-width: 0;
    }

    .title-edit-row input {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(124, 58, 237, 0.35);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
    }

    .title-edit-row input:focus {
      border-color: rgba(124, 58, 237, 0.65);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.16);
    }

    .title-edit-row button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-edit-row button:active {
      background: rgba(255, 255, 255, 0.35);
    }

    .group-title-edit-btn {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      transition: background .18s ease, opacity .18s ease;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(30, 27, 75, 0.14);
    }

    .group-title-edit-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .group-title-edit-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.55);
      cursor: not-allowed;
      opacity: 0.85;
    }
    .group-title-edit-btn.admin-only-locked {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.65);
      cursor: not-allowed;
      opacity: 0.9;
    }
    .group-title-edit-btn.admin-only-locked:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .group-title-edit-btn.admin-only-locked::before {
      content: "🔒 ";
      font-size: 9px;
    }

    .settings-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.16);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, background .2s ease, box-shadow .2s ease;
    }

    .settings-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 16px rgba(30, 27, 75, 0.2);
    }

    .settings-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }
    .settings-btn.admin-only-locked {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.75);
      cursor: not-allowed;
      box-shadow: none;
    }
    .settings-btn.admin-only-locked:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }
    .settings-btn.admin-only-locked::after {
      content: "🔒";
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      line-height: 1;
      background: rgba(15, 23, 42, 0.75);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-top: 0;
      margin-top: -10px;
    }

    .date-main {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #loginStatus {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      cursor: default;
    }

    #loginStatus.status-admin {
      color: #fff;
      background: rgba(76, 29, 149, 0.55);
      border-color: rgba(255, 255, 255, 0.35);
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    #loginStatus.status-member {
      color: #1f1147;
      background: #ffffff;
      border-color: rgba(139, 92, 246, 0.45);
      font-weight: 800;
    }

    #loginStatus.status-none {
      color: #f8fafc;
      background: rgba(76, 29, 149, 0.42);
      border-color: rgba(255, 255, 255, 0.3);
      font-weight: 600;
    }

    .date-row button {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, background .2s ease;
    }

    .date-row button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.24);
    }

    .date-row button:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #dateInput {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.36);
      color: #fff;
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 15px;
      flex: 0 0 auto;
      min-width: 170px;
      width: 170px;
      text-align: center;
      text-align-last: center;
      font-variant-numeric: tabular-nums;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    #dateInput:focus {
      border-color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
      outline: none;
    }

    #dateInput::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    #dateInput::-webkit-datetime-edit,
    #dateInput::-webkit-date-and-time-value,
    #dateInput::-webkit-datetime-edit-fields-wrapper {
      text-align: center;
      justify-content: center;
      width: 100%;
    }

    .date-row .today-badge {
      position: absolute;
      left: 100%;
      margin-left: 8px;
      top: 50%;
      transform: translateY(-50%);
      align-self: auto;
    }

    .today-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      background: #ede9fe;
      border-radius: 8px;
      padding: 3px 8px;
      white-space: nowrap;
      animation: badgePulse 2.8s ease-in-out infinite;
    }

    .header-none-count {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .header-none-count .count {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 3px 12px;
    }

    .lobby-logo {
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.02em;
      line-height: 1.05;
      margin-bottom: 2px;
      animation: logoFloat 4.6s ease-in-out infinite;
      transform-origin: center;
    }

    .lobby-subtitle {
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #625f84;
      letter-spacing: 0.08em;
      margin-top: 9px;
      margin-bottom: 8px;
    }

    .lobby-subcopy {
      width: 100%;
      max-width: 420px;
      margin: 0 0 18px;
      font-size: 13px;
      color: #4b5563;
      text-align: center;
      font-weight: 500;
    }

    .lobby-login-btn,
    .lobby-create-btn {
      width: 100%;
      padding: 13px 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
      position: relative;
      overflow: hidden;
    }

    .lobby-login-btn::after,
    .lobby-create-btn::after {
      content: "";
      position: absolute;
      top: -30%;
      left: -140%;
      width: 68%;
      height: 180%;
      background: linear-gradient(110deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.44) 52%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-20deg);
      opacity: 0;
      pointer-events: none;
    }

    .lobby-login-btn::before,
    .lobby-create-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .lobby-login-btn {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
      margin-bottom: 8px;
    }

    .lobby-login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 14px 28px rgba(76, 29, 149, 0.35);
    }

    .lobby-login-btn:hover::after,
    .lobby-create-btn:hover::after {
      opacity: 1;
      animation: sheenSlide .7s ease;
    }

    .lobby-create-btn {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      border: none;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
    }

    .lobby-create-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 14px 28px rgba(76, 29, 149, 0.35);
    }

    .lobby-login-btn:active,
    .lobby-create-btn:active {
      transform: translateY(1px);
      background: linear-gradient(135deg, #4c1d95, #5b21b6);
      box-shadow: 0 4px 12px rgba(30, 27, 75, 0.18);
    }

    .lobby-login-btn:active::after,
    .lobby-create-btn:active::after,
    .lobby-login-btn:focus-visible::after,
    .lobby-create-btn:focus-visible::after {
      opacity: 1;
      left: 160%;
      transition: left .45s ease, opacity .22s ease;
    }

    .lobby-relogin-panel {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: rgba(124, 58, 237, 0.06);
      border: 1px solid rgba(124, 58, 237, 0.22);
      border-radius: 14px;
    }

    #reloginPanel .lobby-login-btn,
    #reloginPanel .lobby-create-btn,
    #createTeamPanel .lobby-login-btn,
    #createTeamPanel .lobby-create-btn {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 6px 14px rgba(76, 29, 149, 0.18);
      filter: none;
    }

    #reloginPanel .lobby-login-btn:hover,
    #reloginPanel .lobby-create-btn:hover,
    #createTeamPanel .lobby-login-btn:hover,
    #createTeamPanel .lobby-create-btn:hover {
      box-shadow: 0 8px 16px rgba(76, 29, 149, 0.22);
      filter: brightness(1.01);
    }

    #reloginPanel .lobby-login-btn:active,
    #reloginPanel .lobby-create-btn:active,
    #createTeamPanel .lobby-login-btn:active,
    #createTeamPanel .lobby-create-btn:active {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      box-shadow: 0 4px 10px rgba(76, 29, 149, 0.16);
    }

    .lobby-card {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
      padding: 14px 15px;
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(5px);
    }

    .lobby-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .lobby-my-groups {
      padding-top: 12px;
    }
    .lobby-my-groups-title {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin: 0 0 10px;
      padding: 2px 0 8px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      cursor: default;
      user-select: none;
    }
    .lobby-my-groups-title-main {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #4c1d95;
      text-transform: uppercase;
      position: relative;
      padding-left: 10px;
    }
    .lobby-my-groups-title-main::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 4px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #7c3aed, #6366f1);
    }
    .lobby-my-groups-title-sub {
      font-size: 10px;
      font-weight: 700;
      color: rgba(76, 29, 149, 0.6);
      white-space: nowrap;
    }
    .recent-item-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .recent-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .recent-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.6;
      white-space: nowrap;
    }
    .recent-badge-active {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .recent-badge-inactive {
      background: #fff7ed;
      color: #b45309;
      border: 1px solid #fed7aa;
    }
    .recent-badge-pending {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .recent-enter-btn {
      flex-shrink: 0;
      margin-left: 10px;
      min-width: 74px;
      height: 32px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }
    .recent-enter-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(76, 29, 149, 0.2);
      filter: brightness(1.01);
    }
    .recent-enter-btn:disabled {
      cursor: not-allowed;
      background: #e5e7eb;
      color: #6b7280;
      box-shadow: none;
      transform: none;
      filter: none;
    }

    .lobby-panel-title {
      width: 100%;
      margin: 0 0 8px;
      padding: 13px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
      line-height: 1.2;
    }

    .lobby-help {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
    }

    .lobby-help details {
      margin-bottom: 10px;
      padding: 11px 13px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(30, 27, 75, 0.08);
    }

    .lobby-help summary {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .faq-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
    }

    .faq-list>li {
      margin: 0 0 6px;
    }

    .faq-title {
      display: block;
      font-weight: 700;
    }

    .faq-sublist {
      margin: 2px 0 0 18px;
      padding: 0;
      list-style: none;
    }

    .faq-sublist li {
      display: block;
      white-space: normal;
    }

    .lobby-version {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.62;
      letter-spacing: 0.02em;
      pointer-events: none;
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
    }

    .global-copyright {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.68;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 30;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }
    .global-copyright-sub {
      display: block;
      font-size: 10px;
      opacity: 0.92;
    }

    .overlay-copyright {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.7;
      letter-spacing: 0.02em;
      pointer-events: none;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }
    .overlay-copyright-sub {
      display: block;
      font-size: 10px;
      opacity: 0.92;
    }

    body.lobby-mode .lobby-version {
      position: static;
      left: auto;
      bottom: auto;
      transform: none;
      margin-top: auto;
      white-space: normal;
      line-height: 1.45;
    }

    body.lobby-mode .global-copyright {
      display: none !important;
    }

    .lobby-copyright-inline {
      display: block;
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* === Schedule Section === */
    .schedule-section {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 16px 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .schedule-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .schedule-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .schedule-row:last-child {
      margin-bottom: 0;
    }

    .schedule-label {
      font-size: 11px;
      font-weight: 700;
      width: 34px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .schedule-label-practice {
      color: var(--practice);
    }

    .schedule-label-match {
      color: var(--match);
    }

    .schedule-chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1.1;
    }

    .schedule-chip:active {
      transform: scale(0.92);
    }

    .schedule-chip .chip-dow {
      font-size: 9px;
      font-weight: 400;
      opacity: 0.7;
    }

    .chip-practice {
      background: #eff6ff;
      color: var(--practice);
      border-color: #bfdbfe;
    }

    .chip-practice.chip-today {
      background: var(--practice);
      color: #fff;
      border-color: var(--practice);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .chip-match {
      background: #fdf2f8;
      color: var(--match);
      border-color: #fbcfe8;
    }

    .chip-match.chip-today {
      background: var(--match);
      color: #fff;
      border-color: var(--match);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.3);
    }

    .chip-past-deadline {
      background: #f3f4f6 !important;
      color: #9ca3af !important;
      border-color: #d1d5db !important;
      box-shadow: none !important;
    }

    .chip-selected {
      outline: 3px solid var(--primary);
      outline-offset: 1px;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.18);
    }

    .schedule-empty {
      font-size: 12px;
      color: var(--text-light);
      padding: 4px 0;
    }

    /* === Context Bar (selected date info) === */
    .context-bar {
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 0;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .context-date {
      font-size: 18px;
      font-weight: 700;
    }

    .context-mode {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .context-mode-practice {
      background: #dbeafe;
      color: var(--practice);
    }

    .context-mode-match {
      background: #fce7f3;
      color: var(--match);
    }

    .context-deadline {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-light);
    }

    .context-deadline.urgent {
      color: var(--absent);
      font-weight: 600;
    }
    .context-deadline-meta {
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.1);
      color: #5b21b6;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .context-deadline-meta.warn {
      background: rgba(220, 38, 38, 0.12);
      color: #b91c1c;
    }

    /* === Summary === */
    .summary {
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 13px 22px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      font-size: 13px;
      transition: background 0.4s ease;
      flex-shrink: 0;
    }

    .summary.flash {
      background: #ede9fe;
    }

    .summary span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .summary-filter-btn {
      margin-left: auto;
      border: 1px solid rgba(124, 58, 237, 0.26);
      background: #fff;
      color: #5b21b6;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .14s ease, box-shadow .18s ease;
    }
    .summary-filter-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(76, 29, 149, 0.14);
    }
    .summary-filter-btn.active {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      border-color: transparent;
    }

    .summary .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-present {
      background: var(--present);
    }

    .dot-absent {
      background: var(--absent);
    }

    .dot-late {
      background: var(--late);
    }

    .dot-early {
      background: var(--early);
    }

    .dot-total {
      background: var(--primary);
    }

    .dot-none {
      background: var(--unset);
    }

    /* === Info lists (none / present) === */
    .info-list {
      width: min(1080px, calc(100% - 28px));
      margin: 8px auto 0;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.89);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(30, 27, 75, 0.08);
      font-size: 12px;
      color: var(--text-light);
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .info-list strong {
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }

    .copy-btn {
      margin-left: auto;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 11px;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      transition: transform .16s ease, box-shadow .2s ease, background .2s ease;
    }

    .copy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 27, 75, 0.12);
    }

    .copy-btn:active {
      background: var(--bg);
    }

    /* === Member Cards === */
    main {
      padding: 12px 4px 110px;
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 18px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
    }

    .member-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      border: 1px solid var(--surface-border);
      padding: 14px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 10px 28px rgba(30, 27, 75, 0.11);
      transition: background 0.6s ease;
    }

    .member-card.highlight {
      background: #ede9fe;
    }

    .member-card.locked {
      opacity: 0.45;
      pointer-events: none;
    }

    .member-name {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
      min-width: 0;
    }

    .member-name.self-highlight {
      color: #4c1d95;
      font-weight: 800;
    }

    .self-pill {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: #5b21b6;
      background: #ede9fe;
      border: 1px solid rgba(124, 58, 237, 0.28);
      vertical-align: middle;
    }

    .badge-none {
      font-size: 10px;
      color: var(--text-light);
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1px 7px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .badge-time {
      font-size: 10px;
      font-weight: 600;
      border-radius: 8px;
      padding: 1px 7px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .badge-time-late {
      color: #92400e;
      background: #fef3c7;
    }

    .badge-time-early {
      color: #1e40af;
      background: #dbeafe;
    }

    .status-buttons {
      display: flex;
      gap: 5px;
    }

    .status-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fff;
      font-size: 17px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 27, 75, 0.12);
    }

    .status-btn:active {
      transform: scale(0.92);
    }

    .status-btn[data-status="present"] {
      font-size: 20px;
    }

    .status-btn.active-present {
      border-color: var(--present);
      background: linear-gradient(135deg, #fef9c3, #dcfce7);
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.15);
    }

    .status-btn.active-absent {
      border-color: var(--absent);
      background: #fee2e2;
    }

    .status-btn.active-late {
      border-color: var(--late);
      background: #fef3c7;
    }

    .status-btn.active-early {
      border-color: var(--early);
      background: #dbeafe;
    }

    .status-btn .btn-label {
      font-size: 13px;
      font-weight: 700;
      border: none;
      padding: 0;
      line-height: 1;
    }

    .status-btn.active-late .btn-label,
    .status-btn.active-early .btn-label {
      font-weight: 900;
    }


    .time-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-light);
    }

    .time-row input[type="time"] {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
    }

    .member-meta {
      width: 100%;
      display: flex;
      gap: 12px;
      font-size: 10px;
      color: var(--text-light);
      margin-top: 4px;
      padding-left: 2px;
    }


    .empty-state {
      display: flex;
      justify-content: center;
      padding: 56px 20px;
    }

    .empty-state-card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(124, 58, 237, 0.18);
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(76, 29, 149, 0.14);
      padding: 24px 20px 20px;
      text-align: center;
    }

    .empty-state-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(124, 58, 237, 0.08));
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .empty-state-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.65;
    }

    .empty-state-hint {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.2);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .empty-state-hint:hover {
      background: rgba(124, 58, 237, 0.13);
      box-shadow: 0 8px 20px rgba(76, 29, 149, 0.12);
      transform: translateY(-1px);
    }

    .empty-state-hint:active {
      transform: translateY(0);
    }

    /* === Modal === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.44);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      border: 1px solid var(--surface-border);
      padding: 24px;
      width: min(90vw, 360px);
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.22);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .modal input[type="text"]:focus {
      border-color: var(--primary-light);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-cancel {
      background: var(--border);
      color: var(--text);
    }

    .btn-confirm {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      box-shadow: 0 10px 20px rgba(76, 29, 149, 0.22);
    }

    .btn-cancel,
    .btn-confirm {
      transition: transform .16s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-cancel:hover,
    .btn-confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.16);
    }

    .btn-confirm:active {
      filter: brightness(0.98);
    }

    .modal-close-x {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-light);
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-close-x:hover {
      background: var(--bg);
    }

    .modal-close-x:active {
      background: var(--border);
    }

    .deadline-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .deadline-field label {
      width: 40px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .deadline-field input[type="number"] {
      width: 52px;
      padding: 6px 4px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    .deadline-field input[type="number"]:focus {
      border-color: var(--primary-light);
    }

    .deadline-field select {
      padding: 6px 4px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .deadline-field select:focus {
      border-color: var(--primary-light);
    }

    /* === Calendar Edit Modal === */
    .cal-edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: var(--bg);
      flex-direction: column;
    }

    .cal-edit-overlay.show {
      display: flex;
    }

    .cal-edit-header {
      background: var(--primary);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-edit-header h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .cal-edit-body {
      overflow-y: auto;
      padding: 16px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 420px;
      margin: 0 auto;
    }

    .cal-dow {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      padding: 4px 0;
    }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      color: var(--text);
      background: var(--card);
    }

    .cal-cell:active {
      transform: scale(0.92);
    }

    .cal-cell.cal-empty {
      background: transparent;
      cursor: default;
    }

    .cal-cell.cal-practice {
      background: #dbeafe;
      color: var(--practice);
      border-color: var(--practice);
    }

    .cal-cell.cal-match {
      background: #fce7f3;
      color: var(--match);
      border-color: var(--match);
    }

    .cal-cell.cal-selected-day {
      outline: 3px solid var(--primary);
      outline-offset: 1px;
    }

    .cal-cell.cal-today-mark {
      font-weight: 900;
      text-decoration: underline;
    }

    .picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .picker-overlay.show {
      display: flex;
    }

    .picker-modal {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      width: min(90vw, 360px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .picker-header h3 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
      text-align: center;
    }

    .picker-nav {
      background: none;
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .picker-nav:active {
      background: var(--bg);
    }

    .cal-legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 16px 0 8px;
      font-size: 12px;
      color: var(--text-light);
    }

    .cal-legend span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .cal-legend .leg-practice::before {
      background: var(--practice);
    }

    .cal-legend .leg-match::before {
      background: var(--match);
    }

    .cal-edit-actions {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .cal-edit-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .cal-edit-actions .btn-cancel {
      background: var(--bg);
      color: var(--text);
    }

    .cal-edit-actions .btn-confirm {
      background: var(--primary);
      color: #fff;
    }

    .schedule-edit-btn {
      margin-left: auto;
      width: 34px;
      height: 34px;
      font-size: 14px;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      line-height: 1;
      white-space: nowrap;
    }

    .schedule-edit-btn .schedule-edit-icon {
      font-size: 20px;
      line-height: 1;
    }

    .schedule-edit-btn:active {
      opacity: 0.6;
    }

    .schedule-title {
      display: flex;
      align-items: center;
    }

    /* === Member Settings Modal === */
    .ms-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .ms-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .ms-name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
    }

    .ms-name.current-user {
      color: #4c1d95;
      font-weight: 800;
    }

    .admin-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #4c1d95;
      background: linear-gradient(135deg, #f3e8ff, #ede9fe);
      border: 1px solid rgba(124, 58, 237, 0.32);
      box-shadow: 0 4px 10px rgba(76, 29, 149, 0.14);
      vertical-align: middle;
      white-space: nowrap;
    }

    .admin-role-badge::before {
      content: "★";
      font-size: 9px;
      line-height: 1;
      color: #7c3aed;
    }

    .ms-delete {
      background: transparent;
      border: none;
      color: var(--absent);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .pin-reveal-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(124, 58, 237, 0.28);
      border-radius: 10px;
      background: linear-gradient(180deg, #fff, #f5f3ff);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .ms-item {
      align-items: flex-start;
      flex-direction: column;
      gap: 6px;
    }

    .ms-item-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ms-meta {
      width: 100%;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ms-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      letter-spacing: 0.01em;
    }

    .ms-chip-pending {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    .ms-chip-inactive {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .ms-action-btn {
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid rgba(124, 58, 237, 0.28);
      background: #fff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .ms-action-btn.warn {
      border-color: #f59e0b;
      color: #b45309;
      background: #fffdf5;
    }

    .ms-action-btn.danger {
      border-color: #fca5a5;
      color: #b91c1c;
      background: #fff5f5;
    }

    input[type="text"],
    input[type="tel"],
    input[type="password"],
    input[type="number"],
    input[type="time"],
    select,
    textarea {
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus,
    input[type="number"]:focus,
    input[type="time"]:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(124, 58, 237, 0.62) !important;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.16);
      outline: none;
      background: #fff;
    }

    @media (max-width: 768px) {

      header,
      .schedule-section,
      .context-bar,
      .summary,
      .info-list,
      main {
        width: calc(100% - 20px);
      }

      header {
        margin: 10px auto 8px;
        border-radius: 18px;
        padding: 8px 14px 7px;
      }

      .schedule-section,
      .context-bar,
      .summary,
      .info-list {
        padding-left: 14px;
        padding-right: 14px;
        border-radius: 14px;
      }

      main {
        margin-top: 8px;
        padding-bottom: 96px;
      }

      .lobby-card,
      .lobby-help,
      .lobby-subcopy {
        max-width: 100%;
      }

      .lobby-logo {
        font-size: 34px;
      }

      #dateInput {
        min-width: 152px;
        width: 152px;
      }

      .date-row .today-badge {
        margin-left: 6px;
      }

      .date-row {
        margin-top: -7px;
      }

      #loginStatus {
        max-width: 160px;
        font-size: 11px !important;
      }

      .title-edit-row {
        width: min(22ch, calc(100vw - 200px));
      }
    }

    /* === UI Polish Pass === */
    .lobby-card {
      border-radius: 20px;
      border-color: rgba(124, 58, 237, 0.2);
      box-shadow: 0 16px 34px rgba(30, 27, 75, 0.12);
    }

    .lobby-help details {
      border-radius: 16px;
      border-color: rgba(124, 58, 237, 0.14);
    }

    .lobby-help summary {
      letter-spacing: 0.01em;
    }

    .schedule-section,
    .context-bar,
    .summary,
    .info-list {
      border-color: rgba(124, 58, 237, 0.14);
      box-shadow: 0 12px 30px rgba(30, 27, 75, 0.11);
    }

    .schedule-section {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
    }

    .schedule-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: #312e81;
    }

    .context-date {
      color: #1f2152;
      letter-spacing: 0.01em;
    }

    .summary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
    }

    .summary .dot {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }

    .member-card {
      border-color: rgba(124, 58, 237, 0.12);
      box-shadow: 0 14px 28px rgba(30, 27, 75, 0.1);
      transition: transform .16s ease, box-shadow .2s ease, background .4s ease;
    }

    .member-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(30, 27, 75, 0.14);
      border-color: rgba(124, 58, 237, 0.24);
    }

    .status-btn {
      border-width: 1.5px;
      border-color: rgba(148, 163, 184, 0.48);
    }

    .status-btn:not(.active-present):not(.active-absent):not(.active-late):not(.active-early) {
      background: linear-gradient(180deg, #fff, #f8fafc);
    }

    .modal {
      border-radius: 20px;
      border-color: rgba(124, 58, 237, 0.18);
      box-shadow: 0 24px 54px rgba(15, 23, 42, 0.24);
    }

    .btn-cancel {
      background: linear-gradient(180deg, #ffffff, #f3f4f6);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #334155;
      font-weight: 700;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    #changeAdminBtn {
      border-color: rgba(245, 158, 11, 0.6) !important;
      color: #92400e !important;
      background: linear-gradient(180deg, #fffdf7, #fff) !important;
      border-radius: 11px !important;
      box-shadow: 0 8px 18px rgba(245, 158, 11, 0.15) !important;
    }

    #changeAdminConfirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      box-shadow: 0 10px 18px rgba(217, 119, 6, 0.25) !important;
      border-radius: 10px !important;
    }

    #changeAdminCancel {
      background: linear-gradient(180deg, #ffffff, #f5f3ff) !important;
      border: 1px solid rgba(124, 58, 237, 0.28) !important;
      color: var(--primary) !important;
      box-shadow: 0 6px 14px rgba(76, 29, 149, 0.1) !important;
    }

    #openRecoverPanelBtn {
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.12), rgba(124, 58, 237, 0.07)) !important;
      border-color: rgba(124, 58, 237, 0.34) !important;
    }

    #invitePopup .modal,
    #appSettingsModal .modal {
      background: linear-gradient(180deg, #fcfcff, #f8f7ff);
    }

    @media (max-width: 768px) {
      .member-card:hover {
        transform: none;
      }

      .schedule-title {
        font-size: 13px;
      }

      .beta-notice {
        font-size: 11px;
        padding: 5px 10px;
      }

      .title-block {
        gap: 4px;
      }

      .group-title-edit-btn {
        font-size: 9px;
        padding: 2px 6px;
        line-height: 1.1;
      }
    }
  </style>
</head>

  <script>

  <header>
    <div class="header-top">

      <button class="modal-close-x" id="settingsCloseX">&times;</button>

      <div class="deadline-field">

  <script>
    const _urlParams = new URL(location.href).searchParams;
    const _teamParam = _urlParams.get("team");
    const _inviteNameParam = (_urlParams.get("name") || '').trim();
    const _pendingInviteTeam = (_urlParams.get("inviteTeam") || '').trim();
    const _pendingInviteName = (_urlParams.get("inviteName") || '').trim();
    const _pendingAdminTeamParam = (_urlParams.get("pendingAdminTeam") || '').trim().toLowerCase();
    const _pendingAdminNameParam = (_urlParams.get("pendingAdminName") || '').trim();
    const _pendingAdminGroupParam = (_urlParams.get("pendingAdminGroup") || '').trim();
    const RECENT_KEY = 'volley-recent-teams';
    const INVITE_KEY = 'volley-invite-link';
    const ADMIN_RECOVERY_SUFFIX = 'volley-admin-recovery-code';
    const OWNER_ID_SUFFIX = 'volley-owner-id';
    const SELF_PIN_SUFFIX = 'volley-self-pin';
    const PENDING_ADMIN_NAME_SUFFIX = 'volley-pending-admin-name';
    const PENDING_ADMIN_SET_AT_SUFFIX = 'volley-pending-admin-set-at';
    const PENDING_ADMIN_ACCEPTED_KEY_PREFIX = 'volley-pending-admin-accepted:';
    const PENDING_ADMIN_REQUESTS_KEY = 'volley-pending-admin-requests';
    const SYNC_API = '/api/sync';
    const CREATED_TEAMS_KEY = 'volley-created-teams';
    const DELETED_TEAMS_KEY = 'volley-deleted-teams';
    const MAX_CREATED_TEAMS_PER_DEVICE = 3;
    const RECOVERY_GUARD_KEY = 'volley-recovery-guard';
    const RECOVERY_MAX_ATTEMPTS = 5;
    const RECOVERY_WINDOW_MS = 15 * 60 * 1000;
    const RECOVERY_LOCK_MS = 15 * 60 * 1000;
    const SHOW_DETAILED_ERRORS = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const CANONICAL_ORIGIN = 'https://club-attendance.smoolinq.workers.dev';
    const IS_LINE_INAPP_BROWSER = /Line\//i.test(navigator.userAgent || '');

    if (location.hostname !== 'club-attendance.smoolinq.workers.dev') {
      location.replace(CANONICAL_ORIGIN + location.pathname + location.search + location.hash);
      throw new Error('redirect-to-canonical');
    }

    function safeSessionGet(key) {
      try { return sessionStorage.getItem(key); } catch { return null; }
    }
    function safeSessionSet(key, value) {
      try { sessionStorage.setItem(key, value); } catch { }
    }
    function safeSessionRemove(key) {
      try { sessionStorage.removeItem(key); } catch { }
    }
    function readPendingAdminRequests() {
      try {
        const raw = safeSessionGet(PENDING_ADMIN_REQUESTS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch { return []; }
    }
    function writePendingAdminRequests(list) {
      try {
        const next = Array.isArray(list) ? list : [];
        safeSessionSet(PENDING_ADMIN_REQUESTS_KEY, JSON.stringify(next.slice(0, 20)));
      } catch { }
    }
    function upsertPendingAdminRequest(req) {
      const teamId = String(req?.teamId || '').trim().toLowerCase();
      const memberName = String(req?.memberName || '').trim();
      if (!teamId || !memberName) return;
      const next = readPendingAdminRequests().filter(x => !(x && x.teamId === teamId && x.memberName === memberName));
      next.unshift({
        teamId,
        memberName,
        teamName: String(req?.teamName || '').trim() || teamId,
        setAt: String(req?.setAt || '').trim() || new Date().toISOString()
      });
      writePendingAdminRequests(next);
    }
    function removePendingAdminRequest(teamId, memberName) {
      const t = String(teamId || '').trim().toLowerCase();
      const n = String(memberName || '').trim();
      if (!t || !n) return;
      const next = readPendingAdminRequests().filter(x => !(x && x.teamId === t && x.memberName === n));
      writePendingAdminRequests(next);
    }
    function removePendingAdminRequestsByTeam(teamId) {
      const t = String(teamId || '').trim().toLowerCase();
      if (!t) return;
      const next = readPendingAdminRequests().filter(x => !(x && x.teamId === t));
      writePendingAdminRequests(next);
    }
    function listPendingAdminTeamsFromLocal() {
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = String(localStorage.key(i) || '');
          const suffix = ':' + PENDING_ADMIN_NAME_SUFFIX;
          if (!key.endsWith(suffix)) continue;
          const teamId = key.slice(0, -suffix.length).trim().toLowerCase();
          if (!teamId) continue;
          const memberName = String(localStorage.getItem(key) || '').trim();
          if (!memberName) continue;
          const teamName = String(localStorage.getItem(teamId + ':volley-app-title') || '').trim() || teamId;
          out.push({ teamId, pendingAdminName: memberName, teamName });
        }
      } catch { }
      return out;
    }
    function safeLocalSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch { return false; }
    }
    function safeLocalRemove(key) {
      try { localStorage.removeItem(key); } catch { }
    }
    function getOwnerIdKey(teamId) {
      return String(teamId || '').trim().toLowerCase() + ':' + OWNER_ID_SUFFIX;
    }
    function ensureOwnerId(teamId, candidate) {
      const key = getOwnerIdKey(teamId);
      const incoming = String(candidate || '').trim();
      if (incoming) {
        safeLocalSet(key, incoming);
        return incoming;
      }
      const existing = String(localStorage.getItem(key) || '').trim();
      if (existing) return existing;
      const next = crypto.randomUUID();
      safeLocalSet(key, next);
      return next;
    }
    function readRecoveryGuard() {
      try {
        const raw = JSON.parse(localStorage.getItem(RECOVERY_GUARD_KEY) || '{}');
        return raw && typeof raw === 'object' ? raw : {};
      } catch {
        return {};
      }
    }
    function writeRecoveryGuard(next) {
      safeLocalSet(RECOVERY_GUARD_KEY, JSON.stringify(next || {}));
    }
    function getRecoveryState(teamId) {
      const id = String(teamId || '').trim().toLowerCase();
      const guard = readRecoveryGuard();
      const row = guard[id] || {};
      const now = Date.now();
      const lockUntil = Number(row.lockUntil || 0);
      const locked = lockUntil > now;
      const remainingMs = locked ? lockUntil - now : 0;
      const count = Number(row.count || 0);
      return { guard, id, row, locked, remainingMs, count, now };
    }
    function noteRecoveryFailure(teamId) {
      const st = getRecoveryState(teamId);
      if (!st.id) return { remaining: 0, locked: false, remainingMs: 0 };
      const prevTs = Number(st.row.firstTs || 0);
      const inWindow = prevTs && (st.now - prevTs) < RECOVERY_WINDOW_MS;
      const count = inWindow ? st.count + 1 : 1;
      const firstTs = inWindow ? prevTs : st.now;
      const locked = count >= RECOVERY_MAX_ATTEMPTS;
      st.guard[st.id] = {
        firstTs,
        count: locked ? 0 : count,
        lockUntil: locked ? st.now + RECOVERY_LOCK_MS : 0
      };
      writeRecoveryGuard(st.guard);
      return { remaining: Math.max(0, RECOVERY_MAX_ATTEMPTS - count), locked, remainingMs: locked ? RECOVERY_LOCK_MS : 0 };
    }
    function clearRecoveryFailures(teamId) {
      const st = getRecoveryState(teamId);
      if (!st.id) return;
      if (st.guard[st.id]) {
        delete st.guard[st.id];
        writeRecoveryGuard(st.guard);
      }
    }
    function appendRecoveryAudit(teamId, action, detail) {
      const id = String(teamId || '').trim().toLowerCase();
      if (!id) return;
      const key = id + ':volley-security-log';
      try {
        const logs = JSON.parse(localStorage.getItem(key) || '[]');
        logs.unshift({
          at: new Date().toISOString(),
          by: 'recovery-flow',
          action: String(action || ''),
          target: id,
          detail: String(detail || '')
        });
        safeLocalSet(key, JSON.stringify(logs.slice(0, 200)));
      } catch { }
    }

    // Legacy groups may have non-8-char IDs; accept 4-16 alnum for backward compatibility.
    if (_teamParam && !/^[a-z0-9]{4,16}$/i.test(String(_teamParam).trim())) {
      location.href = location.pathname;
      throw new Error('invalid team param');
    }

    function createSessionId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function generateRecoveryCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 12; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
        if (i === 3 || i === 7) out += '-';
      }
      return out;
    }

    function getShareableAppUrl() {
      const base = CANONICAL_ORIGIN + location.pathname;
      const pendingTeam = (_pendingInviteTeam || '').trim().toLowerCase();
      const pendingName = (_pendingInviteName || '').trim();
      const invite = getInviteData();
      const teamId = pendingTeam || String(invite?.id || '').trim().toLowerCase();
      const teamName = pendingName || String(invite?.name || '').trim();
      if (!teamId) return base;
      const qs = '?inviteTeam=' + encodeURIComponent(teamId) +
        (teamName ? '&inviteName=' + encodeURIComponent(teamName) : '');
      return base + qs;
    }

    function openInExternalBrowser(url) {
      const safeUrl = String(url || '').trim();
      if (!safeUrl) return;
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      if (IS_LINE_INAPP_BROWSER) {
        if (isIOS) {
          // iOS Safari deep link
          const safariUrl = 'x-safari-https://' + safeUrl.replace(/^https?:\/\//i, '');
          location.href = safariUrl;
          setTimeout(() => { location.href = safeUrl; }, 1000);
          return;
        }
        if (isAndroid) {
          // Android Chrome intent deep link
          try {
            const u = new URL(safeUrl);
            const intentUrl =
              'intent://' + u.host + u.pathname + u.search + u.hash +
              '#Intent;scheme=' + u.protocol.replace(':', '') + ';package=com.android.chrome;end';
            location.href = intentUrl;
            setTimeout(() => { location.href = safeUrl; }, 1000);
            return;
          } catch { }
        }
        // Fallback: open inside current webview
        location.href = safeUrl;
        return;
      }
      location.href = safeUrl;
    }

    function getRecentTeams() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
    }
    function getDeletedTeams() {
      try { return JSON.parse(localStorage.getItem(DELETED_TEAMS_KEY)) || []; } catch { return []; }
    }
    function isDeletedPayload(data) {
      return !!(data && (data.deleted === true || data.deletedAt));
    }
    function normalizeMemberRecord(member) {
      if (!member) return null;
      if (typeof member === 'string') return { name: member, state: 'active' };
      const out = { ...member };
      if (out.role != null) delete out.role;
      out.name = String(out.name || '').trim();
      out.pin = String(out.pin || '').trim();
      if (out.state !== 'inactive') out.state = 'active';
      if (out.pendingRemovalAt && typeof out.pendingRemovalAt !== 'string') out.pendingRemovalAt = '';
      if (out.pendingRemovalReason && typeof out.pendingRemovalReason !== 'string') out.pendingRemovalReason = '';
      if (out.pendingRemovalBy && typeof out.pendingRemovalBy !== 'string') out.pendingRemovalBy = '';
      if (out.inactivatedAt && typeof out.inactivatedAt !== 'string') out.inactivatedAt = '';
      return out;
    }
    function findMemberByName(members, name) {
      const key = String(name || '').trim();
      return (members || []).find(m => m && String(m.name || '').trim() === key) || null;
    }
    function getInviteData() {
      try {
        const data = JSON.parse(localStorage.getItem(INVITE_KEY) || 'null');
        if (!data || !data.id) return null;
        return data;
      } catch {
        return null;
      }
    }
    function setInviteData(data) {
      if (!data || !data.id) return;
      localStorage.setItem(INVITE_KEY, JSON.stringify({
        id: String(data.id || '').trim().toLowerCase(),
        name: data.name || null,
        pending: data.pending !== false
      }));
    }
    function clearInviteForTeam(teamId) {
      const invite = getInviteData();
      if (!invite || !invite.id) return;
      if (!teamId || invite.id === String(teamId || '').trim().toLowerCase()) {
        safeLocalRemove(INVITE_KEY);
      }
    }
    function hasTeamLocalState(teamId) {
      const id = String(teamId || '').trim().toLowerCase();
      if (!id) return false;
      const p = id + ':';
      const loginType = (localStorage.getItem(p + 'volley-login-type') || '').trim();
      const adminName = (localStorage.getItem(p + 'volley-admin-name') || '').trim();
      const membersRaw = (localStorage.getItem(p + 'volley-members') || '').trim();
      if (loginType) return true;
      if (adminName) return true;
      if (membersRaw) return true;
      return false;
    }

    function getCreatedTeams() {
      try {
        const raw = JSON.parse(localStorage.getItem(CREATED_TEAMS_KEY)) || [];
        const clean = raw
          .filter(id => typeof id === 'string')
          .map(id => id.trim().toLowerCase())
          .filter(Boolean);
        return Array.from(new Set(clean));
      } catch {
        return [];
      }
    }

    function setCreatedTeams(teamIds) {
      const clean = Array.from(new Set((teamIds || [])
        .filter(id => typeof id === 'string')
        .map(id => id.trim().toLowerCase())
        .filter(Boolean)));
      localStorage.setItem(CREATED_TEAMS_KEY, JSON.stringify(clean));
    }

    function pruneCreatedTeams() {
      const deleted = (() => {
        try { return JSON.parse(localStorage.getItem('volley-deleted-teams')) || []; } catch { return []; }
      })();
      const next = getCreatedTeams().filter(teamId => {

      function collectPendingAdminRequests() {
        const fromLocal = listPendingAdminTeamsFromLocal();
        const recent = getRecent();
        const fromRecent = (Array.isArray(recent) ? recent : [])
          .map((t) => {
            const teamId = String(t?.id || '').trim().toLowerCase();
            if (!teamId) return null;
            const pendingAdminName = String(localStorage.getItem(teamId + ':' + PENDING_ADMIN_NAME_SUFFIX) || '').trim();
            if (!pendingAdminName) return null;
            const teamName = String((t && t.name) || localStorage.getItem(teamId + ':volley-app-title') || '').trim() || teamId;
            return { teamId, teamName, pendingAdminName };
          })
          .filter(Boolean);
        const fromSession = readPendingAdminRequests()
          .map((r) => {
            const teamId = String(r?.teamId || '').trim().toLowerCase();
            const pendingAdminName = String(r?.memberName || '').trim();
            if (!teamId || !pendingAdminName) return null;
            const teamName = String(r?.teamName || localStorage.getItem(teamId + ':volley-app-title') || '').trim() || teamId;
            const currentPending = String(localStorage.getItem(teamId + ':' + PENDING_ADMIN_NAME_SUFFIX) || '').trim();
            if (currentPending && currentPending !== pendingAdminName) return null;
            return { teamId, teamName, pendingAdminName };
          })
          .filter(Boolean);
        const merged = [...fromLocal, ...fromSession, ...fromRecent];
        const map = new Map();
        merged.forEach((r) => {
          const key = r.teamId + '::' + r.pendingAdminName;
          if (!map.has(key)) map.set(key, r);
        });
        return Array.from(map.values());
      }
      function escapePendingText(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderPendingAdminCards() {
        if (!pendingAdminCardArea) return;
        pendingAdminCardArea.innerHTML = '';
        if (IS_LINE_INAPP_BROWSER) return;
        const requests = collectPendingAdminRequests();
        if (!requests.length) return;

          card.style.cssText = 'width:100%;margin-bottom:14px;padding:14px 16px;background:var(--card);border:2px solid #f59e0b;border-radius:16px;text-align:center';

            '<button type="button" class="pending-admin-accept-btn" data-team="' + escapePendingText(req.teamId) + '" data-member="' + escapePendingText(req.pendingAdminName) + '" data-group="' + escapePendingText(req.teamName) + '" style="padding:10px 18px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer">申請を受諾して再ログイン</button>';
          pendingAdminCardArea.appendChild(card);
        });
      }
      let _pendingAutoOpenedThisLoad = false;
      function autoOpenPendingAdminQuickFlowIfNeeded() {
        if (_pendingAutoOpenedThisLoad) return;
        const requests = collectPendingAdminRequests();
        if (!requests.length) return;
        const target = requests.find(r => r && r.teamId && r.pendingAdminName);
        if (!target) return;
        _pendingAutoOpenedThisLoad = true;
        setTimeout(() => {
          openPendingAdminQuickFlow(target.teamId, target.pendingAdminName, target.teamName || target.teamId);
        }, 50);
      }
      async function refreshPendingAdminRequestsFromServer() {
        const recent = getRecent();
        let recentChanged = false;
        const candidates = (Array.isArray(recent) ? recent : [])
          .map((t) => ({
            teamId: String(t?.id || '').trim().toLowerCase(),
            teamName: String(t?.name || '').trim(),
            viewerName: String(t?.user || '').trim()
          }))
          .filter((t) => t.teamId)
          .slice(0, 12);
        if (!candidates.length) {
          renderPendingAdminCards();
          return;
        }
        await Promise.all(candidates.map(async (c) => {
          try {
            const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(c.teamId));
            if (!res.ok) return;
            const data = await res.json();
            if (isDeletedPayload(data)) return;
            if (c.viewerName && Array.isArray(data?.members)) {
              const stillMember = data.members.some((m) => {
                if (!m) return false;
                const memberName = typeof m === 'string' ? m : String(m.name || '').trim();
                return memberName === c.viewerName;
              });
              if (!stillMember) {
                try {
                  const recentNow = getRecent();
                  const nextRecent = (Array.isArray(recentNow) ? recentNow : [])
                    .filter((t) => !(t && t.id === c.teamId && String(t.user || '').trim() === c.viewerName));
                  localStorage.setItem(RECENT_KEY, JSON.stringify(nextRecent.map(({ id, name, user, lastVisited }) => ({ id, name, user, lastVisited }))));
                  if (Array.isArray(serverRecentTeams)) serverRecentTeams = nextRecent;
                  recentChanged = true;
                } catch { }
                removePendingAdminRequestsByTeam(c.teamId);
                safeLocalRemove(c.teamId + ':' + PENDING_ADMIN_NAME_SUFFIX);
                safeLocalRemove(c.teamId + ':' + PENDING_ADMIN_SET_AT_SUFFIX);
                await removeMyGroupRecord(c.teamId);
                return;
              }
            }
            const pendingAdminName = String(data?.pendingAdminName || '').trim();
            const pendingAdminSetAt = String(data?.pendingAdminSetAt || '').trim();
            const teamName = String(data?.title || c.teamName || '').trim() || c.teamId;
            if (pendingAdminName) {
              upsertPendingAdminRequest({
                teamId: c.teamId,
                memberName: pendingAdminName,
                teamName,
                setAt: pendingAdminSetAt
              });
              safeLocalSet(c.teamId + ':' + PENDING_ADMIN_NAME_SUFFIX, pendingAdminName);
              if (pendingAdminSetAt) safeLocalSet(c.teamId + ':' + PENDING_ADMIN_SET_AT_SUFFIX, pendingAdminSetAt);
            } else {
              removePendingAdminRequestsByTeam(c.teamId);
              safeLocalRemove(c.teamId + ':' + PENDING_ADMIN_NAME_SUFFIX);
              safeLocalRemove(c.teamId + ':' + PENDING_ADMIN_SET_AT_SUFFIX);
            }
          } catch { }
        }));
        renderPendingAdminCards();
        if (recentChanged) renderRecentList();
      }

      async function sweepMissingRecentTeams() {
        if (_missingRecentSweepRunning) return;
        _missingRecentSweepRunning = true;
        try {
          const recentNow = getRecent();
          if (!Array.isArray(recentNow) || !recentNow.length) return;
          const next = [];
          let changed = false;
          for (const t of recentNow.slice(0, 20)) {
            const id = String(t?.id || '').trim().toLowerCase();
            if (!id) { changed = true; continue; }
            try {
              const res = await fetch(SYNC_API + '?team=' + encodeURIComponent(id));
              if (res.status === 404) {
                changed = true;
                markTeamDeletedLocally(id);
                removePendingAdminRequestsByTeam(id);
                safeLocalRemove(id + ':' + PENDING_ADMIN_NAME_SUFFIX);
                safeLocalRemove(id + ':' + PENDING_ADMIN_SET_AT_SUFFIX);
                await removeMyGroupRecord(id);
                continue;
              }
            } catch {}
            next.push(t);
          }
          if (!changed) return;
          const compact = next.map(({ id, name, user, lastVisited, status }) => ({ id, name, user, lastVisited, status }));
          if (Array.isArray(serverRecentTeams)) serverRecentTeams = compact;
          localStorage.setItem(RECENT_KEY, JSON.stringify(compact.map(({ id, name, user, lastVisited }) => ({ id, name, user, lastVisited }))));
          renderRecentList();
        } finally {
          _missingRecentSweepRunning = false;

        const errEl = document.getElementById('lobbyCreateError');
        const groupName = document.getElementById('lobbyGroupName').value.trim();

        const adminPw = document.getElementById('lobbyAdminPw').value;
        if (!groupName) { errEl.textContent = 'グループ名を入力してください'; errEl.style.display = ''; document.getElementById('lobbyGroupName').focus(); return; }
        if (!adminName) { errEl.textContent = '管理者名を入力してください'; errEl.style.display = ''; document.getElementById('lobbyAdminName').focus(); return; }

        if (!createAgreeCheckbox || !createAgreeCheckbox.checked) {

          errEl.style.display = '';

        }

        if (createdTeams.length >= MAX_CREATED_TEAMS_PER_DEVICE) {
          errEl.textContent = 'この端末で作成できるグループは' + MAX_CREATED_TEAMS_PER_DEVICE + '件までです';
          errEl.style.display = '';

          return;
        }
        if (!(await lobbyConfirm('以下の内容で作成します。\n\nグループ名: ' + groupName + '\n管理者名: ' + adminName + '\nパスワード: ' + adminPw + '\n\nよろしいですか？'))) return;
        errEl.style.display = 'none';
        const recoveryCode = generateRecoveryCode();
        let teamId = '';
        let t = '';
        let ownerId = '';
        let createRes = null;
        let createReason = '';
        for (let attempt = 0; attempt < 3; attempt++) {
          teamId = generateTeamId();
          t = teamId + ':';
          ownerId = ensureOwnerId(teamId);
          createReason = '';
          try {
            createRes = await fetch(`${SYNC_API}?team=${encodeURIComponent(teamId)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-recovery-code": recoveryCode },
              credentials: "include",
              body: JSON.stringify({
                title: groupName,
                members: [{ name: adminName, pin: adminPw, state: 'active' }],
                schedule: [],
                deadline: undefined,
                adminName,
                adminPw,
                ownerId,
                pendingAdminName: '',
                pendingAdminSetAt: '',
                agree_terms_privacy: '1',
                recoveryCode,
                loginSession: {
                  id: createSessionId(),
                  type: 'admin',
                  editor: adminName,
                  updatedAt: new Date().toISOString()
                },
                attendancePractice: {},
                attendanceMatch: {}
              })
            });
          } catch {
            createRes = null;
          }
          if (createRes && createRes.ok) break;
          let code = '';
          if (createRes) {
            try {
              const e = await createRes.json();
              code = String((e && (e.error || e.code)) || '').trim();
            } catch { code = ''; }
            createReason = code ? ('（' + code + '）') : ('（HTTP ' + createRes.status + '）');
            const retryable =
              createRes.status === 403 ||
              createRes.status === 404 ||
              createRes.status === 409 ||
              code === 'TEAM_ID_ALREADY_EXISTS' ||
              code === 'RECOVERY_CODE_MISMATCH' ||
              code === 'RECOVERY_NOT_CONFIGURED' ||
              code === 'NOT_FOUND';
            if (!retryable || attempt === 2) {
              errEl.textContent = 'グループ作成の保存に失敗しました' + createReason;
              errEl.style.display = '';
              return;
            }
          } else if (attempt === 2) {
            errEl.textContent = 'グループ作成の通信に失敗しました。もう一度お試しください';
            errEl.style.display = '';
            return;
          }
        }
        if (!createRes || !createRes.ok) {
          errEl.textContent = 'グループ作成の保存に失敗しました' + createReason;
          errEl.style.display = '';
          return;
        }
        const acknowledged = await showRecoveryCodeModal(recoveryCode);
        if (!acknowledged) {
          try {
            const serverDeletePayload = {
              deleted: true,
              deletedAt: new Date().toISOString()
            };
            const serverDeleteRes = await fetch(SYNC_API + '?team=' + encodeURIComponent(teamId), {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-recovery-code': recoveryCode },
              body: JSON.stringify(serverDeletePayload)
            });
            if (!serverDeleteRes.ok) {
              errEl.textContent = '作成の取り消しに失敗しました。通信状態を確認して再度お試しください（グループID: ' + teamId + '）';
              errEl.style.display = '';
              return;
            }
          } catch {
            errEl.textContent = '作成の取り消しに失敗しました。通信状態を確認して再度お試しください（グループID: ' + teamId + '）';
            errEl.style.display = '';
            return;
          }
          localStorage.removeItem(t + OWNER_ID_SUFFIX);
          errEl.textContent = '作成を取りやめました';
          errEl.style.display = '';
          return;
        }
        // Set up localStorage for the new team
        localStorage.setItem(t + 'volley-app-title', groupName);
        localStorage.setItem(t + 'volley-admin-pw', adminPw);
        localStorage.setItem(t + 'volley-admin-name', adminName);
        localStorage.setItem(t + OWNER_ID_SUFFIX, ownerId);
        localStorage.removeItem(t + PENDING_ADMIN_NAME_SUFFIX);
        localStorage.removeItem(t + PENDING_ADMIN_SET_AT_SUFFIX);

        localStorage.setItem(t + 'volley-login-type', 'admin');
        localStorage.setItem(t + 'volley-editor', adminName);
        localStorage.setItem(t + 'volley-login-session', JSON.stringify({
          id: createSessionId(),
          type: 'admin',
          editor: adminName,
          updatedAt: new Date().toISOString()
        }));
        localStorage.setItem(t + 'volley-members', JSON.stringify([{ name: adminName, pin: adminPw, state: 'active' }]));
        localStorage.setItem(t + 'volley-schedule', '[]');
        // Record to recent teams with group name
        const RECENT_KEY = 'volley-recent-teams';
        let recent = []; try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { }
        recent.unshift({ id: teamId, name: groupName, user: adminName, lastVisited: new Date().toISOString() });
        localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
        setCreatedTeams([teamId, ...createdTeams]);
        await upsertMyGroupRecord(teamId, {

          aliasName: adminName,
          role: 'admin',
          status: 'active'
        });
        renderCreateLimitHint();
        location.href = '?team=' + encodeURIComponent(teamId);

        pinInput?.focus();
      }
