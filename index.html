<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="出欠ちゃん">
  <meta property="og:description" content="部活などの練習、試合の出欠をかんたん共有。招待リンクですぐ使えます。">
  <meta property="og:type" content="website">
  <title>出欠ちゃん</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    :root {
      --primary: #5b21b6;
      --primary-light: #7c3aed;
      --bg: #eef0ff;
      --card: #ffffff;
      --text: #1e1b4b;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --surface-border: rgba(148, 163, 184, 0.22);
      --surface-glass: rgba(255, 255, 255, 0.9);
      --shadow-soft: 0 12px 36px rgba(30, 27, 75, 0.12);
      --shadow-card: 0 14px 32px rgba(76, 29, 149, 0.12);
      --present: #16a34a;
      --absent: #dc2626;
      --late: #f59e0b;
      --early: #3b82f6;
      --unset: #d1d5db;
      --practice: #2563eb;
      --match: #db2777;
    }

    @keyframes softPulse {

      0%,
      100% {
        opacity: 0.18;
        transform: translateY(0);
      }

      50% {
        opacity: 0.32;
        transform: translateY(-2px);
      }
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes badgePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(124, 58, 237, 0.08);
      }
    }

    @keyframes sheenSlide {
      0% {
        transform: translateX(-140%) skewX(-22deg);
        opacity: 0;
      }

      30% {
        opacity: 0.22;
      }

      100% {
        transform: translateX(180%) skewX(-22deg);
        opacity: 0;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background:
        radial-gradient(1200px 540px at 16% -10%, rgba(129, 140, 248, 0.34), transparent 62%),
        radial-gradient(880px 460px at 92% 8%, rgba(168, 85, 247, 0.26), transparent 66%),
        radial-gradient(760px 460px at 48% 112%, rgba(129, 140, 248, 0.2), transparent 68%),
        linear-gradient(160deg, #e9edff 0%, #f3efff 44%, #f9f7ff 100%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: -2;
      background:
        radial-gradient(380px 260px at 22% 16%, rgba(255, 255, 255, 0.62), transparent 72%),
        radial-gradient(420px 300px at 80% 24%, rgba(255, 255, 255, 0.34), transparent 76%);
    }

    body::after {
      z-index: -1;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.07));
    }

    /* === Header === */
    header {
      width: min(1080px, calc(100% - 28px));
      margin: 14px auto 10px;
      background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 56%, #6d28d9 100%);
      color: #fff;
      padding: 10px 20px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 16px 34px rgba(76, 29, 149, 0.28);
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: -35% -20% auto;
      height: 64%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0));
      pointer-events: none;
      animation: softPulse 6s ease-in-out infinite;
    }

    .beta-notice {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto 10px;
      padding: 5px 12px;
      border-radius: 10px;
      border: 1px solid rgba(124, 58, 237, 0.16);
      background: rgba(255, 255, 255, 0.78);
      color: rgba(49, 46, 129, 0.82);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
      flex-shrink: 0;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .header-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      margin-bottom: 2px;
      position: relative;
    }

    .title-block {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .title-block h1 {
      margin: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-top>.title-block {
      min-width: 0;
      justify-self: start;
    }

    .title-edit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
      width: min(30ch, calc(100vw - 280px));
      min-width: 0;
    }

    .title-edit-row input {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(124, 58, 237, 0.35);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
    }

    .title-edit-row input:focus {
      border-color: rgba(124, 58, 237, 0.65);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.16);
    }

    .title-edit-row button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-edit-row button:active {
      background: rgba(255, 255, 255, 0.35);
    }

    .group-title-edit-btn {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      transition: background .18s ease, opacity .18s ease;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(30, 27, 75, 0.14);
    }

    .group-title-edit-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .group-title-edit-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.55);
      cursor: not-allowed;
      opacity: 0.85;
    }
    .group-title-edit-btn.admin-only-locked {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.65);
      cursor: not-allowed;
      opacity: 0.9;
    }
    .group-title-edit-btn.admin-only-locked:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .group-title-edit-btn.admin-only-locked::before {
      content: "🔒 ";
      font-size: 9px;
    }

    .settings-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.16);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, background .2s ease, box-shadow .2s ease;
    }

    .settings-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 16px rgba(30, 27, 75, 0.2);
    }

    .settings-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }
    .settings-btn.admin-only-locked {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.75);
      cursor: not-allowed;
      box-shadow: none;
    }
    .settings-btn.admin-only-locked:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }
    .settings-btn.admin-only-locked::after {
      content: "🔒";
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      line-height: 1;
      background: rgba(15, 23, 42, 0.75);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-top: 0;
      margin-top: -10px;
    }

    .date-main {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #loginStatus {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      cursor: default;
    }

    #loginStatus.status-admin {
      color: #fff;
      background: rgba(76, 29, 149, 0.55);
      border-color: rgba(255, 255, 255, 0.35);
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    #loginStatus.status-member {
      color: #1f1147;
      background: #ffffff;
      border-color: rgba(139, 92, 246, 0.45);
      font-weight: 800;
    }

    #loginStatus.status-none {
      color: #f8fafc;
      background: rgba(76, 29, 149, 0.42);
      border-color: rgba(255, 255, 255, 0.3);
      font-weight: 600;
    }

    .date-row button {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, background .2s ease;
    }

    .date-row button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.24);
    }

    .date-row button:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #dateInput {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.36);
      color: #fff;
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 15px;
      flex: 0 0 auto;
      min-width: 170px;
      width: 170px;
      text-align: center;
      text-align-last: center;
      font-variant-numeric: tabular-nums;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    #dateInput:focus {
      border-color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
      outline: none;
    }

    #dateInput::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    #dateInput::-webkit-datetime-edit,
    #dateInput::-webkit-date-and-time-value,
    #dateInput::-webkit-datetime-edit-fields-wrapper {
      text-align: center;
      justify-content: center;
      width: 100%;
    }

    .date-row .today-badge {
      position: absolute;
      left: 100%;
      margin-left: 8px;
      top: 50%;
      transform: translateY(-50%);
      align-self: auto;
    }

    .today-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      background: #ede9fe;
      border-radius: 8px;
      padding: 3px 8px;
      white-space: nowrap;
      animation: badgePulse 2.8s ease-in-out infinite;
    }

    .header-none-count {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .header-none-count .count {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 3px 12px;
    }

    .lobby-logo {
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.02em;
      line-height: 1.05;
      margin-bottom: 2px;
      animation: logoFloat 4.6s ease-in-out infinite;
      transform-origin: center;
    }

    .lobby-subtitle {
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #625f84;
      letter-spacing: 0.08em;
      margin-top: 9px;
      margin-bottom: 8px;
    }

    .lobby-subcopy {
      width: 100%;
      max-width: 420px;
      margin: 0 0 18px;
      font-size: 13px;
      color: #4b5563;
      text-align: center;
      font-weight: 500;
    }

    .lobby-login-btn,
    .lobby-create-btn {
      width: 100%;
      padding: 13px 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
      position: relative;
      overflow: hidden;
    }

    .lobby-login-btn::after,
    .lobby-create-btn::after {
      content: "";
      position: absolute;
      top: -30%;
      left: -140%;
      width: 68%;
      height: 180%;
      background: linear-gradient(110deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.44) 52%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-20deg);
      opacity: 0;
      pointer-events: none;
    }

    .lobby-login-btn::before,
    .lobby-create-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .lobby-login-btn {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
      margin-bottom: 8px;
    }

    .lobby-login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 14px 28px rgba(76, 29, 149, 0.35);
    }

    .lobby-login-btn:hover::after,
    .lobby-create-btn:hover::after {
      opacity: 1;
      animation: sheenSlide .7s ease;
    }

    .lobby-create-btn {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      border: none;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
    }

    .lobby-create-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 14px 28px rgba(76, 29, 149, 0.35);
    }

    .lobby-login-btn:active,
    .lobby-create-btn:active {
      transform: translateY(1px);
      background: linear-gradient(135deg, #4c1d95, #5b21b6);
      box-shadow: 0 4px 12px rgba(30, 27, 75, 0.18);
    }

    .lobby-login-btn:active::after,
    .lobby-create-btn:active::after,
    .lobby-login-btn:focus-visible::after,
    .lobby-create-btn:focus-visible::after {
      opacity: 1;
      left: 160%;
      transition: left .45s ease, opacity .22s ease;
    }

    .lobby-relogin-panel {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: rgba(124, 58, 237, 0.06);
      border: 1px solid rgba(124, 58, 237, 0.22);
      border-radius: 14px;
    }

    #reloginPanel .lobby-login-btn,
    #reloginPanel .lobby-create-btn,
    #createTeamPanel .lobby-login-btn,
    #createTeamPanel .lobby-create-btn {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 6px 14px rgba(76, 29, 149, 0.18);
      filter: none;
    }

    #reloginPanel .lobby-login-btn:hover,
    #reloginPanel .lobby-create-btn:hover,
    #createTeamPanel .lobby-login-btn:hover,
    #createTeamPanel .lobby-create-btn:hover {
      box-shadow: 0 8px 16px rgba(76, 29, 149, 0.22);
      filter: brightness(1.01);
    }

    #reloginPanel .lobby-login-btn:active,
    #reloginPanel .lobby-create-btn:active,
    #createTeamPanel .lobby-login-btn:active,
    #createTeamPanel .lobby-create-btn:active {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      box-shadow: 0 4px 10px rgba(76, 29, 149, 0.16);
    }

    .lobby-card {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
      padding: 14px 15px;
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(5px);
    }

    .lobby-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .lobby-my-groups {
      padding-top: 12px;
    }
    .lobby-my-groups-title {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin: 0 0 10px;
      padding: 2px 0 8px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      cursor: default;
      user-select: none;
    }
    .lobby-my-groups-title-main {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #4c1d95;
      text-transform: uppercase;
      position: relative;
      padding-left: 10px;
    }
    .lobby-my-groups-title-main::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 4px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #7c3aed, #6366f1);
    }
    .lobby-my-groups-title-sub {
      font-size: 10px;
      font-weight: 700;
      color: rgba(76, 29, 149, 0.6);
      white-space: nowrap;
    }
    .recent-item-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .recent-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .recent-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.6;
      white-space: nowrap;
    }
    .recent-badge-active {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .recent-badge-inactive {
      background: #fff7ed;
      color: #b45309;
      border: 1px solid #fed7aa;
    }
    .recent-badge-pending {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .recent-enter-btn {
      flex-shrink: 0;
      margin-left: 10px;
      min-width: 74px;
      height: 32px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }
    .recent-enter-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(76, 29, 149, 0.2);
      filter: brightness(1.01);
    }
    .recent-enter-btn:disabled {
      cursor: not-allowed;
      background: #e5e7eb;
      color: #6b7280;
      box-shadow: none;
      transform: none;
      filter: none;
    }

    .lobby-panel-title {
      width: 100%;
      margin: 0 0 8px;
      padding: 13px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(76, 29, 149, 0.3);
      line-height: 1.2;
    }

    .lobby-help {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
    }

    .lobby-help details {
      margin-bottom: 10px;
      padding: 11px 13px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(30, 27, 75, 0.08);
    }

    .lobby-help summary {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .faq-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
    }

    .faq-list>li {
      margin: 0 0 6px;
    }

    .faq-title {
      display: block;
      font-weight: 700;
    }

    .faq-sublist {
      margin: 2px 0 0 18px;
      padding: 0;
      list-style: none;
    }

    .faq-sublist li {
      display: block;
      white-space: normal;
    }

    .lobby-version {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.62;
      letter-spacing: 0.02em;
      pointer-events: none;
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
    }

    .global-copyright {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.68;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
    }

    .overlay-copyright {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #4b5563;
      opacity: 0.7;
      letter-spacing: 0.02em;
      pointer-events: none;
      white-space: nowrap;
    }

    body.lobby-mode .lobby-version {
      position: static;
      left: auto;
      bottom: auto;
      transform: none;
      margin-top: auto;
      white-space: normal;
      line-height: 1.45;
    }

    body.lobby-mode .global-copyright {
      display: none !important;
    }

    .lobby-copyright-inline {
      display: block;
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* === Schedule Section === */
    .schedule-section {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 16px 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .schedule-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .schedule-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .schedule-row:last-child {
      margin-bottom: 0;
    }

    .schedule-label {
      font-size: 11px;
      font-weight: 700;
      width: 34px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .schedule-label-practice {
      color: var(--practice);
    }

    .schedule-label-match {
      color: var(--match);
    }

    .schedule-chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1.1;
    }

    .schedule-chip:active {
      transform: scale(0.92);
    }

    .schedule-chip .chip-dow {
      font-size: 9px;
      font-weight: 400;
      opacity: 0.7;
    }

    .chip-practice {
      background: #eff6ff;
      color: var(--practice);
      border-color: #bfdbfe;
    }

    .chip-practice.chip-today {
      background: var(--practice);
      color: #fff;
      border-color: var(--practice);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .chip-match {
      background: #fdf2f8;
      color: var(--match);
      border-color: #fbcfe8;
    }

    .chip-match.chip-today {
      background: var(--match);
      color: #fff;
      border-color: var(--match);
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.3);
    }

    .chip-past-deadline {
      background: #f3f4f6 !important;
      color: #9ca3af !important;
      border-color: #d1d5db !important;
      box-shadow: none !important;
    }

    .chip-selected {
      outline: 3px solid var(--primary);
      outline-offset: 1px;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.18);
    }

    .schedule-empty {
      font-size: 12px;
      color: var(--text-light);
      padding: 4px 0;
    }

    /* === Context Bar (selected date info) === */
    .context-bar {
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 0;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .context-date {
      font-size: 18px;
      font-weight: 700;
    }

    .context-mode {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .context-mode-practice {
      background: #dbeafe;
      color: var(--practice);
    }

    .context-mode-match {
      background: #fce7f3;
      color: var(--match);
    }

    .context-deadline {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-light);
    }

    .context-deadline.urgent {
      color: var(--absent);
      font-weight: 600;
    }
    .context-deadline-meta {
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.1);
      color: #5b21b6;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .context-deadline-meta.warn {
      background: rgba(220, 38, 38, 0.12);
      color: #b91c1c;
    }

    /* === Summary === */
    .summary {
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 13px 22px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      font-size: 13px;
      transition: background 0.4s ease;
      flex-shrink: 0;
    }

    .summary.flash {
      background: #ede9fe;
    }

    .summary span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .summary-filter-btn {
      margin-left: auto;
      border: 1px solid rgba(124, 58, 237, 0.26);
      background: #fff;
      color: #5b21b6;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .14s ease, box-shadow .18s ease;
    }
    .summary-filter-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(76, 29, 149, 0.14);
    }
    .summary-filter-btn.active {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      border-color: transparent;
    }

    .summary .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-present {
      background: var(--present);
    }

    .dot-absent {
      background: var(--absent);
    }

    .dot-late {
      background: var(--late);
    }

    .dot-early {
      background: var(--early);
    }

    .dot-total {
      background: var(--primary);
    }

    .dot-none {
      background: var(--unset);
    }

    /* === Info lists (none / present) === */
    .info-list {
      width: min(1080px, calc(100% - 28px));
      margin: 8px auto 0;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.89);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(30, 27, 75, 0.08);
      font-size: 12px;
      color: var(--text-light);
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .info-list strong {
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }

    .copy-btn {
      margin-left: auto;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 11px;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      transition: transform .16s ease, box-shadow .2s ease, background .2s ease;
    }

    .copy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 27, 75, 0.12);
    }

    .copy-btn:active {
      background: var(--bg);
    }

    /* === Member Cards === */
    main {
      padding: 12px 4px 110px;
      width: min(1080px, calc(100% - 28px));
      margin: 10px auto 18px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
    }

    .member-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      border: 1px solid var(--surface-border);
      padding: 14px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 10px 28px rgba(30, 27, 75, 0.11);
      transition: background 0.6s ease;
    }

    .member-card.highlight {
      background: #ede9fe;
    }

    .member-card.locked {
      opacity: 0.45;
      pointer-events: none;
    }

    .member-name {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
      min-width: 0;
    }

    .member-name.self-highlight {
      color: #4c1d95;
      font-weight: 800;
    }

    .self-pill {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: #5b21b6;
      background: #ede9fe;
      border: 1px solid rgba(124, 58, 237, 0.28);
      vertical-align: middle;
    }

    .badge-none {
      font-size: 10px;
      color: var(--text-light);
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1px 7px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .badge-time {
      font-size: 10px;
      font-weight: 600;
      border-radius: 8px;
      padding: 1px 7px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .badge-time-late {
      color: #92400e;
      background: #fef3c7;
    }

    .badge-time-early {
      color: #1e40af;
      background: #dbeafe;
    }

    .status-buttons {
      display: flex;
      gap: 5px;
    }

    .status-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fff;
      font-size: 17px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 27, 75, 0.12);
    }

    .status-btn:active {
      transform: scale(0.92);
    }

    .status-btn[data-status="present"] {
      font-size: 20px;
    }

    .status-btn.active-present {
      border-color: var(--present);
      background: linear-gradient(135deg, #fef9c3, #dcfce7);
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.15);
    }

    .status-btn.active-absent {
      border-color: var(--absent);
      background: #fee2e2;
    }

    .status-btn.active-late {
      border-color: var(--late);
      background: #fef3c7;
    }

    .status-btn.active-early {
      border-color: var(--early);
      background: #dbeafe;
    }

    .status-btn .btn-label {
      font-size: 13px;
      font-weight: 700;
      border: none;
      padding: 0;
      line-height: 1;
    }

    .status-btn.active-late .btn-label,
    .status-btn.active-early .btn-label {
      font-weight: 900;
    }


    .time-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-light);
    }

    .time-row input[type="time"] {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
    }

    .member-meta {
      width: 100%;
      display: flex;
      gap: 12px;
      font-size: 10px;
      color: var(--text-light);
      margin-top: 4px;
      padding-left: 2px;
    }


    .empty-state {
      display: flex;
      justify-content: center;
      padding: 56px 20px;
    }

    .empty-state-card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(124, 58, 237, 0.18);
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(76, 29, 149, 0.14);
      padding: 24px 20px 20px;
      text-align: center;
    }

    .empty-state-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(124, 58, 237, 0.08));
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .empty-state-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.65;
    }

    .empty-state-hint {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.2);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .empty-state-hint:hover {
      background: rgba(124, 58, 237, 0.13);
      box-shadow: 0 8px 20px rgba(76, 29, 149, 0.12);
      transform: translateY(-1px);
    }

    .empty-state-hint:active {
      transform: translateY(0);
    }

    /* === Modal === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.44);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      border: 1px solid var(--surface-border);
      padding: 24px;
      width: min(90vw, 360px);
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.22);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .modal input[type="text"]:focus {
      border-color: var(--primary-light);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-cancel {
      background: var(--border);
      color: var(--text);
    }

    .btn-confirm {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      box-shadow: 0 10px 20px rgba(76, 29, 149, 0.22);
    }

    .btn-cancel,
    .btn-confirm {
      transition: transform .16s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-cancel:hover,
    .btn-confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.16);
    }

    .btn-confirm:active {
      filter: brightness(0.98);
    }

    .modal-close-x {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-light);
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-close-x:hover {
      background: var(--bg);
    }

    .modal-close-x:active {
      background: var(--border);
    }

    .deadline-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .deadline-field label {
      width: 40px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .deadline-field input[type="number"] {
      width: 52px;
      padding: 6px 4px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    .deadline-field input[type="number"]:focus {
      border-color: var(--primary-light);
    }

    .deadline-field select {
      padding: 6px 4px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .deadline-field select:focus {
      border-color: var(--primary-light);
    }

    /* === Calendar Edit Modal === */
    .cal-edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: var(--bg);
      flex-direction: column;
    }

    .cal-edit-overlay.show {
      display: flex;
    }

    .cal-edit-header {
      background: var(--primary);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-edit-header h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .cal-edit-body {
      overflow-y: auto;
      padding: 16px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 420px;
      margin: 0 auto;
    }

    .cal-dow {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      padding: 4px 0;
    }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      color: var(--text);
      background: var(--card);
    }

    .cal-cell:active {
      transform: scale(0.92);
    }

    .cal-cell.cal-empty {
      background: transparent;
      cursor: default;
    }

    .cal-cell.cal-practice {
      background: #dbeafe;
      color: var(--practice);
      border-color: var(--practice);
    }

    .cal-cell.cal-match {
      background: #fce7f3;
      color: var(--match);
      border-color: var(--match);
    }

    .cal-cell.cal-selected-day {
      outline: 3px solid var(--primary);
      outline-offset: 1px;
    }

    .cal-cell.cal-today-mark {
      font-weight: 900;
      text-decoration: underline;
    }

    .picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .picker-overlay.show {
      display: flex;
    }

    .picker-modal {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      width: min(90vw, 360px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .picker-header h3 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
      text-align: center;
    }

    .picker-nav {
      background: none;
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .picker-nav:active {
      background: var(--bg);
    }

    .cal-legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 16px 0 8px;
      font-size: 12px;
      color: var(--text-light);
    }

    .cal-legend span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .cal-legend .leg-practice::before {
      background: var(--practice);
    }

    .cal-legend .leg-match::before {
      background: var(--match);
    }

    .cal-edit-actions {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .cal-edit-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .cal-edit-actions .btn-cancel {
      background: var(--bg);
      color: var(--text);
    }

    .cal-edit-actions .btn-confirm {
      background: var(--primary);
      color: #fff;
    }

    .schedule-edit-btn {
      margin-left: auto;
      width: 34px;
      height: 34px;
      font-size: 14px;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      line-height: 1;
      white-space: nowrap;
    }

    .schedule-edit-btn .schedule-edit-icon {
      font-size: 20px;
      line-height: 1;
    }

    .schedule-edit-btn:active {
      opacity: 0.6;
    }

    .schedule-title {
      display: flex;
      align-items: center;
    }

    /* === Member Settings Modal === */
    .ms-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .ms-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .ms-name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
    }

    .ms-name.current-user {
      color: #4c1d95;
      font-weight: 800;
    }

    .admin-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #4c1d95;
      background: linear-gradient(135deg, #f3e8ff, #ede9fe);
      border: 1px solid rgba(124, 58, 237, 0.32);
      box-shadow: 0 4px 10px rgba(76, 29, 149, 0.14);
      vertical-align: middle;
      white-space: nowrap;
    }

    .admin-role-badge::before {
      content: "★";
      font-size: 9px;
      line-height: 1;
      color: #7c3aed;
    }

    .ms-delete {
      background: transparent;
      border: none;
      color: var(--absent);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .pin-reveal-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(124, 58, 237, 0.28);
      border-radius: 10px;
      background: linear-gradient(180deg, #fff, #f5f3ff);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .ms-item {
      align-items: flex-start;
      flex-direction: column;
      gap: 6px;
    }

    .ms-item-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ms-meta {
      width: 100%;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ms-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      letter-spacing: 0.01em;
    }

    .ms-chip-pending {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    .ms-chip-inactive {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .ms-action-btn {
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid rgba(124, 58, 237, 0.28);
      background: #fff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .ms-action-btn.warn {
      border-color: #f59e0b;
      color: #b45309;
      background: #fffdf5;
    }

    .ms-action-btn.danger {
      border-color: #fca5a5;
      color: #b91c1c;
      background: #fff5f5;
    }

    input[type="text"],
    input[type="tel"],
    input[type="password"],
    input[type="number"],
    input[type="time"],
    select,
    textarea {
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus,
    input[type="number"]:focus,
    input[type="time"]:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(124, 58, 237, 0.62) !important;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.16);
      outline: none;
      background: #fff;
    }

    @media (max-width: 768px) {

      header,
      .schedule-section,
      .context-bar,
      .summary,
      .info-list,
      main {
        width: calc(100% - 20px);
      }

      header {
        margin: 10px auto 8px;
        border-radius: 18px;
        padding: 8px 14px 7px;
      }

      .schedule-section,
      .context-bar,
      .summary,
      .info-list {
        padding-left: 14px;
        padding-right: 14px;
        border-radius: 14px;
      }

      main {
        margin-top: 8px;
        padding-bottom: 96px;
      }

      .lobby-card,
      .lobby-help,
      .lobby-subcopy {
        max-width: 100%;
      }

      .lobby-logo {
        font-size: 34px;
      }

      #dateInput {
        min-width: 152px;
        width: 152px;
      }

      .date-row .today-badge {
        margin-left: 6px;
      }

      .date-row {
        margin-top: -7px;
      }

      #loginStatus {
        max-width: 160px;
        font-size: 11px !important;
      }

      .title-edit-row {
        width: min(22ch, calc(100vw - 200px));
      }
    }

    /* === UI Polish Pass === */
    .lobby-card {
      border-radius: 20px;
      border-color: rgba(124, 58, 237, 0.2);
      box-shadow: 0 16px 34px rgba(30, 27, 75, 0.12);
    }

    .lobby-help details {
      border-radius: 16px;
      border-color: rgba(124, 58, 237, 0.14);
    }

    .lobby-help summary {
      letter-spacing: 0.01em;
    }

    .schedule-section,
    .context-bar,
    .summary,
    .info-list {
      border-color: rgba(124, 58, 237, 0.14);
      box-shadow: 0 12px 30px rgba(30, 27, 75, 0.11);
    }

    .schedule-section {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
    }

    .schedule-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: #312e81;
    }

    .context-date {
      color: #1f2152;
      letter-spacing: 0.01em;
    }

    .summary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
    }

    .summary .dot {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }

    .member-card {
      border-color: rgba(124, 58, 237, 0.12);
      box-shadow: 0 14px 28px rgba(30, 27, 75, 0.1);
      transition: transform .16s ease, box-shadow .2s ease, background .4s ease;
    }

    .member-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(30, 27, 75, 0.14);
      border-color: rgba(124, 58, 237, 0.24);
    }

    .status-btn {
      border-width: 1.5px;
      border-color: rgba(148, 163, 184, 0.48);
    }

    .status-btn:not(.active-present):not(.active-absent):not(.active-late):not(.active-early) {
      background: linear-gradient(180deg, #fff, #f8fafc);
    }

    .modal {
      border-radius: 20px;
      border-color: rgba(124, 58, 237, 0.18);
      box-shadow: 0 24px 54px rgba(15, 23, 42, 0.24);
    }

    .btn-cancel {
      background: linear-gradient(180deg, #ffffff, #f3f4f6);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #334155;
      font-weight: 700;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    #changeAdminBtn {
      border-color: rgba(245, 158, 11, 0.6) !important;
      color: #92400e !important;
      background: linear-gradient(180deg, #fffdf7, #fff) !important;
      border-radius: 11px !important;
      box-shadow: 0 8px 18px rgba(245, 158, 11, 0.15) !important;
    }

    #changeAdminConfirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      box-shadow: 0 10px 18px rgba(217, 119, 6, 0.25) !important;
      border-radius: 10px !important;
    }

    #changeAdminCancel {
      background: linear-gradient(180deg, #ffffff, #f5f3ff) !important;
      border: 1px solid rgba(124, 58, 237, 0.28) !important;
      color: var(--primary) !important;
      box-shadow: 0 6px 14px rgba(76, 29, 149, 0.1) !important;
    }

    #openRecoverPanelBtn {
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.12), rgba(124, 58, 237, 0.07)) !important;
      border-color: rgba(124, 58, 237, 0.34) !important;
    }

    #invitePopup .modal,
    #appSettingsModal .modal {
      background: linear-gradient(180deg, #fcfcff, #f8f7ff);
    }

    @media (max-width: 768px) {
      .member-card:hover {
        transform: none;
      }

      .schedule-title {
        font-size: 13px;
      }

      .beta-notice {
        font-size: 11px;
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const MAINTENANCE_MODE = false;

      if (MAINTENANCE_MODE) {
        document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;">
        <div>
          <h1>メンテナンス中</h1>
          <p>現在アップデート作業中です。</p>
        </div>

      }
    });
  </script>

  <header>
    <div class="header-top">
      <div class="title-block">
        <h1 id="appTitle"></h1>
        <button id="editGroupNameBtn" class="group-title-edit-btn" type="button">🏷️ 名前変更</button>
      </div>
      <span id="loginStatus"></span>
      <div style="display:flex;gap:6px">
        <button class="settings-btn" id="memberSettingsBtn" title="メンバー管理"><svg xmlns="http://www.w3.org/2000/svg"
            width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg></button>
        <button class="settings-btn" id="gearBtn" title="締切設定"><svg xmlns="http://www.w3.org/2000/svg" width="18"
            height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg></button>
        <button class="settings-btn" id="appSettingsBtn" title="設定"><svg xmlns="http://www.w3.org/2000/svg" width="18"

            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg></button>
      </div>
    </div>
    <div class="date-row">
      <div class="date-main">
        <button id="prevDay">‹</button>
        <input type="date" id="dateInput">
        <button id="nextDay">›</button>
        <span class="today-badge" id="todayBadge" style="display:none">今日</span>
      </div>
    </div>
    <div class="header-none-count" id="headerNoneCount"></div>
  </header>
  <div id="betaNotice" class="beta-notice" role="status" aria-live="polite">現在はβ版として無料公開中です。今後の仕様変更はアプリ内でご案内します。</div>

  <div class="picker-overlay" id="datePickerOverlay">
    <div class="picker-modal">
      <div class="picker-header">
        <button class="picker-nav" id="pickerPrev">‹</button>
        <h3 id="pickerTitle"></h3>
        <button class="picker-nav" id="pickerNext">›</button>
      </div>
      <div class="cal-grid" id="pickerGrid"></div>
      <div class="cal-legend" style="margin-bottom:0">
        <span class="leg-practice">練習</span>
        <span class="leg-match">試合</span>
      </div>
    </div>
  </div>

  <div class="schedule-section" id="scheduleSection"></div>

  <div class="context-bar" id="contextBar"></div>

  <div class="summary" id="summary"></div>
  <div class="info-list" id="noneList" style="display:none"></div>
  <div class="info-list" id="presentList" style="display:none"></div>

  <main id="memberList"></main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal" style="position:relative">
      <button class="modal-close-x" id="settingsCloseX">&times;</button>
      <h2>締切設定</h2>
      <div class="deadline-field" style="margin-bottom:4px">
        <label>練習</label>
        <label style="position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;flex-shrink:0">
          <input type="checkbox" class="dl-mode-toggle" data-dl-mode="practice" style="opacity:0;width:0;height:0">
          <span class="dl-toggle-track"
            style="position:absolute;inset:0;background:#ccc;border-radius:22px;transition:.2s"></span>
          <span class="dl-toggle-thumb"
            style="position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s"></span>
        </label>
        <input type="number" id="dlPracticeDays" min="0" max="30" value="1">
        <span>日前</span>
        <select id="dlPracticeHour"></select>
        <span>時</span>
      </div>
      <div class="deadline-field">
        <label>試合</label>
        <label style="position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;flex-shrink:0">
          <input type="checkbox" class="dl-mode-toggle" data-dl-mode="match" style="opacity:0;width:0;height:0">
          <span class="dl-toggle-track"
            style="position:absolute;inset:0;background:#ccc;border-radius:22px;transition:.2s"></span>
          <span class="dl-toggle-thumb"
            style="position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s"></span>
        </label>
        <input type="number" id="dlMatchDays" min="0" max="30" value="3">
        <span>日前</span>
        <select id="dlMatchHour"></select>
        <span>時</span>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="settingsCancel">キャンセル</button>
        <button class="btn-confirm" id="settingsSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal" style="position:relative">
      <button class="modal-close-x" id="loginCloseX">&times;</button>
      <h2>ログイン</h2>
      <div id="loginStep1">
        <div id="newMemberSection" style="margin-bottom:8px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">新しいメンバーとして参加</label>
          <input type="text" id="newMemberNameInput" placeholder="あなたの名前" autocomplete="off"
            style="width:100%;padding:10px;border:2px solid var(--border);border-radius:12px;font-size:15px;outline:none;margin-bottom:6px;box-sizing:border-box">

          <input type="tel" id="newMemberPinInput" inputmode="numeric" maxlength="4" placeholder="ログインPIN（4桁）"
            autocomplete="off"
            style="width:100%;padding:10px;border:2px solid var(--border);border-radius:12px;font-size:15px;outline:none;margin-bottom:6px;box-sizing:border-box;letter-spacing:4px">


          <button class="btn-confirm" id="newMemberJoinBtn"
            style="width:100%;padding:10px 16px;">参加する</button>
        </div>
        <div id="loginError" style="color:var(--absent);font-size:13px;margin-top:6px;display:none"></div>
        <div class="modal-actions"><button class="btn-cancel" id="loginCancel">キャンセル</button></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal">
    <div class="modal" style="position:relative">
      <button class="modal-close-x" id="adminModalCloseX">&times;</button>
      <h2>管理者設定</h2>
      <div style="margin-bottom:16px">
        <label style="font-size:14px;font-weight:600;display:block;margin-bottom:6px">管理者PIN（4桁）変更</label>
        <input type="password" id="adminNewPwInput" placeholder="新しいパスワード"
          style="width:100%;padding:10px;border:2px solid var(--border);border-radius:12px;font-size:15px;outline:none">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="adminModalCancel">閉じる</button>
        <button class="btn-confirm" id="adminModalSave">保存</button>
      </div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <button id="adminResetBtn"
          style="width:100%;padding:10px;border:1px solid var(--absent);border-radius:12px;background:#fff;color:var(--absent);font-size:14px;font-weight:600;cursor:pointer">管理者リセット</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="groupNameModal">
    <div class="modal" style="position:relative;max-width:360px">
      <button class="modal-close-x" id="groupNameCloseX">&times;</button>
      <h2>グループ名を変更</h2>
      <input type="text" id="groupNameInput" maxlength="18" placeholder="グループ名を入力" autocomplete="off">
      <div id="groupNameError" style="display:none;font-size:12px;color:var(--absent);margin-top:8px"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="groupNameCancel">キャンセル</button>
        <button class="btn-confirm" id="groupNameSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="userMenu">
    <div class="modal" style="max-width:260px;text-align:center">
      <div id="userMenuItems" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>

  <div class="modal-overlay" id="appSettingsModal">
    <div class="modal" style="max-width:340px">
      <h2 style="margin-bottom:12px">設定</h2>
      <div style="text-align:center;margin-bottom:16px;padding:12px;background:var(--bg);border-radius:12px">
        <div style="font-size:13px;color:var(--text-light)">バージョン</div>
        <div id="appVersionDisplay" style="font-size:15px;font-weight:700;color:var(--text);margin-top:2px"></div>
        <div id="appCopyrightDisplay" style="font-size:11px;color:var(--text-light);margin-top:6px"></div>
      </div>
      <div style="text-align:center;margin-bottom:16px;padding:12px;background:#f8f7ff;border:1px solid rgba(124,58,237,0.2);border-radius:12px">
        <div style="font-size:12px;color:var(--text-light)">あなたのPIN</div>
        <div id="appMyPinDisplay" style="font-size:22px;font-weight:800;letter-spacing:4px;color:var(--text);margin-top:4px">••••</div>
        <button id="appMyPinRevealBtn" type="button" class="pin-reveal-btn">3秒だけ表示する</button>
      </div>
      <div style="padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px">
        <button id="backToLobbyBtn"
          style="width:100%;padding:12px;border:2px solid var(--primary);border-radius:12px;background:#fff;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer">ロビーに戻る</button>

        <button id="leaveGroupBtn"
          style="display:none;width:100%;padding:10px;border:1px solid #f59e0b;border-radius:12px;background:#fff;color:#92400e;font-size:13px;font-weight:700;cursor:pointer">退会する</button>
        <button id="deleteGroupBtn"
          style="width:100%;padding:8px;border:1px solid var(--absent);border-radius:8px;background:#fff;color:var(--absent);font-size:12px;font-weight:600;cursor:pointer;opacity:0.7">グループを削除する</button>
      </div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn-confirm" id="appSettingsClose">閉じる</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteGroupModal">
    <div class="modal" style="max-width:340px">
      <h2 style="color:var(--absent);margin-bottom:12px">グループを削除</h2>
      <div
        style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#991b1b">

      style="display:none;position:absolute;z-index:10;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.18);padding:6px;min-width:160px">

        style="display:block;width:100%;padding:10px 14px;border:none;background:none;text-align:left;font-size:14px;border-radius:10px;cursor:pointer"></button>
      <div style="border-top:1px solid var(--border);margin:4px 0"></div>
      <button id="calMenuDelete"
        style="display:block;width:100%;padding:10px 14px;border:none;background:none;text-align:left;font-size:14px;border-radius:10px;cursor:pointer;color:var(--absent)">🗑
        削除</button>

  <script>
    const _urlParams = new URL(location.href).searchParams;
    const _teamParam = _urlParams.get("team");
    const _inviteNameParam = (_urlParams.get("name") || '').trim();
    const _pendingInviteTeam = (_urlParams.get("inviteTeam") || '').trim();
    const _pendingInviteName = (_urlParams.get("inviteName") || '').trim();
    const RECENT_KEY = 'volley-recent-teams';
    const INVITE_KEY = 'volley-invite-link';
    const ADMIN_RECOVERY_SUFFIX = 'volley-admin-recovery-code';
    const API_BASE = "https://team-limit-worker.smoolinq.workers.dev";
    const CREATED_TEAMS_KEY = 'volley-created-teams';
    const MAX_CREATED_TEAMS_PER_DEVICE = 5;

    function createSessionId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function generateRecoveryCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 12; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
        if (i === 3 || i === 7) out += '-';
      }
      return out;
    }

    function getRecentTeams() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
    }
    function getInviteData() {
      try {
        const data = JSON.parse(localStorage.getItem(INVITE_KEY) || 'null');
        if (!data || !data.id) return null;
        return data;
      } catch {
        return null;
      }
    }
    function setInviteData(data) {
      if (!data || !data.id) return;
      localStorage.setItem(INVITE_KEY, JSON.stringify({
        id: String(data.id || '').trim().toLowerCase(),
        name: data.name || null,
        pending: data.pending !== false
      }));
    }
    function clearInviteForTeam(teamId) {
      const invite = getInviteData();
      if (!invite || !invite.id) return;
      if (!teamId || invite.id === String(teamId || '').trim().toLowerCase()) {
        localStorage.removeItem(INVITE_KEY);
      }
    }

    function getCreatedTeams() {
      try {
        const raw = JSON.parse(localStorage.getItem(CREATED_TEAMS_KEY)) || [];
        const clean = raw
          .filter(id => typeof id === 'string')
          .map(id => id.trim().toLowerCase())
          .filter(Boolean);
        return Array.from(new Set(clean));
      } catch {
        return [];
      }
    }

    function setCreatedTeams(teamIds) {
      const clean = Array.from(new Set((teamIds || [])
        .filter(id => typeof id === 'string')
        .map(id => id.trim().toLowerCase())
        .filter(Boolean)));
      localStorage.setItem(CREATED_TEAMS_KEY, JSON.stringify(clean));
    }

    function pruneCreatedTeams() {
      const deleted = (() => {
        try { return JSON.parse(localStorage.getItem('volley-deleted-teams')) || []; } catch { return []; }
      })();
      const next = getCreatedTeams().filter(teamId => {
        if (deleted.includes(teamId)) return false;
        return !!localStorage.getItem(teamId + ':volley-admin-name');
      });
      setCreatedTeams(next);
      return next;
    }

      function isKnownTeam(teamId) {
        if (!teamId) return false;
        return getRecentTeams().some(t => t.id === teamId);
      }

      function getInactiveCountdownLabel(inactivatedAt) {
        const base = Date.parse(String(inactivatedAt || ''));
        if (!Number.isFinite(base)) return '';
        const limit = base + 30 * 24 * 60 * 60 * 1000;
        const remainMs = limit - Date.now();
        if (remainMs <= 0) return '退会中（復帰期限切れ）';
        const days = Math.ceil(remainMs / (24 * 60 * 60 * 1000));
        return days <= 1 ? '退会中（復帰期限: 本日まで）' : `退会中（復帰期限まで あと${days}日）`;
      }

    function ensureGlobalCopyrightFooter() {
      let footer = document.getElementById('globalCopyright');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'globalCopyright';
        footer.className = 'global-copyright';
        document.body.appendChild(footer);
      }
      footer.textContent = '© 2026 smoolinq';
    }
    function setGlobalCopyrightVisible(visible) {
      const footer = document.getElementById('globalCopyright');
      if (!footer) return;
      footer.style.display = visible ? '' : 'none';
    }

    const _fromInviteCard = sessionStorage.getItem('inviteFromCard') === '1';
    const _isKnownTeam = isKnownTeam(_teamParam);

    // Invite URL from a new device: store pending invite then return to lobby.
    if (_teamParam && !_isKnownTeam && !_fromInviteCard) {
      const savedTitle = localStorage.getItem(_teamParam + ':volley-app-title');
      const inviteName = _inviteNameParam || savedTitle || '';
      setInviteData({ id: _teamParam, name: inviteName || null, pending: true });
      location.href = location.pathname + '?inviteTeam=' + encodeURIComponent(_teamParam) + '&inviteName=' + encodeURIComponent(inviteName);
      throw new Error('redirect to lobby');
    }

    if (!_teamParam) {
      // --- Lobby Screen ---
      document.body.classList.add('lobby-mode');
      const betaNoticeEl = document.getElementById('betaNotice');
      if (betaNoticeEl) betaNoticeEl.style.display = 'none';
      if (_pendingInviteTeam) {
        setInviteData({ id: _pendingInviteTeam, name: _pendingInviteName || null, pending: true });
        history.replaceState(null, '', location.pathname);
      }
      document.body.innerHTML = '';
      document.body.style.overflowY = 'auto';
      document.body.style.overflowX = 'hidden';
      document.body.style.height = 'auto';
      document.body.style.display = 'block';
      function getRecent() {
        const recent = getRecentTeams();
        let changed = false;
        const normalized = recent.map(t => {
          const localName = (localStorage.getItem(t.id + ':volley-app-title') || '').trim();
          if (!t.name && localName) {
            changed = true;
            return { ...t, name: localName };
          }
          return t;
        });
        if (changed) localStorage.setItem(RECENT_KEY, JSON.stringify(normalized));
        return normalized;
      }

      function hasLocalLogin(teamId) {
        const t = teamId + ':';
        const loginType = (localStorage.getItem(t + 'volley-login-type') || '').trim();
        const editor = (localStorage.getItem(t + 'volley-editor') || '').trim();
        return !!(loginType && editor);
      }

      // Lobby custom confirm
      function lobbyConfirm(msg) {
        return new Promise(resolve => {
          const ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px';
          ov.innerHTML = '<div style="max-width:300px;width:100%;text-align:center;background:#fff;border-radius:16px;padding:24px 20px 18px">' +
            '<div style="font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:20px;line-height:1.5;white-space:pre-line"></div>' +
            '<div style="display:flex;gap:8px">' +
            '<button style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-size:14px;font-weight:600;cursor:pointer">いいえ</button>' +
            '<button style="flex:1;padding:10px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:14px;font-weight:600;cursor:pointer">はい</button>' +
            '</div></div>';
          ov.querySelector('[style*="white-space"]').textContent = msg;
          const [noBtn, yesBtn] = ov.querySelectorAll('button');
          yesBtn.addEventListener('click', () => { ov.remove(); resolve(true); });
          noBtn.addEventListener('click', () => { ov.remove(); resolve(false); });
          document.body.appendChild(ov);
        });
      }

      function showRecoveryCodeModal(recoveryCode) {
        return new Promise(resolve => {
          const ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px';
          ov.innerHTML =
            '<div style="max-width:380px;width:100%;background:#fff;border-radius:18px;padding:20px 18px 16px;box-shadow:0 18px 44px rgba(15,23,42,0.28)">' +
            '<div style="font-size:17px;font-weight:800;color:var(--text);margin-bottom:8px;text-align:center">復旧コードを保存してください</div>' +
            '<div style="font-size:13px;line-height:1.7;color:var(--text-light);margin-bottom:10px">' +
            'この復旧コードは、管理者PINを忘れたときに必要です。<br>' +
            'スクリーンショットまたはメモで必ず保存してください。<br>' +
            'この画面を閉じると再表示できません。' +
            '</div>' +
            '<div style="padding:12px;border:1px dashed rgba(124,58,237,0.45);border-radius:12px;background:#faf5ff;font-size:18px;font-weight:800;letter-spacing:1.2px;color:var(--primary);text-align:center;user-select:all;margin-bottom:10px" id="recoveryCodeText"></div>' +
            '<button id="copyRecoveryCodeBtn" style="width:100%;padding:10px;border:1px solid rgba(124,58,237,0.3);border-radius:12px;background:#fff;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px">復旧コードをコピー</button>' +
            '<label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);line-height:1.5;margin-bottom:12px;cursor:pointer">' +
            '<input id="confirmRecoverySaved" type="checkbox" style="margin-top:2px">' +
            '<span>復旧コードをスクリーンショットまたはメモで保存しました</span>' +
            '</label>' +
            '<button id="closeRecoveryModalBtn" disabled style="width:100%;padding:11px;border:none;border-radius:12px;background:#d1d5db;color:#fff;font-size:14px;font-weight:800;cursor:not-allowed">OK</button>' +
            '</div>';
          document.body.appendChild(ov);
          const codeEl = ov.querySelector('#recoveryCodeText');
          const copyBtn = ov.querySelector('#copyRecoveryCodeBtn');
          const check = ov.querySelector('#confirmRecoverySaved');
          const okBtn = ov.querySelector('#closeRecoveryModalBtn');
          codeEl.textContent = recoveryCode;
          copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(recoveryCode).then(() => {
              copyBtn.textContent = 'コピーしました';
              setTimeout(() => { copyBtn.textContent = '復旧コードをコピー'; }, 1500);
            });
          });
          check.addEventListener('change', () => {
            okBtn.disabled = !check.checked;
            okBtn.style.background = check.checked ? 'linear-gradient(135deg, var(--primary-light), var(--primary))' : '#d1d5db';
            okBtn.style.cursor = check.checked ? 'pointer' : 'not-allowed';
          });
          okBtn.addEventListener('click', () => {
            if (!check.checked) return;
            ov.remove();
            resolve(true);
          });
        });
      }

      const lobby = document.createElement('div');
      lobby.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100dvh;padding:24px 24px 56px;background:var(--bg)';

      const joinSection = document.createElement('div');
      joinSection.id = 'joinSection';
      joinSection.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:100%';

      const hero = document.createElement('div');
      hero.style.cssText = 'text-align:center;margin-top:24px;margin-bottom:28px';
      hero.innerHTML =
        '<div class="lobby-logo">出欠ちゃん</div>' +
        '<div class="lobby-subtitle">グループ管理Webアプリ</div>';


      joinSection.appendChild(hero);
      let inviteData = getInviteData();
      if (inviteData && inviteData.id) {
        const inviteCard = document.createElement('div');
        inviteCard.style.cssText = 'width:100%;max-width:360px;margin-bottom:20px;padding:18px 20px;background:var(--card);border:2px solid var(--primary);border-radius:16px;text-align:center';
        const displayName = inviteData.name || inviteData.id || 'グループ名を取得中';
        inviteCard.innerHTML =
          '<div id="inviteCardTitle" style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px"></div>' +
          '<button id="inviteJoinBtn" style="padding:12px 32px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer">このグループに参加する</button>';
        joinSection.appendChild(inviteCard);
        const inviteCardTitle = inviteCard.querySelector('#inviteCardTitle');
        if (inviteCardTitle) inviteCardTitle.textContent = '「' + displayName + '」に招待されています';

        if (!inviteData.name) {
          (async () => {
            try {
              const res = await fetch('https://club-attendance-api.smoolinq.workers.dev/?team=' + encodeURIComponent(inviteData.id));
              if (!res.ok) return;
              const data = await res.json();
              const fetchedName = typeof data?.title === 'string' ? data.title.trim() : '';
              if (!fetchedName) return;
              const latestRaw = localStorage.getItem(INVITE_KEY);
              let latest = null;
              try { latest = JSON.parse(latestRaw); } catch { }
              if (!latest || latest.id !== inviteData.id) return;
              latest.name = fetchedName;
              setInviteData(latest);
              if (inviteCardTitle) inviteCardTitle.textContent = '「' + fetchedName + '」に招待されています';
            } catch { }
          })();
        }
      }

      const actionCard = document.createElement('div');
      actionCard.className = 'lobby-card';
      actionCard.innerHTML =
        '<button id="openReloginBtn" class="lobby-login-btn">グループIDからログイン</button>' +
        '<button id="createTeamBtn" class="lobby-create-btn">新規にグループを作る</button>' +
        '<div id="reloginPanel" class="lobby-relogin-panel" style="display:none" data-mode="join">' +
        '<div id="reloginPanelTitle" class="lobby-panel-title">グループIDからログイン</div>' +
        '<div id="reloginModeSwitch" style="display:flex;gap:6px;margin-bottom:8px">' +
        '<button id="modeReloginBtn" type="button" class="lobby-create-btn" style="flex:1;margin:0;padding:8px 10px;font-size:12px">再ログイン</button>' +
        '<button id="modeJoinBtn" type="button" class="lobby-login-btn" style="flex:1;margin:0;padding:8px 10px;font-size:12px">新規参加</button>' +
        '</div>' +
        '<button id="cancelReloginSelectBtn" type="button" class="lobby-create-btn" style="margin-bottom:6px;padding:8px 10px;font-size:12px;border-radius:10px">キャンセル</button>' +
        '' +
        '<div id="reloginFormArea" style="display:none">' +
        '<input id="reloginGroupId" type="text" placeholder="グループID" autocomplete="off" style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;margin-bottom:6px;box-sizing:border-box;text-align:center">' +
        '<input id="reloginName" type="text" placeholder="あなたの名前" autocomplete="off" style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;margin-bottom:6px;box-sizing:border-box;text-align:center">' +

          try { attendancePractice = JSON.parse(attendancePracticeRaw || '{}'); } catch { attendancePractice = {}; }

            const upcoming = Array.isArray(schedule) ? schedule.filter(s => s && s.date >= todayKey) : [];

              const mode = s.mode === 'match' ? 'match' : 'practice';
              const day = mode === 'match' ? attendanceMatch[s.date] : attendancePractice[s.date];

            setReloginMode('relogin');

      // Generate random team ID (8 chars alphanumeric)
      function generateTeamId() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let id = '';
        for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];
        return id;
